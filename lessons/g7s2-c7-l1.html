/* محرك دروس الفصل الدراسي الثاني — خط عربي كبير وعريض، مناسب للمس والبروجكتر */
:root{
  --c1:#0E7490; --c2:#0B4F6C; --tint:#E0F2F7; --acc:#FACC15;
  --ink:#0F172A; --ink2:#334155; --line:#CBD5E1; --card:#FFFFFF; --soft:#F1F5F9;
  --good:#15803D; --goodbg:#DCFCE7; --bad:#B91C1C; --badbg:#FEE2E2; --warn:#B45309; --warnbg:#FEF3C7;
  --f:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --h1:46px; --h2:38px; --tx:30px; --q:33px; --btn:28px; --lab:26px;
  color-scheme:light;
}
@media (max-width:1100px){:root{--h1:40px;--h2:34px;--tx:28px;--q:30px;--btn:26px;--lab:24px}}
@media (max-width:700px){:root{--h1:30px;--h2:26px;--tx:22px;--q:23px;--btn:21px;--lab:20px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);font-weight:700;color:var(--ink);direction:rtl;background:linear-gradient(180deg,var(--sky1,#BDE3F5) 0,var(--sky2,#EAF6FC) 340px,#F4FAFD 100%);font-size:var(--tx);line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
img{max-width:100%;display:block}
.app{display:flex;flex-direction:column;height:100dvh}
/* الشريط العلوي */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--c2);color:#fff;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.top .tb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:6px 16px;font-size:22px;font-weight:800;min-height:52px;white-space:nowrap}
.top .tb:active{transform:scale(.97)}
.top .ttl{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.top .ttl small{display:block;font-size:17px;color:var(--acc);font-weight:700;line-height:1.2}
/* شريط المراحل */
.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);flex:none;scrollbar-width:thin;border-bottom:2px solid var(--line)}
.nav button{flex:none;border:2px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;min-height:52px;color:var(--ink2)}
.nav button .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:17px}
.nav button[aria-current=true]{background:var(--c1);border-color:var(--c1);color:#fff}
.nav button[aria-current=true] .n{background:var(--acc);color:var(--ink)}
.nav button.done .n{background:var(--goodbg);color:var(--good)}
/* المسرح */
.stage{flex:1;overflow-y:auto;padding:22px clamp(14px,3vw,40px) 30px;scroll-behavior:smooth}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sh{display:flex;align-items:center;gap:14px}
.sh .ic{width:68px;height:68px;border-radius:20px;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:36px;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.15)}
.sh h1{margin:0;font-size:var(--h1);line-height:1.25;color:var(--c2)}
.sh .pg{margin-inline-start:auto;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 14px;font-size:20px;color:var(--ink2);white-space:nowrap}
h2{margin:0 0 10px;font-size:var(--h2);color:var(--c2);line-height:1.3}
.card{background:var(--card);border-radius:24px;padding:22px 26px;box-shadow:0 10px 26px rgba(15,42,80,.10);border:2px solid #E2E8F0}
.card.tint{background:var(--tint);border-color:transparent}
.lead{font-size:calc(var(--tx) + 2px);color:var(--c2)}
p{margin:0 0 10px}
ul.bl{margin:0;padding:0 0 0 0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.bl li{position:relative;padding-inline-start:38px}
ul.bl li::before{content:"";position:absolute;inset-inline-start:6px;top:.62em;width:16px;height:16px;border-radius:5px;background:var(--c1);transform:rotate(45deg)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.two.rev{grid-template-columns:1fr 1.25fr}
@media (max-width:900px){.two,.two.rev{grid-template-columns:1fr}}
.fig{background:#fff;border-radius:20px;padding:10px;border:2px solid #E2E8F0}
.fig img{border-radius:12px;margin:0 auto;max-height:62vh;object-fit:contain}
.fig figcaption{font-size:20px;color:var(--ink2);padding:8px 6px 0;text-align:center}
.tag{display:inline-block;background:var(--c1);color:#fff;border-radius:999px;padding:2px 16px;font-size:20px;margin-bottom:8px}
.tag.y{background:var(--acc);color:var(--ink)}
.tag.g{background:var(--good)}
.hl{color:var(--c1)}
.quote{background:#ECFDF5;border:2px solid #10B981;color:#065F46;border-radius:20px;padding:14px 20px;text-align:center}
/* أزرار */
.btn{border:0;border-radius:18px;padding:10px 26px;font-size:var(--btn);font-weight:800;background:var(--c1);color:#fff;min-height:60px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.y{background:var(--acc);color:var(--ink)}
.btn.g{background:var(--good)}
.btn.gh{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 #CBD5E1}
.btn.sm{font-size:22px;min-height:50px;padding:6px 18px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;background:rgba(255,255,255,.85);border-top:2px solid var(--line);flex:none}
/* أسئلة */
.q{font-size:var(--q);line-height:1.5;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:800px){.opts{grid-template-columns:1fr}}
.opt{border:3px solid var(--line);background:#fff;border-radius:20px;padding:12px 18px;text-align:start;font-size:var(--tx);font-weight:800;min-height:72px;display:flex;align-items:center;gap:14px}
.opt .l{flex:none;width:48px;height:48px;border-radius:50%;background:var(--tint);color:var(--c2);display:grid;place-items:center;font-size:26px}
.opt:hover{border-color:var(--c1)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg);opacity:.85}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:14px 20px;font-size:calc(var(--tx) - 2px);display:none}
.fb.show{display:block;animation:pop .3s}
.fb.ok{background:var(--goodbg);color:#14532D;border:2px solid var(--good)}
.fb.no{background:var(--badbg);color:#7F1D1D;border:2px solid var(--bad)}
.fb.info{background:var(--warnbg);color:#78350F;border:2px solid #F59E0B}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.ans{display:none;margin-top:12px;background:var(--goodbg);border:2px solid var(--good);color:#14532D;border-radius:18px;padding:14px 20px}
.ans.show{display:block;animation:pop .3s}
body.nosol .solbtn{display:none!important}
.bq{border-inline-start:10px solid var(--c1)}
.bq .meta{font-size:20px;color:var(--ink2)}
textarea.inp,input.inp{font:inherit;font-size:var(--tx);width:100%;border:3px solid var(--line);border-radius:16px;padding:10px 16px;background:#FBFDFF;color:var(--ink)}
input.inp{width:auto;min-width:160px;text-align:center}
.inp:focus{outline:none;border-color:var(--c1)}
/* صح/خطأ */
.tfi{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:2px dashed #E2E8F0;flex-wrap:wrap}
.tfi .s{flex:1;min-width:260px}
.tfi .b{display:flex;gap:10px}
.tfi .b button{min-width:96px}
.tfi .fix{flex-basis:100%;color:#7F1D1D;background:var(--badbg);border-radius:14px;padding:8px 16px;display:none;font-size:calc(var(--tx) - 3px)}
.tfi .fix.show{display:block}
/* ترتيب وتصنيف */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border:3px solid var(--c1);background:#fff;border-radius:18px;padding:10px 18px;font-size:var(--tx);font-weight:800;min-height:62px}
.chip.sel{background:var(--acc);border-color:#CA8A04}
.chip.used{opacity:.35;pointer-events:none}
.chip.ok{background:var(--goodbg);border-color:var(--good)}
.chip.no{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.slot{min-height:66px;border:3px dashed var(--line);border-radius:18px;display:flex;align-items:center;gap:12px;padding:6px 16px;background:#fff}
.slot b{width:46px;height:46px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;flex:none;font-size:24px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.cat{border:3px dashed var(--c1);border-radius:20px;padding:12px;min-height:170px;background:#fff;display:flex;flex-direction:column;gap:8px}
.cat h3{margin:0;font-size:var(--lab);text-align:center;color:#fff;background:var(--c1);border-radius:12px;padding:4px}
.cat.drop{background:var(--tint)}
.cat .chip{font-size:calc(var(--tx) - 4px);min-height:50px;padding:6px 12px}
/* بطاقات تفاعلية */
.cardsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.flip{perspective:1200px;min-height:230px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;min-height:230px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;box-shadow:0 10px 22px rgba(0,0,0,.14)}
.flip .fa{background:var(--cc,var(--c1));color:#fff;font-size:calc(var(--tx) - 1px)}
.flip .fa small{font-size:20px;opacity:.95;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 14px;margin-bottom:8px}
.flip .fb2{background:#fff;color:var(--ink);border:4px solid var(--cc,var(--c1));transform:rotateY(180deg);font-size:calc(var(--tx) - 3px)}
.uno .fa{border:8px solid #fff;outline:3px solid var(--cc)}
.uno .fa::before{content:"";position:absolute;width:70%;height:55%;border-radius:50%;background:rgba(255,255,255,.18);transform:rotate(-30deg)}
/* الفرق */
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1;min-width:150px;border-radius:18px;padding:8px 12px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:22px}
.team b{font-size:34px}
.team button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:12px;width:48px;height:48px;font-size:28px}
/* مؤقت */
.timer{font-size:56px;font-weight:900;min-width:150px;text-align:center;background:#0F172A;color:var(--acc);border-radius:20px;padding:0 18px;font-variant-numeric:tabular-nums}
.timer.low{color:#F87171;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
/* محاكاة */
.sim{background:#0B1E33;border-radius:24px;padding:14px;color:#fff}
.sim canvas{width:100%;height:auto;display:block;border-radius:16px;background:#0F2740;touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px}
.ctrl label{font-size:var(--lab);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
input[type=range]{width:min(420px,70vw);height:44px;accent-color:var(--acc)}
.read{background:rgba(255,255,255,.1);border-radius:16px;padding:8px 16px;font-size:var(--lab)}
.read b{color:var(--acc)}
.sim .btn.gh{color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:3px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:16px;padding:6px 18px;font-size:var(--lab);font-weight:800;min-height:56px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
/* صندوق الأسرار وخريطة المفاهيم */
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.mbox{border:0;border-radius:22px;min-height:160px;background:linear-gradient(160deg,#7C3AED,#4C1D95);color:#fff;font-size:64px;box-shadow:0 10px 0 #3B0764}
.mbox.open{font-size:var(--tx);background:#fff;color:var(--ink);border:4px solid #7C3AED;box-shadow:none;padding:12px}
.cmap{display:flex;flex-direction:column;align-items:center;gap:10px}
.cnode{border:3px solid var(--c1);background:#fff;border-radius:999px;padding:8px 22px;text-align:center;min-width:200px}
.cnode.root{background:var(--c1);color:#fff;font-size:var(--h2)}
.clinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%}
.ccol{display:flex;flex-direction:column;align-items:center;gap:8px}
.ccol .lk{font-size:20px;color:var(--ink2)}
.blank{border:3px dashed var(--c1);border-radius:16px;min-width:200px;min-height:60px;background:#FFFBEB;padding:6px 14px;font-size:calc(var(--tx) - 2px);font-weight:800}
.blank.ok{border-style:solid;border-color:var(--good);background:var(--goodbg)}
/* شريط الذكريات */
.strip{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 14px;scroll-snap-type:x mandatory}
.strip .flip{flex:0 0 280px;scroll-snap-align:start}
.strip .end{flex:0 0 320px;border-radius:22px;background:var(--acc);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:calc(var(--tx) - 2px)}
/* إنجاز */
.badge{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#FEF3C7,#FFFFFF);border:4px solid #F59E0B;border-radius:28px;padding:22px}
.badge .medal{font-size:96px;line-height:1}
.stars{font-size:54px;letter-spacing:6px}
.tonly{display:none!important}
body.teacher .tonly{display:block!important}
body.teacher span.tonly{display:inline!important}
.tnote{background:#EEF2FF;border:2px dashed #6366F1;color:#3730A3;border-radius:16px;padding:10px 16px;font-size:21px}
.panel{position:fixed;inset:auto 14px 90px auto;z-index:50;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:16px;display:flex;flex-direction:column;gap:10px;width:min(420px,calc(100vw - 28px));font-size:22px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0F172A;color:#fff;border-radius:16px;padding:10px 22px;font-size:22px;z-index:60}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
table.dt{border-collapse:collapse;width:100%;font-size:calc(var(--tx) - 4px)}
table.dt th,table.dt td{border:2px solid var(--line);padding:8px 12px;text-align:center}
table.dt th{background:var(--c1);color:#fff}
.stepper{display:flex;flex-direction:column;gap:10px;counter-reset:st}
.stepper li{list-style:none;display:flex;gap:14px;align-items:flex-start}
.stepper li::before{counter-increment:st;content:counter(st,arabic-indic);flex:none;width:52px;height:52px;border-radius:16px;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:26px}
.stepper{padding:0;margin:0}
.safety{background:var(--badbg);border:2px solid var(--bad);color:#7F1D1D;border-radius:18px;padding:12px 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      { t: 'hero', tag: 'مشهد علمي حقيقي', img: 'cover', cap: 'إعصار جونو فوق بحر العرب (يونيو 2007م)', h: 'إعصار «جونو» يضرب سلطنة عمان', text: 'الأعاصير البحرية عواصف قوية تنشأ فوق المحيطات، ويمكن أن تُحدث دمارًا كبيرًا عند وصولها إلى اليابسة. في يونيو 2007م انطلق إعصار «جونو» شرق بحر العرب ليضرب سلطنة عمان برياحه العاتية وأمطاره الغزيرة.', q: 'ما الذي يحرّك الهواء ليصنع رياحًا بهذه القوة؟', a: 'الشمس تسخّن الهواء بدرجات مختلفة، فيتحرك الهواء من مكان إلى آخر. في هذا الدرس نكتشف كيف يتكوّن الغلاف الجوي، وكيف تصنع الحرارة والضغط الطقس والرياح.' },

      { t: 'poe', q: 'تجربة استهلالية (ص 15): وضعنا غشاءً من الماء والصابون على فوهة قنينة، ثم وضعنا القنينة في ماء ساخن. ماذا تتوقع أن يحدث للغشاء؟', opts: ['ينتفخ إلى الخارج', 'ينسحب إلى داخل القنينة', 'لا يتغير', 'ينفجر فورًا'], a: 0, observe: 'في الماء الساخن ينتفخ الغشاء إلى الخارج، وفي الماء المثلج ينسحب إلى الداخل.', explain: 'التسخين يزيد سرعة جزيئات الهواء فتتباعد ويتمدد الهواء ويدفع الغشاء إلى الخارج، والتبريد يبطئ الجزيئات فتتقارب وينكمش الهواء فينسحب الغشاء إلى الداخل. هكذا تؤثر درجة الحرارة في جزيئات الغاز!' },
      { t: 'sim', kind: 'gas', h: 'المختبر: جزيئات الهواء داخل القنينة', lead: 'غيّر حرارة الماء وراقب سرعة الجزيئات والغشاء الصابوني.' },
    ] },

      { t: 'text', h: '🗂 المطويات: منظمات الأفكار (ص 15)', list: ['اطوِ ورقة طوليًا بحيث تكون حافتها الأمامية أقصر من الخلفية بمقدار 1.25 سم.', 'اطوِ الورقة على استقامتها إلى ثلاثة أقسام، ثم قصّ الحافة المطوية للجزء العلوي لعمل ثلاثة ألسنة.', 'عنوِن الألسنة: ماذا أعرف؟ · ماذا أريد أن أعرف؟ · ماذا تعلمت؟', 'اقرأ واكتب: قبل القراءة اكتب ما تعرفه، وخلال القراءة اكتب ما تعلمته.'] },

    { short: 'الخبرات', icon: '🧠', title: 'استدعاء الخبرات والتقويم القبلي', page: 17, time: '7 دقائق', blocks: [
      { t: 'memory', lead: 'اختر بطاقة من شريط الذكريات، ناقش زملاءك، ثم اقلبها.', items: [{ q: 'هل للهواء كتلة؟ وهل يشغل حيزًا؟', a: 'نعم؛ الهواء مادة له كتلة ويشغل حيزًا.' }, { q: 'ما حالات المادة الثلاث؟', a: 'صلبة، وسائلة، وغازية.' }, { q: 'ماذا يحدث لجزيئات المادة عند تسخينها؟', a: 'تزداد سرعتها وتتباعد فتتمدد المادة.' }, { q: 'أيهما يطفو: الأقل كثافة أم الأكثر؟', a: 'الأقل كثافة يطفو فوق الأكثر كثافة.' }, { q: 'ما مصدر الطاقة الرئيس على الأرض؟', a: 'الشمس.' }], end: 'هذه المفاهيم: الكتلة والتمدد والكثافة والطاقة الشمسية… هي مفاتيح فهم حركة الهواء والطقس في هذا الدرس!' },
      { t: 'tf', h: 'توجيه القراءة وتركيزها (قبل القراءة) — ص 17', lead: 'اختر (م) إذا كنت موافقًا أو (غ) إذا كنت غير موافق، وسترى التصحيح.', yes: 'م', no: 'غ', items: [
        { s: '1. النيتروجين هو الغاز الأكثر توافرًا في الغلاف الجوي للأرض.', ans: 1, fix: 'نحو 78% من الهواء نيتروجين.' },
        { s: '2. يوجد أغلب أوزون الغلاف الجوي في طبقة التروبوسفير.', ans: 0, fix: 'يوجد أغلب الأوزون في طبقة الستراتوسفير.' },
        { s: '3. توفر الشمس مصدر الطاقة اللازمة لدورة الماء في الطبيعة.', ans: 1, fix: 'الشمس مصدر الطاقة الرئيس لدورة الماء.' },
        { s: '4. عملية تصاعد الهواء الساخن وهبوط الهواء البارد هي العملية المسماة التوصيل الحراري.', ans: 0, fix: 'هذه العملية تسمى الحمل.' },
        { s: '5. يزداد ضغط الهواء في الغلاف الجوي كلما ازداد الارتفاع.', ans: 0, fix: 'يقل ضغط الهواء كلما ازداد الارتفاع.' },
        { s: '6. لا تتأثر الرطوبة النسبية بتغير درجة حرارة الهواء.', ans: 0, fix: 'تتأثر؛ فانخفاض الحرارة يزيد الرطوبة النسبية.' },
        { s: '7. يمكن للكتلة الهوائية أن تكتسب خصائص المنطقة التي توجد فوقها من حيث الرطوبة ودرجة الحرارة إذا استمرت فيها وقتًا كافيًا.', ans: 1, fix: 'ستدرس ذلك في الدرس الثاني.' },
        { s: '8. يرتفع الهواء ويبرد عندما يتدفق إلى مركز للضغط المنخفض.', ans: 1, fix: 'في المنخفض تيارات صاعدة تبرد فيتكاثف بخارها.' } ] },
      { t: 'text', h: '📖 أتهيأ للقراءة: الاستدلال (ص 16)', html: '<p>عندما تقوم بعملية الاستدلال فأنت تتوصل إلى نتائج لم تُطرح صراحة في النص؛ أي تقرأ بين السطور وتفسّر الدلالات وتبني على معرفتك السابقة.</p>' },
      { t: 'book', tag: 'استدلّ', page: 16, q: '«إن أشعة الشمس تسقط على الأرض بشكل عمودي في المنطقة الاستوائية، وتسقط مائلة في المناطق القطبية، مما يؤدي إلى تسخين الأولى بدرجة أكبر من الثانية». لماذا تسخن المنطقة الاستوائية بدرجة أكبر؟', a: 'لأن معدل الإشعاع الشمسي على وحدة المساحة أعلى؛ مما يؤدي إلى زيادة التسخين.' },
      { t: 'book', tag: 'استدلّ', page: 16, q: '«يتحرك الهواء الساخن من المناطق الاستوائية نحو المناطق القطبية، ويتحرك الهواء البارد من المناطق القطبية نحو المناطق الاستوائية». لماذا يتحرك الهواء بهذه الاتجاهات؟', a: 'يرتفع الهواء الساخن القليل الكثافة القادم من المناطق الاستوائية ليحل محله هواء بارد عالي الكثافة من المناطق القطبية.' },
    ] },
    { short: 'الهواء', icon: '💨', title: 'الشرح (1): الهواء من حولنا ومكوناته', page: 18, time: '10 دقائق', blocks: [
      { t: 'text', h: 'الهواء من حولنا', lead: 'الحياة على سطح الأرض غير ممكنة من دون الهواء.', list: ['<span class="hl">الغلاف الجوي:</span> طبقة الغازات المحيطة بالأرض.', 'يزوّد الأرض بجميع الغازات اللازمة للحياة.', 'يحمي المخلوقات الحية من الأشعة فوق البنفسجية والأشعة السينية.', 'يمتص الحرارة ويوزعها حول الأرض.'] },
      { t: 'mcq', tag: 'توقّع قبل أن تقرأ', img: 'fig1', cap: 'الشكل 1: دورق قبل حقنه بالهواء وبعده', q: 'قاس جاليليو (1564م – 1642م) كتلة دورق مغلق، ثم حقن فيه هواءً إضافيًا وقاس كتلته مرة أخرى. ماذا وجد؟', o: ['كتلة الدورق بعد الحقن أكبر', 'كتلة الدورق بعد الحقن أقل', 'لم تتغير الكتلة', 'انعدمت الكتلة'], a: 0, why: 'استنتج جاليليو أن للهواء كتلة، فهو يحتوي على مادة. ونعرف اليوم أن الهواء يخزّن الحرارة ويطلقها، ويحمل بخار الماء، ويولّد ضغطًا بسبب وزنه.', hint: 'تذكّر أن الهواء مادة.' },
      { t: 'text', h: 'مكوّنات الغلاف الجوي', list: ['الغلاف الجوي مادة له كتلة؛ لذا يتأثر بالجاذبية التي تبقيه قريبًا من الأرض وتمنعه من الانفلات.', 'يولّد ضغطًا مساويًا للضغط الداخلي في جسم الإنسان؛ لذلك لا نشعر به.', 'وزن الغلاف الجوي يعادل وزن طبقة ماء سمكها 10 أمتار تغلف الأرض!', 'الغلاف الجوي خليط من غازات وماء ودقائق مجهرية من مواد صلبة وسائلة.'] },
      { t: 'book', tag: 'ماذا قرأت؟', page: 18, q: 'ما مكوّنات الغلاف الجوي؟', a: 'الغلاف الجوي خليط من الغازات (أهمها النيتروجين والأكسجين)، وبخار الماء، ودقائق مجهرية من مواد صلبة وسائلة تسمى الهباء الجوي.' },
      { t: 'text', h: 'الغازات', img: 'pie', cap: 'الشكل 2: نسب الغازات في الغلاف الجوي', list: ['النيتروجين N₂ نحو 78%، والأكسجين O₂ نحو 21%؛ معًا 99%.', 'غازات أخرى: أرجون 0.93%، وثاني أكسيد الكربون 0.03%، وبخار الماء 0 – 4%، ومقادير قليلة جدًا من النيون والهيليوم والميثان والكربتون والزينون والهيدروجين والأوزون.', 'بخار الماء مسؤول عن تكوّن الغيوم والأمطار.', 'ثاني أكسيد الكربون CO₂ تحتاج إليه النباتات في البناء الضوئي، ويمتص الحرارة ويبثها نحو سطح الأرض فيحافظ على دفئها.'] },
      { t: 'book', tag: 'حدّد · الشكل 2', page: 19, q: 'تختلف نسب الغازات في الغلاف الجوي قليلًا؛ فبخار الماء تتراوح نسبته بين 0 – 4%. ماذا يحدث لنسب الغازات الأخرى عندما ترتفع نسبة بخار الماء؟', a: 'تقل نسب الغازات الأخرى قليلًا؛ لأن مجموع نسب مكونات الهواء يبقى 100%، فزيادة نصيب بخار الماء تكون على حساب نصيب الغازات الأخرى.' },
      { t: 'text', h: 'الهباء الجوي', list: ['يتكوّن من مواد صلبة مثل الغبار والأملاح وحبوب اللقاح، ومواد سائلة مثل القطيرات الحمضية.', 'يدخل الغبار مع الرياح التي تحمل دقائق التربة، ومع البراكين التي تقذف الرماد البركاني.', 'تدخل الأملاح عندما تتحرك الرياح فوق المحيطات، وتدخل حبوب اللقاح من النباتات.', 'يضيف الإنسان الهباء الجوي بحرق الوقود الأحفوري، وتعكس بعض دقائقه الطاقة الشمسية فتؤثر في الطقس والمناخ.'] },
      { t: 'sort', h: 'بطاقات التصنيف: غاز أم هباء جوي؟', cats: ['غازات الغلاف الجوي', 'الهباء الجوي'], items: [{ t: 'النيتروجين', c: 0 }, { t: 'الأكسجين', c: 0 }, { t: 'الأرجون', c: 0 }, { t: 'ثاني أكسيد الكربون', c: 0 }, { t: 'الغبار', c: 1 }, { t: 'أملاح البحر', c: 1 }, { t: 'حبوب اللقاح', c: 1 }, { t: 'الرماد البركاني', c: 1 }, { t: 'القطيرات الحمضية', c: 1, hint: 'إنها مادة سائلة وليست غازًا.' }] },
    ] },
    { short: 'الطبقات', icon: '🎈', title: 'الشرح (2): طبقات الغلاف الجوي', page: 19, time: '12 دقيقة', blocks: [
      { t: 'text', h: 'كيف قُسِّم الغلاف الجوي؟', img: 'layers', cap: 'الشكل 3: تغير درجة الحرارة مع الارتفاع', list: ['يُقسَّم الغلاف الجوي إلى طبقات بحسب تغير درجة الحرارة مع الارتفاع، ولكل طبقة خصائص مميزة.', 'الطبقات السفلى: التروبوسفير والستراتوسفير.', 'الطبقات العليا: الميزوسفير والثيرموسفير والإكسوسفير.'] },
      { t: 'sim', kind: 'layers', h: '🎈 رحلة البالون العلمي', lead: 'اسحب المؤشر لترفع البالون من سطح الأرض حتى 600 كم، وراقب الطبقة ودرجة الحرارة.' },
      { t: 'text', h: 'التروبوسفير (الطبقة المتقلّبة)', list: ['أقرب طبقات الغلاف الجوي إلى سطح الأرض، وتمتد إلى ارتفاع 10 كم.', 'تضم ثلاثة أرباع المادة الكلية للغلاف الجوي، وتحوي تقريبًا جميع الغيوم والتغيرات الطقسية.', 'نحو 50% من الطاقة الشمسية تخترقها فتصل إلى سطح الأرض وتسخّنه، ويسخن الهواء الملامس للسطح بالتوصيل.', 'لذلك مصدر حرارتها سطح الأرض: تكون أعلى عند السطح، وتقل مع الارتفاع بمعدل 6.5 °س/كم تقريبًا.'] },
      { t: 'book', tag: 'ماذا قرأت؟', page: 20, q: 'ما أهم خصائص طبقة التروبوسفير؟', a: 'هي أقرب الطبقات إلى سطح الأرض (حتى ارتفاع 10 كم)، وتضم ثلاثة أرباع مادة الغلاف الجوي، وتحدث فيها الغيوم وتغيرات الطقس، ومصدر حرارتها سطح الأرض؛ فتقل حرارتها كلما ارتفعنا.' },
      { t: 'text', h: 'الستراتوسفير', list: ['تقع فوق التروبوسفير، وتمتد من ارتفاع 10 كم إلى 50 كم.', 'يتركز فيها معظم الأوزون O₃ الذي يمتص أكبر كمية من الأشعة فوق البنفسجية الصادرة من الشمس.', 'لذلك تزداد درجة حرارتها كلما ارتفعنا إلى أعلى.', 'لولا هذه الطبقة الغنية بالأوزون لوصلت كميات كبيرة من الأشعة الضارة إلى الأرض.'] },
      { t: 'tps', q: '🍏 الربط مع الصحة: تتعرض طبقة الأوزون للتدمير، مما يسمح لكميات متزايدة من الأشعة فوق البنفسجية بالوصول إلى الأرض فتسبب سرطان الجلد وتؤثر في البصر. ما الذي يمكن أن تفعله لتقي جلدك وبصرك عندما تكون خارج المنزل؟', a: 'استعمال واقي الشمس، وارتداء نظارات شمسية وقبعة وملابس ساترة، وتجنّب التعرض المباشر للشمس وقت الظهيرة.' },
      { t: 'text', h: 'الطبقات العليا', img: 'iono', cap: 'الشكل 4: تعكس طبقة الأيونوسفير أمواج الراديو', list: ['<span class="hl">الميزوسفير</span> (50 – 85 كم): أكثر طبقات الغلاف الجوي برودة؛ لاحتوائها على كمية قليلة جدًا من الأوزون.', '<span class="hl">الثيرموسفير</span> (85 – 500 كم): ترتفع حرارتها بسرعة إلى أكثر من 1700 °س، وتصفّي الأشعة السينية وأشعة جاما الضارة.', '<span class="hl">الأيونوسفير</span> (الطبقة المتأينة): جزء من الثيرموسفير والميزوسفير، ذراتها مشحونة كهربائيًا، وتعكس أمواج الراديو AM.', '<span class="hl">الإكسوسفير</span>: الطبقة الأخيرة، فيها القليل من الذرات، وتتلاشى عند حدود الفضاء الخارجي.'] },
      { t: 'order', h: 'رتّب الطبقات العلمية من سطح الأرض صعودًا', items: ['التروبوسفير', 'الستراتوسفير', 'الميزوسفير', 'الثيرموسفير', 'الإكسوسفير'], why: 'هذا هو ترتيب الطبقات الخمس بدءًا من سطح الأرض.' },
    ] },
    { short: 'الماء والطقس', icon: '🔄', title: 'الشرح (3): مياه الأرض والطقس ونقل الطاقة', page: 21, time: '12 دقيقة', blocks: [
      { t: 'html', html: '<h2>مياه الأرض</h2><p>تسمى الأرض «الكوكب المائي»؛ لأن الماء يغطي نحو 70% من سطحها، ويوجد في حالاته الثلاث: صلبًا وسائلًا وغازيًا.</p><table class="dt"><tr><th>المكان</th><th>نسبة الماء %</th></tr><tr><td>المحيطات</td><td>97.2</td></tr><tr><td>الغطاء الجليدي والجليديات</td><td>2.05</td></tr><tr><td>المياه الجوفية</td><td>0.62</td></tr><tr><td>الأنهار والبحيرات</td><td>0.009</td></tr><tr><td>الغلاف الجوي</td><td>0.001</td></tr><tr><td>الإجمالي تقريبًا</td><td>100</td></tr></table><p class="quote">قال تعالى: ﴿وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ أَفَلَا يُؤْمِنُونَ﴾ [الأنبياء: 30]</p>' },
      { t: 'mcq', tag: 'تحليل البيانات · الجدول 1', q: 'أين يوجد الجزء الأكبر من مياه الأرض؟', o: ['الغلاف الجوي', 'الأنهار والبحيرات', 'المحيطات', 'المياه الجوفية'], a: 2, why: 'المحيطات تضم 97.2% من مياه الأرض.', hint: 'ابحث عن أكبر نسبة في الجدول.' },
      { t: 'text', h: 'دورة الماء', img: 'watercycle', cap: 'الشكل 5: دورة الماء في الطبيعة', list: ['<span class="hl">التبخر:</span> تمتص المياه الطاقة الشمسية فتتحول من سائل إلى بخار يدخل الغلاف الجوي.', '<span class="hl">النتح:</span> تطلق النباتات بخار الماء إلى الهواء.', '<span class="hl">التكاثف:</span> يصعد البخار إلى أعلى فيبرد وتتباطأ جزيئاته فيتحول إلى قطيرات تكوّن الغيوم.', '<span class="hl">الهطول:</span> تتحد القطيرات وتكبر حتى يصبح وزنها أكبر مما يستطيع الهواء حمله فتسقط.', 'الشمس هي مصدر الطاقة الرئيس لهذه الدورة.'] },
      { t: 'sim', kind: 'water', h: '🔄 مختبر دورة الماء', lead: 'غيّر شدة أشعة الشمس، وراقب التبخر والنتح وتكوّن الغيمة والهطول.' },
      { t: 'book', tag: 'ماذا قرأت؟', page: 21, q: 'فيمَ يختلف التبخر عن التكاثف؟', a: 'التبخر: تحوّل الماء من الحالة السائلة إلى الحالة الغازية عندما يمتص طاقة كافية. التكاثف: تحوّل بخار الماء إلى قطيرات سائلة عندما يبرد وتتباطأ حركة جزيئاته.' },
      { t: 'text', h: 'طقس الأرض', list: ['<span class="hl">الطقس:</span> حالة الغلاف الجوي في وقت محدد ومكان محدد.', 'عوامل الطقس: درجة الحرارة، والغيوم، وسرعة الرياح واتجاهها، والرطوبة، والضغط الجوي.', 'عالم الأرصاد الجوية: الشخص الذي يتابع بيانات الطقس باستمرار لتوقّع الحالة الجوية.', '<span class="hl">درجة الحرارة</span> مقياس لسرعة حركة جزيئات الهواء، وتقاس بالترمومتر بالسلسيوس أو الفهرنهايت.', 'تمتاز منطقة شمال غرب المملكة بمحاذاة البحر الأحمر بانخفاض حرارتها بنحو 10 درجات عن مناطق الخليج العربي؛ لذلك اختيرت لإقامة مدينة نيوم.'] },
      { t: 'text', h: 'نقل الطاقة: التوصيل والحمل', img: 'convection', cap: 'الشكل 6: تنتقل الطاقة الحرارية على الأرض بالتوصيل والحمل', list: ['<span class="hl">التوصيل:</span> جزيئات الهواء السريعة تنقل طاقتها إلى الجزيئات البطيئة عندما تصطدم بها؛ فيسخن الهواء الملامس لسطح الأرض.', '<span class="hl">الحمل:</span> الهواء الساخن تقل كثافته فيرتفع ويبرد، فتزداد كثافته فينزل؛ وهي الطريقة الرئيسة لانتقال الحرارة في الغلاف الجوي.'] },
      { t: 'text', h: '⚙ الضغط الجوي (الربط مع الفيزياء)', list: ['للهواء وزن بسبب جذب الأرض له؛ لذا يولّد ضغطًا.', 'يتناقص الضغط كلما ارتفعنا في الغلاف الجوي؛ بسبب تناقص وزن الهواء الذي يعلونا.', 'تسخين الهواء يجعل جزيئاته تتحرك بسرعة وتتمدد فتقل كثافته فيصعد ← منطقة ضغط منخفض.', 'الهواء البارد أكبر كثافة فينزل مولّدًا ضغطًا مرتفعًا؛ لذلك يختلف الضغط الجوي على سطح الأرض.'] },
    ] },
    { short: 'الغيوم والرياح', icon: '☁', title: 'الشرح (4): الرطوبة والغيوم والهطول والرياح', page: 23, time: '15 دقيقة', blocks: [
      { t: 'text', h: 'الرطوبة ودرجة الندى', img: 'dewchart', cap: 'الشكل 7: تأثير درجة الحرارة في كمية بخار الماء التي يستطيع الهواء حملها', list: ['<span class="hl">الرطوبة:</span> مقدار بخار الماء في الغلاف الجوي.', 'عندما ترتفع درجة الحرارة يزداد التبخر؛ فالهواء الساخن يحمل بخار ماء أكثر من البارد.', 'عندما تصل كمية البخار إلى الحد الأقصى يصبح الهواء مشبعًا وتبدأ عملية التكاثف.', '<span class="hl">درجة الندى:</span> درجة الحرارة التي يصل عندها الهواء إلى حالة الإشباع.'] },
      { t: 'book', tag: 'حدّد · الشكل 7', page: 23, img: 'dewchart', q: 'حدّد مقدار بخار الماء الذي يستطيع الهواء حمله إذا كانت درجة حرارته 30 °س، و10 °س على التوالي.', a: 'نحو 30 جم/م³ عند 30 °س، ونحو 9 جم/م³ عند 10 °س (قراءة تقريبية من الرسم البياني).' },
      { t: 'text', h: 'الرطوبة النسبية', list: ['<span class="hl">الرطوبة النسبية:</span> كمية بخار الماء الموجودة في الهواء مقارنة بكمية بخار الماء التي يستطيع الهواء حملها عند درجة حرارة معينة.', 'عندما تبرد كتلة هواء لا يتغير مقدار البخار فيها (إلا إذا تكاثف)، لكن الكمية التي يمكن إضافتها تقل؛ فتزداد الرطوبة النسبية.', 'عندما يحتوي الهواء على الحد الأقصى من البخار تكون رطوبته النسبية 100%.'] },
      { t: 'sim', kind: 'humid', h: '💧 مختبر الرطوبة النسبية ودرجة الندى', lead: 'غيّر الحرارة وكمية البخار، ثم برّد الهواء لتكتشف درجة الندى ولحظة التكاثف.' },
      { t: 'book', tag: 'ماذا قرأت؟', page: 24, q: 'ما المقصود بالرطوبة النسبية؟', a: 'هي كمية بخار الماء الموجودة في الهواء مقارنة بكمية بخار الماء التي يستطيع الهواء حملها عند درجة حرارة معينة.' },
      { t: 'book', tag: 'الربط مع علم الأحياء', y: 1, page: 24, q: 'مقاييس الحرارة الطبيعية: يرتفع صوت صرصور الليل، وتزداد سرعة اهتزاز الجرس في ذيل أفعى الجرس عندما تدفأ أجسامها. كيف يمكن استخدام الحيوانات مقاييس لدرجة الحرارة؟', a: 'بعدّ مرات صرير صرصور الليل في زمن محدد؛ فكلما زاد عددها كانت درجة حرارة الجو أعلى، وكلما قلّ كانت أبرد.' },
      { t: 'text', h: 'الغيوم', img: 'clouds', cap: 'الشكل 8: تصنيف الغيوم حسب ارتفاعها', list: ['تتكون الغيوم عندما يرتفع الهواء ويبرد إلى درجة الندى فيتكاثف بخار الماء على جسيمات صغيرة؛ وتكون قطرات ماء أو بلورات ثلج حسب الحرارة.', '<span class="hl">المنخفضة</span> (حتى 2000 م): الركامية، والطبقية، والطبقية الركامية، والضباب.', '<span class="hl">المتوسطة</span> (2000 – 8000 م): الركامية المتوسطة، والطبقية المتوسطة؛ وقد تسبب أمطارًا خفيفة.', '<span class="hl">المرتفعة</span>: من بلورات جليدية: الريشية، والريشية الركامية، والريشية الطبقية.', '<span class="hl">المزن الركامية</span>: تمتد عموديًا على جميع الارتفاعات، وتسبب أمطارًا غزيرة وعواصف رعدية.'] },
      { t: 'html', cls: 'tint', html: '<p class="quote">قال تعالى: ﴿أَلَمْ تَرَ أَنَّ اللَّهَ يُزْجِي سَحَابًا ثُمَّ يُؤَلِّفُ بَيْنَهُ ثُمَّ يَجْعَلُهُ رُكَامًا فَتَرَى الْوَدْقَ يَخْرُجُ مِنْ خِلَالِهِ﴾ [النور: 43]</p>' },
      { t: 'text', h: 'الهطول', img: 'hail', cap: 'الشكل 9: يتشكل البَرَد في غيوم المزن الركامية', list: ['يحدث الهطول عندما تصبح قطرات الماء أو بلورات الثلج كبيرة لدرجة لا تستطيع الغيوم حملها.', 'أشكاله: المطر، والثلج، والمطر المتجمد، والبَرَد، ويعتمد نوعه على درجة حرارة الغلاف الجوي.', 'المطر المتجمد: يسقط المطر من هواء علوي أعلى من التجمد، ثم يمر بهواء قرب السطح أقل من التجمد فيتجمد.', 'البَرَد: تحمل الرياح القوية البلورات إلى أعلى وأسفل الغيمة، فتلتصق بها قطرات تتجمد حتى تثقل فتسقط.'] },
      { t: 'book', tag: 'وضّح · الشكل 9', page: 25, q: 'ماذا تستدل عن قوة الرياح في الغيمة من آلية تكوّن البَرَد؟', a: 'أن الرياح الصاعدة داخل غيوم المزن الركامية قوية جدًا؛ فهي ترفع حبات البَرَد إلى أعلى مرات عدة حتى تتراكم عليها طبقات الجليد وتثقل فتسقط.' },
      { t: 'text', h: 'الرياح', list: ['الهواء الساخن تتسارع جزيئاته وتتباعد وتقل كثافته فيرتفع ← مناطق ضغط منخفض.', 'الهواء البارد تتباطأ جزيئاته وتتقارب وتزداد كثافته فينزل ← مناطق ضغط مرتفع.', '<span class="hl">الرياح:</span> هواء يتحرك من منطقة ضغط مرتفع إلى منطقة ضغط منخفض؛ وكلما زاد فرق الضغط والحرارة زادت سرعتها.', 'تقاس سرعة الرياح بجهاز الأنيمومتر الذي تدور فيه أكواب تلتقط الرياح.', '🌍 الرياح الموسمية تغيّر اتجاهها في فصول محددة، وتتأثر بها مرتفعات عسير صيفًا.'] },
      { t: 'sim', kind: 'wind', h: '🌬 مختبر الرياح: نسيم البحر ونسيم البر', lead: 'بدّل بين النهار والليل، وغيّر فرق الحرارة، وراقب تيار الحمل واتجاه الرياح وسرعتها.' },
      { t: 'text', h: 'تيارات الهواء العالمية وقوة كوريولوس', img: 'sunrays', cap: 'الشكل 10: زاوية سقوط أشعة الشمس كبيرة عند الاستواء وصغيرة عند القطبين', list: ['تسقط أشعة الشمس عموديًا على المنطقة الاستوائية ومائلة على القطبية، فتسخن الأولى أكثر.', 'يتحرك الهواء الساخن من الاستوائية نحو القطبين، والبارد من القطبية نحو الاستوائية.', 'بسبب دوران الأرض ينحرف الهواء المتحرك نحو اليمين في النصف الشمالي، ونحو اليسار في النصف الجنوبي: <span class="hl">أثر قوة كوريولوس</span>.'] },
      { t: 'book', tag: 'ماذا قرأت؟', page: 26, q: 'ما أثر قوة كوريولوس؟', a: 'انحراف الهواء المتحرك نحو اليمين في نصف الكرة الأرضية الشمالي، ونحو اليسار في نصفها الجنوبي؛ بسبب دوران الأرض حول نفسها.' },
    ] },
    { short: 'الاستقصاء', icon: '🔬', title: 'النشاط الاستقصائي: ملاحظة التكثف والتبخر', page: 21, time: '10 دقائق', tnote: 'الخطوتان 3-4 تُستكملان في المنزل.', blocks: [
      { t: 'exp', h: 'ملاحظة التكثف والتبخر', q: 'من أين تأتي القطرات على الكأس الباردة؟ وأين يذهب الماء من الحوض؟', steps: ['املأ كأسًا زجاجيًا بالماء المثلّج، وتأكد من جفاف السطح الخارجي للزجاج.', 'راقب الكأس مدة 10 دقائق، ولاحظ ما يحدث على السطح الخارجي.', 'اسكب 500 مل من الماء في حوض واسع.', 'اترك الحوض بضعة أيام، واستخدم مسطرة لقياس ارتفاع الماء كل يوم، ثم سجّل بياناتك.'], tools: ['كأس زجاجية', 'ماء مثلّج', 'حوض واسع', 'مخبار مدرّج', 'مسطرة'], safety: 'امسح الماء المنسكب فورًا، وتعامل مع الزجاج بحذر.', vars: 'المستقل: درجة حرارة سطح الكأس / الزمن. التابع: تكوّن القطرات / ارتفاع الماء في الحوض. الثابت: كمية الماء ومكان الحوض.' },
      { t: 'book', tag: 'التحليل', page: 21, no: 1, q: 'استنتج سبب تشكّل قطرات الماء على السطح الخارجي للزجاج.', a: 'تكاثف بخار الماء الموجود في الهواء عندما لامس سطح الكأس البارد فبرد وتحول إلى قطرات.' },
      { t: 'book', tag: 'التحليل', page: 21, no: 2, q: 'استنتج أين ذهب الماء المفقود من الحوض.', a: 'تبخّر إلى الغلاف الجوي؛ فانخفض مستوى الماء في الحوض يومًا بعد يوم.' },
      { t: 'calc', tag: 'تحليل البيانات', q: 'كان ارتفاع الماء في الحوض 4 سم في اليوم الأول، وصار 2.5 سم بعد 3 أيام. كم سنتمترًا تبخر في المتوسط كل يوم؟', a: 0.5, unit: 'سم/يوم', steps: 'المتبخر = 4 − 2.5 = 1.5 سم، والمتوسط = 1.5 ÷ 3 = 0.5 سم كل يوم.', hint: 'اطرح الارتفاعين ثم اقسم على عدد الأيام.' },
    ] },
    { short: 'التطبيق', icon: '🛠', title: 'التطبيق: سرعة الرياح ومسائل من الحياة', page: 26, time: '8 دقائق', blocks: [
      { t: 'html', html: '<span class="tag">تطبيق الرياضيات · ص 26</span><h2>مثال: سرعة الرياح</h2><p>تحركت الرياح التي تشكلت نتيجة اختلاف الضغط مسافة 14 كم خلال ساعتين. ما سرعتها؟</p><ol class="stepper"><li><span>المعطيات: المسافة (ف) = 14 كم، الزمن (ز) = 2 ساعة</span></li><li><span>المطلوب: السرعة (ع)</span></li><li><span>طريقة الحل: ع = ف ÷ ز = 14 ÷ 2 = 7 كم/ساعة</span></li><li><span>التحقق: 7 × 2 = 14 كم ✔</span></li></ol>' },
      { t: 'calc', tag: 'مسائل تدريبية · 1', q: 'يتحرك الهواء من المناطق الباردة إلى المناطق الحارة. فإذا تحركت الرياح التي تشكلت مسافة 20 كم في ساعتين، فما سرعتها؟', a: 10, unit: 'كم/ساعة', steps: 'ع = ف ÷ ز = 20 ÷ 2 = 10 كم/ساعة', hint: 'السرعة = المسافة ÷ الزمن.' },
      { t: 'calc', tag: 'مسائل تدريبية · 2', q: 'تتحرك الرياح من مناطق الضغط المرتفع إلى مناطق الضغط المنخفض، فإذا قطعت مسافة 69 كم في 3 ساعات، فما سرعتها؟', a: 23, unit: 'كم/ساعة', steps: 'ع = ف ÷ ز = 69 ÷ 3 = 23 كم/ساعة', hint: 'اقسم المسافة على الزمن.' },
