<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><script src="../tools/gradeview.js"></script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#134E4A"><title>مراجعة الفصل العاشر: القوة وقوانين نيوتن</title><style>@font-face{font-family:"Cairo";font-weight:600;font-display:swap;src:url(../assets/025baf0d675e2423.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Cairo";font-weight:600;font-display:swap;src:url(../assets/f659c03eabef9939.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Cairo";font-weight:700;font-display:swap;src:url(../assets/2d843a01ca09a451.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Cairo";font-weight:700;font-display:swap;src:url(../assets/c93f95f05c222111.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
body{font-weight:600}h1,h2,.btn,.opt,.q{font-weight:700}
/* محرك دروس الفصل الدراسي الثاني — خط عربي كبير وعريض، مناسب للمس والبروجكتر */
:root{
  --c1:#0E7490; --c2:#0B4F6C; --tint:#E0F2F7; --acc:#FACC15;
  --ink:#0F172A; --ink2:#334155; --line:#CBD5E1; --card:#FFFFFF; --soft:#F1F5F9;
  --good:#15803D; --goodbg:#DCFCE7; --bad:#B91C1C; --badbg:#FEE2E2; --warn:#B45309; --warnbg:#FEF3C7;
  --f:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --h1:46px; --h2:38px; --tx:30px; --q:33px; --btn:28px; --lab:26px;
  color-scheme:light;
}
@media (max-width:1100px){:root{--h1:40px;--h2:34px;--tx:28px;--q:30px;--btn:26px;--lab:24px}}
@media (max-width:700px){:root{--h1:30px;--h2:26px;--tx:22px;--q:23px;--btn:21px;--lab:20px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);font-weight:600;color:var(--ink);direction:rtl;background:linear-gradient(180deg,var(--sky1,#BDE3F5) 0,var(--sky2,#EAF6FC) 340px,#F4FAFD 100%);font-size:var(--tx);line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
img{max-width:100%;display:block}
.app{display:flex;flex-direction:column;height:100dvh}
/* الشريط العلوي */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--c2);color:#fff;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.top .tb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:6px 16px;font-size:22px;font-weight:800;min-height:52px;white-space:nowrap}
.top .tb:active{transform:scale(.97)}
.top .ttl{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.top .ttl small{display:block;font-size:17px;color:var(--acc);font-weight:700;line-height:1.2}
/* شريط المراحل */
.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);flex:none;scrollbar-width:thin;border-bottom:2px solid var(--line)}
.nav button{flex:none;border:2px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;min-height:52px;color:var(--ink2)}
.nav button .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:17px}
.nav button[aria-current=true]{background:var(--c1);border-color:var(--c1);color:#fff}
.nav button[aria-current=true] .n{background:var(--acc);color:var(--ink)}
.nav button.done .n{background:var(--goodbg);color:var(--good)}
/* المسرح */
.stage{flex:1;overflow-y:auto;padding:22px clamp(14px,3vw,40px) 30px;scroll-behavior:smooth}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sh{display:flex;align-items:center;gap:14px}
.sh .ic{width:68px;height:68px;border-radius:20px;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:36px;flex:none;box-shadow:0 8px 18px rgba(0,0,0,.15)}
.sh h1{margin:0;font-size:var(--h1);line-height:1.25;color:var(--c2)}
.sh .pg{margin-inline-start:auto;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 14px;font-size:20px;color:var(--ink2);white-space:nowrap}
h2{margin:0 0 10px;font-size:var(--h2);color:var(--c2);line-height:1.3}
.card{background:var(--card);border-radius:24px;padding:22px 26px;box-shadow:0 10px 26px rgba(15,42,80,.10);border:2px solid #E2E8F0}
.card.tint{background:var(--tint);border-color:transparent}
.lead{font-size:calc(var(--tx) + 2px);color:var(--c2)}
p{margin:0 0 10px}
ul.bl{margin:0;padding:0 0 0 0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.bl li{position:relative;padding-inline-start:38px}
ul.bl li::before{content:"";position:absolute;inset-inline-start:6px;top:.62em;width:16px;height:16px;border-radius:5px;background:var(--c1);transform:rotate(45deg)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.two.rev{grid-template-columns:1fr 1.25fr}
@media (max-width:900px){.two,.two.rev{grid-template-columns:1fr}}
.fig{background:#fff;border-radius:20px;padding:10px;border:2px solid #E2E8F0}
.fig img{border-radius:12px;margin:0 auto;max-height:62vh;object-fit:contain}
.fig figcaption{font-size:20px;color:var(--ink2);padding:8px 6px 0;text-align:center}
.tag{display:inline-block;background:var(--c1);color:#fff;border-radius:999px;padding:2px 16px;font-size:20px;margin-bottom:8px}
.tag.y{background:var(--acc);color:var(--ink)}
.tag.g{background:var(--good)}
.hl{color:var(--c1)}
.quote{background:#ECFDF5;border:2px solid #10B981;color:#065F46;border-radius:20px;padding:14px 20px;text-align:center}
/* أزرار */
.btn{border:0;border-radius:18px;padding:10px 26px;font-size:var(--btn);font-weight:800;background:var(--c1);color:#fff;min-height:60px;box-shadow:0 5px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.y{background:var(--acc);color:var(--ink)}
.btn.g{background:var(--good)}
.btn.gh{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 #CBD5E1}
.btn.sm{font-size:22px;min-height:50px;padding:6px 18px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;background:rgba(255,255,255,.85);border-top:2px solid var(--line);flex:none}
/* أسئلة */
.q{font-size:var(--q);line-height:1.5;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:800px){.opts{grid-template-columns:1fr}}
.opt{border:3px solid var(--line);background:#fff;border-radius:20px;padding:12px 18px;text-align:start;font-size:var(--tx);font-weight:800;min-height:72px;display:flex;align-items:center;gap:14px}
.opt .l{flex:none;width:48px;height:48px;border-radius:50%;background:var(--tint);color:var(--c2);display:grid;place-items:center;font-size:26px}
.opt:hover{border-color:var(--c1)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badbg);opacity:.85}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:14px 20px;font-size:calc(var(--tx) - 2px);display:none}
.fb.show{display:block;animation:pop .3s}
.fb.ok{background:var(--goodbg);color:#14532D;border:2px solid var(--good)}
.fb.no{background:var(--badbg);color:#7F1D1D;border:2px solid var(--bad)}
.fb.info{background:var(--warnbg);color:#78350F;border:2px solid #F59E0B}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.ans{display:none;margin-top:12px;background:var(--goodbg);border:2px solid var(--good);color:#14532D;border-radius:18px;padding:14px 20px}
.ans.show{display:block;animation:pop .3s}
body.nosol .solbtn{display:none!important}
.bq{border-inline-start:10px solid var(--c1)}
.bq .meta{font-size:20px;color:var(--ink2)}
textarea.inp,input.inp{font:inherit;font-size:var(--tx);width:100%;border:3px solid var(--line);border-radius:16px;padding:10px 16px;background:#FBFDFF;color:var(--ink)}
input.inp{width:auto;min-width:160px;text-align:center}
.inp:focus{outline:none;border-color:var(--c1)}
/* صح/خطأ */
.tfi{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:2px dashed #E2E8F0;flex-wrap:wrap}
.tfi .s{flex:1;min-width:260px}
.tfi .b{display:flex;gap:10px}
.tfi .b button{min-width:96px}
.tfi .fix{flex-basis:100%;color:#7F1D1D;background:var(--badbg);border-radius:14px;padding:8px 16px;display:none;font-size:calc(var(--tx) - 3px)}
.tfi .fix.show{display:block}
/* ترتيب وتصنيف */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border:3px solid var(--c1);background:#fff;border-radius:18px;padding:10px 18px;font-size:var(--tx);font-weight:800;min-height:62px}
.chip.sel{background:var(--acc);border-color:#CA8A04}
.chip.used{opacity:.35;pointer-events:none}
.chip.ok{background:var(--goodbg);border-color:var(--good)}
.chip.no{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.slot{min-height:66px;border:3px dashed var(--line);border-radius:18px;display:flex;align-items:center;gap:12px;padding:6px 16px;background:#fff}
.slot b{width:46px;height:46px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;flex:none;font-size:24px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.cat{border:3px dashed var(--c1);border-radius:20px;padding:12px;min-height:170px;background:#fff;display:flex;flex-direction:column;gap:8px}
.cat h3{margin:0;font-size:var(--lab);text-align:center;color:#fff;background:var(--c1);border-radius:12px;padding:4px}
.cat.drop{background:var(--tint)}
.cat .chip{font-size:calc(var(--tx) - 4px);min-height:50px;padding:6px 12px}
/* بطاقات تفاعلية */
.cardsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.flip{perspective:1200px;min-height:230px;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;min-height:230px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;box-shadow:0 10px 22px rgba(0,0,0,.14)}
.flip .fa{background:var(--cc,var(--c1));color:#fff;font-size:calc(var(--tx) - 1px)}
.flip .fa small{font-size:20px;opacity:.95;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 14px;margin-bottom:8px}
.flip .fb2{background:#fff;color:var(--ink);border:4px solid var(--cc,var(--c1));transform:rotateY(180deg);font-size:calc(var(--tx) - 3px)}
.uno .fa{border:8px solid #fff;outline:3px solid var(--cc)}
.uno .fa::before{content:"";position:absolute;width:70%;height:55%;border-radius:50%;background:rgba(255,255,255,.18);transform:rotate(-30deg)}
/* الفرق */
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1;min-width:150px;border-radius:18px;padding:8px 12px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:22px}
.team b{font-size:34px}
.team button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:12px;width:48px;height:48px;font-size:28px}
/* مؤقت */
.timer{font-size:56px;font-weight:900;min-width:150px;text-align:center;background:#0F172A;color:var(--acc);border-radius:20px;padding:0 18px;font-variant-numeric:tabular-nums}
.timer.low{color:#F87171;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
/* محاكاة */
.sim{background:#0B1E33;border-radius:24px;padding:14px;color:#fff}
.sim canvas{width:100%;height:auto;display:block;border-radius:16px;background:#0F2740;touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:12px}
.ctrl label{font-size:var(--lab);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
input[type=range]{width:min(420px,70vw);height:44px;accent-color:var(--acc)}
.read{background:rgba(255,255,255,.1);border-radius:16px;padding:8px 16px;font-size:var(--lab)}
.read b{color:var(--acc)}
.sim .btn.gh{color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:3px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:16px;padding:6px 18px;font-size:var(--lab);font-weight:800;min-height:56px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
/* صندوق الأسرار وخريطة المفاهيم */
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.mbox{border:0;border-radius:22px;min-height:160px;background:linear-gradient(160deg,#7C3AED,#4C1D95);color:#fff;font-size:64px;box-shadow:0 10px 0 #3B0764}
.mbox.open{font-size:var(--tx);background:#fff;color:var(--ink);border:4px solid #7C3AED;box-shadow:none;padding:12px}
.cmap{display:flex;flex-direction:column;align-items:center;gap:10px}
.cnode{border:3px solid var(--c1);background:#fff;border-radius:999px;padding:8px 22px;text-align:center;min-width:200px}
.cnode.root{background:var(--c1);color:#fff;font-size:var(--h2)}
.clinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%}
.ccol{display:flex;flex-direction:column;align-items:center;gap:8px}
.ccol .lk{font-size:20px;color:var(--ink2)}
.blank{border:3px dashed var(--c1);border-radius:16px;min-width:200px;min-height:60px;background:#FFFBEB;padding:6px 14px;font-size:calc(var(--tx) - 2px);font-weight:800}
.blank.ok{border-style:solid;border-color:var(--good);background:var(--goodbg)}
/* شريط الذكريات */
.strip{display:flex;gap:14px;overflow-x:auto;padding:34px 18px;scroll-snap-type:x mandatory;background:#111;border-radius:14px;position:relative;
 background-image:repeating-linear-gradient(90deg,#f5f5f5 0 16px,transparent 16px 34px),repeating-linear-gradient(90deg,#f5f5f5 0 16px,transparent 16px 34px);
 background-size:100% 14px,100% 14px;background-position:0 10px,0 calc(100% - 10px);background-repeat:repeat-x;background-color:#111}
.strip .fa img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.strip .flip{flex:0 0 280px;scroll-snap-align:start;min-height:300px}.strip .flip .in{min-height:300px}
.strip .end{flex:0 0 320px;border-radius:22px;background:var(--acc);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:calc(var(--tx) - 2px)}
/* إنجاز */
.badge{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#FEF3C7,#FFFFFF);border:4px solid #F59E0B;border-radius:28px;padding:22px}
.badge .medal{font-size:96px;line-height:1}
.stars{font-size:54px;letter-spacing:6px}
.tonly{display:none!important}
body.teacher .tonly{display:block!important}
body.teacher span.tonly{display:inline!important}
.tnote{background:#EEF2FF;border:2px dashed #6366F1;color:#3730A3;border-radius:16px;padding:10px 16px;font-size:21px}
.panel{position:fixed;inset:auto 14px 90px auto;z-index:50;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:16px;display:flex;flex-direction:column;gap:10px;width:min(420px,calc(100vw - 28px));font-size:22px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0F172A;color:#fff;border-radius:16px;padding:10px 22px;font-size:22px;z-index:60}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
table.dt{border-collapse:collapse;width:100%;font-size:calc(var(--tx) - 4px)}
table.dt th,table.dt td{border:2px solid var(--line);padding:8px 12px;text-align:center}
table.dt th{background:var(--c1);color:#fff}
.stepper{display:flex;flex-direction:column;gap:10px;counter-reset:st}
.stepper li{list-style:none;display:flex;gap:14px;align-items:flex-start}
.stepper li::before{counter-increment:st;content:counter(st,arabic-indic);flex:none;width:52px;height:52px;border-radius:16px;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:26px}
.stepper{padding:0;margin:0}
.safety{background:var(--badbg);border:2px solid var(--bad);color:#7F1D1D;border-radius:18px;padding:12px 18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* شريط الذكريات: شريط فيلم بأسئلة مصغّرة */
.film{margin-top:14px;background:#111;border-radius:14px;padding:30px 14px;position:relative;overflow-x:auto;
 background-image:radial-gradient(circle at 50% 50%,#f5f5f5 5px,transparent 6px),radial-gradient(circle at 50% 50%,#f5f5f5 5px,transparent 6px);
 background-size:34px 22px,34px 22px;background-repeat:repeat-x,repeat-x;background-position:0 4px,0 calc(100% - 4px)}
.frames{display:flex;gap:14px;min-width:min-content}
.frame{flex:1 0 230px;max-width:300px;min-height:200px;border:0;border-radius:6px;background:#fff;cursor:pointer;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;font:inherit;color:#1f2937;transition:transform .2s,box-shadow .2s;position:relative}
.frame:hover,.frame:focus-visible{transform:scale(1.04);box-shadow:0 0 0 4px var(--acc,#FACC15)}
.frame img{width:100%;height:92px;object-fit:cover;border-radius:4px}
.frame .fq{font-size:19px;line-height:1.55;text-align:center}
.frame .fq small{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c1);color:#fff;font-size:16px;margin-left:6px}
.frame.seen::after{content:"✓";position:absolute;top:6px;left:8px;background:#16A34A;color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:18px}
/* بطاقات أونو المرقمة */
.unog{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-top:16px}
.unoc{aspect-ratio:2/3;border:8px solid #fff;outline:3px solid var(--cc);border-radius:18px;background:var(--cc);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;font:inherit;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .2s}
.unoc::before{content:"";position:absolute;width:85%;height:58%;border-radius:50%;background:#fff;transform:rotate(-30deg)}
.unoc .un{position:relative;font-size:64px;font-weight:800;color:var(--cc);line-height:1}
.unoc .uk{position:absolute;bottom:8px;font-size:16px;background:rgba(0,0,0,.25);border-radius:999px;padding:1px 10px}
.unoc:hover,.unoc:focus-visible{transform:translateY(-6px) rotate(-2deg)}
.unoc.used{opacity:.45;filter:grayscale(.5)}.unoc.used::after{content:"✓";position:absolute;top:6px;right:8px;font-size:22px}
/* نافذة التكبير */
.zm{position:fixed;inset:0;background:rgba(8,12,30,.72);display:grid;place-items:center;z-index:999;padding:16px;animation:zmf .25s}
@keyframes zmf{from{opacity:0}to{opacity:1}}
.zmbox{background:#fff;border-radius:24px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:22px 26px;border-top:12px solid var(--cc);animation:zmz .3s}

.zmk{display:inline-block;background:var(--cc);color:#fff;border-radius:999px;padding:4px 18px;font-size:20px}
.zmimg{display:block;max-width:100%;max-height:260px;margin:14px auto;border-radius:12px}
.zmq{font-size:calc(var(--tx) + 8px);line-height:1.7;color:#111827;margin:14px 0;text-align:center}

.btn.ghost{background:#fff;color:var(--c2);box-shadow:inset 0 0 0 3px var(--c2)}

/* عرض البطاقة الواحدة بحجم الشاشة */
.pgc[hidden]{display:none!important}
.dots{display:flex;gap:6px;align-items:center;margin-inline-start:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:#CBD5E1}.dots i.on{background:var(--c1);width:26px;border-radius:8px}.dots i.ok{background:var(--good,#16A34A)}
.dots b{font-size:18px;color:var(--ink2);margin-inline-start:6px}
.sh{flex-wrap:wrap}

.sim canvas{max-height:calc(100dvh - 360px);width:auto;max-width:100%;margin:0 auto;min-height:150px}

/* التجربة الافتراضية */
.labh{font-size:var(--h2);color:var(--c2)}
.labg{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}

.labsim{padding:10px}
.labsteps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
.labsteps li{counter-increment:s;font-size:calc(var(--tx) - 6px);line-height:1.5;padding:6px 10px 6px 10px;border-radius:12px;background:#F1F5F9;color:#64748B;display:flex;gap:8px}

.labsteps li.on{background:var(--tint);color:var(--ink);box-shadow:0 0 0 3px var(--c1)}.labsteps li.on::before{background:var(--c1)}
.labsteps li.ok{color:var(--ink)}.labsteps li.ok::before{content:"✓";background:#16A34A}

.labside .safety{margin-top:8px;font-size:18px}
.labp{margin-top:8px;display:flex;flex-direction:column;gap:8px}

.labc .sim canvas{max-height:calc(100dvh - 470px)}

ي إحداهما الأخرى؛ عندما تؤثران في جسمين مختلفين.", "تبدو الأجسام في مدارها حول الأرض في حالة انعدام الوزن؛ لأنها في حالة سقوط حر مستمر حول الأرض."]}, {"t": "fill", "h": "تصوّر الأفكار الرئيسة: أكمل الخريطة المفاهيمية لقوانين نيوتن في الحركة", "items": ["القانون الأول: ___", "القانون الثاني: ___", "القانون الثالث: ___"], "answers": ["الجسم الساكن يبقى ساكنًا (والمتحرك يبقى متحركًا بسرعة ثابتة) حتى تؤثر فيه قوة محصلة", "ت = ق محصلة ÷ ك: يتسارع الجسم في اتجاه القوة المحصلة", "لكل قوة فعل قوة رد فعل مساوية لها في المقدار ومعاكسة لها في الاتجاه"]}]}, {"short": "ماذا قرأت؟", "icon": "✅", "title": "حلول «ماذا قرأت؟» في دروس الفصل", "page": 108, "time": "6 دقائق", "blocks": [{"t": "book", "tag": "ماذا قرأت؟ · الدرس 1", "page": 112, "write": 1, "q": "ما الشيء المشترك بين جميع أشكال قوة الاحتكاك؟", "a": "أنها جميعًا تعمل على مقاومة انزلاق جسم يتحرك على سطح جسم آخر، وتعمل دائمًا على إنقاص سرعة الأجسام المتحركة."}, {"t": "book", "tag": "ماذا قرأت؟ · الدرس 1", "page": 113, "write": 1, "q": "ما الفرق بين الاحتكاك السكوني والاحتكاك الانزلاقي؟", "a": "الاحتكاك السكوني يمنع الجسم الساكن من الحركة عند التأثير فيه بقوة، أما الاحتكاك الانزلاقي فيعمل على تقليل سرعة الجسم المنزلق."}, {"t": "book", "tag": "ماذا قرأت؟ · الدرس 1", "page": 115, "write": 1, "q": "ما هو القانون الثاني لنيوتن؟", "a": "تسارع جسم ما يساوي ناتج قسمة القوة المحصلة المؤثرة فيه على كتلته، ويكون اتجاه التسارع في اتجاه القوة المحصلة: ت = ق محصلة ÷ ك."}]}, {"short": "اختبر نفسك", "icon": "🧠", "title": "حلول «اختبر نفسك» في نهاية كل درس", "page": 121, "time": "12 دقيقة", "blocks": [{"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 1, "write": 1, "q": "وضّح ما إذا كانت هناك قوة محصلة تؤثر في سيارة تتحرك بسرعة 20 كم/س وتنعطف إلى اليسار.", "a": "نعم؛ لأن اتجاه حركتها يتغير فهي تتسارع، والتسارع لا يحدث إلا بقوة محصلة لا تساوي صفرًا."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 2, "write": 1, "q": "ناقش لماذا جعل الاحتكاك استكشاف القانون الأول لنيوتن صعبًا؟", "a": "لأن الاحتكاك يوقف الأجسام المتحركة دائمًا، فاعتقد الناس أن الحالة الطبيعية للأجسام هي السكون وأن الحركة تحتاج إلى قوة مستمرة، ولم يدركوا أن الاحتكاك قوة."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 3, "write": 1, "q": "ناقش هل يمكن لجسم أن يكون متحركًا إذا كانت القوة المحصلة المؤثرة فيه تساوي صفرًا؟", "a": "نعم؛ يبقى متحركًا في خط مستقيم بسرعة ثابتة، وفق القانون الأول لنيوتن."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 4, "write": 1, "q": "ارسم شكلًا يبين القوى المؤثرة في راكب دراجة تتحرك بسرعة 25 كم/س على طريق أفقية.", "a": "الوزن إلى أسفل وتقابله قوة الطريق إلى أعلى، وقوة دفع الراكب إلى الأمام وتقابلها قوى الاحتكاك ومقاومة الهواء إلى الخلف؛ القوى متزنة لأن السرعة ثابتة."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 5, "write": 1, "q": "حلّل كيف يتغير وزنك باستمرار إذا كنت في مركبة فضائية تتحرك من الأرض في اتجاه القمر؟", "a": "يقل وزنك تدريجيًّا كلما ابتعدت عن الأرض لأن قوة جذبها تضعف بزيادة البعد، ثم يزداد تأثير جاذبية القمر كلما اقتربت منه؛ أما كتلتك فتبقى ثابتة."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 6, "write": 1, "q": "وضّح كيف تعتمد قوة مقاومة الهواء لجسم متحرك على سرعته؟", "a": "تزداد قوة مقاومة الهواء بازدياد سرعة الجسم."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 7, "write": 1, "q": "استنتج اتجاه القوة المحصلة المؤثرة في سيارة تتناقص سرعتها وتنعطف إلى اليمين.", "a": "تميل نحو اليمين وإلى الخلف: معاكسة جزئيًّا لاتجاه الحركة (فتتناقص السرعة) ومائلة نحو اليمين (فينعطف المسار)."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 8, "write": 1, "q": "التفكير الناقد: بيّن ما إذا كانت القوى المؤثرة متزنة أو غير متزنة: أ) تدفع صندوقًا حتى يتحرك. ب) تدفع صندوقًا لكنه لم يتحرك. جـ) تتوقف عن دفع صندوق فتتباطأ حركته. — يدفع ثلاثة طلبة صندوقًا. ما الشروط الواجب توافرها لكي تتغير حركة الصندوق؟", "a": "أ) غير متزنة. ب) متزنة. جـ) غير متزنة (الاحتكاك وحده يؤثر). ولكي تتغير حركة الصندوق يجب ألا تساوي القوة المحصلة صفرًا، أي أن تتغلب قوى الدفع على قوة الاحتكاك السكوني."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 9, "write": 1, "q": "حساب القوة المحصلة: ما القوة المحصلة المؤثرة في سيارة كتلتها 1500 كجم تتحرك بتسارع 2.0 م/ث²؟", "a": "ق = ك × ت = 1500 × 2.0 = 3000 نيوتن."}, {"t": "book", "tag": "اختبر نفسك · الدرس 1: القانونان الأول والثاني لنيوتن في الحركة", "page": 121, "no": 10, "write": 1, "q": "حساب الكتلة: تتحرك كرة بتسارع مقداره 1500 م/ث²، فإذا كانت القوة المحصلة المؤثرة فيها تساوي 300 نيوتن، فما كتلتها؟", "a": "ك = ق ÷ ت = 300 ÷ 1500 = 0.2 كجم."}, {"t": "book", "tag": "اختبر نفسك · الدرس 2: القانون الثالث لنيوتن", "page": 127, "no": 1, "write": 1, "q": "أوجد مقدار القوة التي يؤثر بها لوح التزلج فيك إذا كانت كتلتك 60 كجم، وقوتك التي تؤثر بها 60 نيوتن.", "a": "60 نيوتن؛ وفق القانون الثالث لنيوتن قوة رد الفعل تساوي قوة الفعل في المقدار وتعاكسها في الاتجاه."}, {"t": "book", "tag": "اختبر نفسك · الدرس 2: القانون الثالث لنيوتن", "page": 127, "no": 2, "write": 1, "q": "فسّر لماذا يتحرك القارب إلى الخلف عندما تقفز منه في اتجاه الرصيف؟", "a": "لأنك تدفع القارب بقدميك إلى الخلف (فعل)، فيدفعك القارب إلى الأمام بقوة مساوية (رد فعل)؛ فيتحرك القارب إلى الخلف."}, {"t": "book", "tag": "اختبر نفسك · الدرس 2: القانون الثالث لنيوتن", "page": 127, "no": 3, "write": 1, "q": "بيّن قوتي الفعل ورد الفعل عندما تطرق مسمارًا بواسطة مطرقة.", "a": "المطرقة تؤثر في المسمار بقوة إلى أسفل (فعل)، والمسمار يؤثر في المطرقة بقوة مساوية إلى أعلى (رد فعل) فيوقفها."}, {"t": "book", "tag": "اختبر نفسك · الدرس 2: القانون الثالث لنيوتن", "page": 127, "no": 4, "write": 1, "q": "استنتج: تقف على مزلاج، ويقف طفل كتلته نصف كتلتك على مزلاج آخر، ودفع كل منكما الآخر بقوة. أيكما تسارعه أكبر؟ وما نسبة تسارع الطفل إلى تسارعك؟", "a": "الطفل؛ لأن القوتين متساويتان والتسارع = ق ÷ ك، فالأقل كتلة تسارعه أكبر. نسبة تسارع الطفل إلى تسارعك = 2 : 1."}, {"t": "book", "tag": "اختبر نفسك · الدرس 2: القانون الثالث لنيوتن", "page": 127, "no": 5, "write": 1, "q": "التفكير الناقد: افترض أنك تتحرك داخل طائرة في أثناء طيرانها. استخدم القانون الثالث لنيوتن لوصف تأثير حركتك في الطائرة.", "a": "عندما تدفع أرضية الطائرة بقدميك إلى الخلف تدفعك الأرضية إلى الأمام بقوة مساوية، وتتأثر الطائرة بقوة مساوية إلى الخلف، لكن تسارعها صغير جدًّا لا يُلاحظ لأن كتلتها كبيرة جدًّا."}, {"t": "book", "tag": "اختبر نفسك · الدرس 2: القانون الثالث لنيوتن", "page": 127, "no": 6, "write": 1, "q": "حساب التسارع: أثّر شخص يقف على متن زورق بقوة مقدارها 700 نيوتن لقذف المرساة جانبيًّا. احسب تسارع الزورق إذا كانت كتلته مع الشخص تساوي 100 كجم.", "a": "ت = ق ÷ ك = 700 ÷ 100 = 7 م/ث²، في الاتجاه المعاكس لاتجاه قذف المرساة."}]}, {"short": "المفردات", "icon": "🔤", "title": "استخدام المفردات (1 – 10)", "page": 132, "time": "8 دقائق", "blocks": [{"t": "match", "h": "نشاط تمهيدي: صِل كل مصطلح بتعريفه", "pairs": [["القوة", "مؤثر دفع أو سحب يعمل على تغيير حركة الأجسام."], ["القوة المحصلة", "مجموع القوى المؤثرة في جسم ما، وهي التي تحدد كيف تتغير حركته."], ["القوى المتزنة", "قوى يلغي بعضها أثر بعض فلا تُحدث تغييرًا في السرعة المتجهة، وتكون محصلتها صفرًا."], ["القوى غير المتزنة", "قوى محصلتها لا تساوي صفرًا، فتتغير السرعة المتجهة للجسم."], ["القانون الأول لنيوتن في الحركة", "يبقى الجسم على حالته من سكون أو حركة ما لم تؤثر عليه قوة خارجية."], ["قوة الاحتكاك", "قوة ممانعة تنشأ بين سطوح الأجسام المتلامسة، وتقاوم حركة بعضها بالنسبة إلى بعض."]]}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 1, "write": 1, "q": "القوة – القصور الذاتي – الوزن", "a": "القوة: دفع أو سحب. القصور الذاتي: ميل الجسم لمقاومة تغيير حالته الحركية ويعتمد على الكتلة. الوزن: قوة جذب الأرض للجسم (و = ك × 9.8)."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 2, "write": 1, "q": "القانون الأول لنيوتن في الحركة – القانون الثالث لنيوتن في الحركة", "a": "الأول يصف حركة جسم واحد محصلة القوى عليه صفر (يبقى على حالته)، والثالث يصف زوجي قوتين متساويتين متعاكستين بين جسمين."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 3, "write": 1, "q": "الاحتكاك – القوة", "a": "القوة أي دفع أو سحب، والاحتكاك نوع من القوى يقاوم انزلاق سطحين متلامسين."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 4, "write": 1, "q": "القوة المحصلة – القوى المتزنة", "a": "القوة المحصلة مجموع القوى المؤثرة في الجسم، والقوى المتزنة قوى محصلتها صفر."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 5, "write": 1, "q": "الوزن – انعدام الوزن", "a": "الوزن قوة جذب الأرض للجسم، وانعدام الوزن حالة يبدو فيها الوزن صفرًا في السقوط الحر مع بقاء الجاذبية."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 6, "write": 1, "q": "القوى المتزنة – القوى غير المتزنة", "a": "المتزنة محصلتها صفر فلا تتغير الحركة، وغير المتزنة محصلتها لا تساوي صفرًا فتتغير السرعة المتجهة."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 7, "write": 1, "q": "الاحتكاك – الوزن", "a": "الاحتكاك قوة بين سطحين متلامسين تقاوم الحركة، والوزن قوة الجاذبية على الجسم؛ ويزداد الاحتكاك السكوني بزيادة الوزن."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 8, "write": 1, "q": "القانون الأول لنيوتن في الحركة – القانون الثالث لنيوتن في الحركة", "a": "الأول: الجسم يحافظ على حالته ما لم تؤثر فيه قوة محصلة. الثالث: لكل فعل رد فعل مساوٍ له مقدارًا ومعاكس له اتجاهًا."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 9, "write": 1, "q": "الاحتكاك – القوى غير المتزنة", "a": "عندما تتوقف عن دفع جسم يصبح الاحتكاك قوة غير متزنة تبطئه حتى يتوقف."}, {"t": "book", "tag": "استخدام المفردات", "page": 132, "no": 10, "write": 1, "q": "القوة المحصلة – القانون الثالث لنيوتن", "a": "القوة المحصلة مجموع القوى على جسم واحد، أما قوتا الفعل ورد الفعل في القانون الثالث فتؤثران في جسمين مختلفين فلا تُجمعان معًا."}]}, {"short": "تثبيت المفاهيم", "icon": "✔️", "title": "تثبيت المفاهيم: اختر الإجابة الصحيحة (11 – 17)", "page": 132, "time": "8 دقائق", "blocks": [{"t": "mcq", "tag": "السؤال 11", "q": "ما الذي يتغيّر عندما تؤثر قوى غير متزنة في جسم؟", "o": ["الكتلة", "الحركة", "القصور الذاتي", "الوزن"], "a": 1, "why": "القوى غير المتزنة تغيّر السرعة المتجهة أي الحركة.", "hint": "فكّر في القانون الأول."}, {"t": "mcq", "tag": "السؤال 12", "q": "أيّ مما يأتي يبطئ انزلاق كتاب على سطح طاولة؟", "o": ["الجاذبية", "الاحتكاك الانزلاقي", "الاحتكاك السكوني", "القصور الذاتي"], "a": 1, "why": "الكتاب منزلق فعلًا.", "hint": "الجسم يتحرك."}, {"t": "mcq", "tag": "السؤال 13", "q": "إذا كنت راكبًا دراجة، ففي أي الحالات تكون القوى المؤثرة في الدراجة متزنة؟", "o": ["عندما تتسارع الدراجة", "عندما تنعطف بسرعة مقدارها ثابت", "عندما تتباطأ الدراجة", "عندما تتحرك بسرعة ثابتة"], "a": 3, "why": "السرعة المتجهة ثابتة ⇐ المحصلة صفر.", "hint": "الانعطاف تسارع."}, {"t": "mcq", "tag": "السؤال 14", "q": "(الشكل: 20 نيوتن نحو اليسار، و5 نيوتن و10 نيوتن نحو اليمين) إذا دفع طالبان الصندوق من اليسار إلى اليمين ودفعه طالب من اليمين إلى اليسار، فبأي اتجاه يتحرك الصندوق؟", "o": ["إلى أعلى", "إلى اليسار", "إلى أسفل", "إلى اليمين"], "a": 1, "why": "المحصلة 20 − 15 = 5 نيوتن نحو اليسار.", "hint": "اجمع قوتي الطالبين ثم قارن."}, {"t": "mcq", "tag": "السؤال 15", "q": "أي مما يلي يمثل وحدة النيوتن؟", "o": ["م/ث²", "كجم.م/ث²", "كجم.م/ث", "كجم/م"], "a": 1, "why": "ق = ك × ت.", "hint": "كتلة × تسارع."}, {"t": "mcq", "tag": "السؤال 16", "q": "أي مما يأتي دفع أو سحب؟", "o": ["القوة", "الزخم", "التسارع", "القصور الذاتي"], "a": 0, "why": "تعريف القوة.", "hint": "التعريف."}, {"t": "mcq", "tag": "السؤال 17", "q": "في أي اتجاه يتسارع جسم تؤثر فيه قوة محصلة؟", "o": ["في اتجاه يميل بزاوية على اتجاه القوة", "في اتجاه القوة", "في اتجاه يعاكس اتجاه القوة", "في اتجاه قوة عمودية"], "a": 1, "why": "القانون الثاني لنيوتن.", "hint": "التسارع والقوة المحصلة."}]}, {"short": "التفكير الناقد", "icon": "🧩", "title": "التفكير الناقد", "page": 133, "time": "12 دقيقة", "blocks": [{"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 18, "write": 1, "q": "وضّح لماذا تزداد سرعة عربة التزلج مع نزولها تلًّا مغطى بالثلج، على الرغم من عدم وجود من يدفعها؟", "a": "لأن الجاذبية تسحبها إلى أسفل، فتكون القوة المحصلة (الجاذبية أكبر من الاحتكاك القليل) في اتجاه حركتها؛ فتتسارع."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 19, "write": 1, "q": "وضّح: قُذفت كرة بسرعة 40 كم/س في اتجاه الشرق، فارتدت عن حائط بسرعة 40 كم/س في اتجاه الغرب. هل تسارعت الكرة؟", "a": "نعم؛ لأن اتجاه حركتها تغيّر فتغيّرت سرعتها المتجهة رغم ثبات مقدارها."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 20, "write": 1, "q": "كوّن فرضية: عادة ما تكون قوة الفعل وقوة رد الفعل غير ملاحظتين عندما تكون الأرض أحد الجسمين. فسّر لماذا لا تكون القوة المؤثرة في الأرض واضحة؟", "a": "لأن كتلة الأرض كبيرة جدًّا، فيكون تسارعها الناتج عن القوة صغيرًا جدًّا لا يمكن ملاحظته."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 21, "write": 1, "q": "حدّد: وقفت سيارة على تل، ثم بدأت الحركة بتسارع، ثم تحركت بسرعة ثابتة، ثم بطؤت حركتها. اشرح كيف أثّر كل مما يأتي في السيارة: الاحتكاك السكوني، الاحتكاك الانزلاقي، الاحتكاك التدحرجي، مقاومة الهواء.", "a": "السكوني: أبقى السيارة ساكنة على التل، ويمكّن الإطارات من دفع الطريق دون انزلاق. الانزلاقي: بين المكابح والعجلات يبطئ السيارة عند التوقف. التدحرجي: بين الإطارات والطريق يقاوم الحركة دائمًا. مقاومة الهواء: تزداد بزيادة السرعة وتقاوم الحركة."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 22, "write": 1, "q": "استنتج: ضرب لاعب القرص في لعبة الهوكي فانزلق على الجليد بسرعة ثابتة. هل القوة هي التي جعلته يستمر في حركته؟ وضّح.", "a": "لا؛ يستمر في حركته بسبب قصوره الذاتي (القانون الأول لنيوتن)؛ لأن الاحتكاك على الجليد صغير جدًّا والقوة المحصلة تقارب الصفر."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 23, "write": 1, "q": "استنتج: استخدم القانون الثالث لنيوتن لتوضيح القوى المؤثرة عندما تضرب بقدمك كرة قدم.", "a": "قدمك تؤثر في الكرة بقوة نحو الأمام (فعل)، والكرة تؤثر في قدمك بقوة مساوية في المقدار ومعاكسة في الاتجاه (رد فعل)."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 24, "write": 1, "q": "تعرّف السبب والنتيجة: استخدم القانون الثالث لنيوتن في تفسير تسارع الصاروخ عند انطلاقه.", "a": "يدفع الصاروخ الغازات الساخنة إلى أسفل (فعل)، فتدفع الغازات الصاروخ إلى أعلى بقوة مساوية (رد فعل) تُسرّعه إلى أعلى."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 25, "write": 1, "q": "توقّع: كرتان متماثلتان في الحجم والشكل، كتلة إحداهما ضعف كتلة الأخرى. أي الكرتين تواجه قوة مقاومة هواء أكبر عندما تصل كل منهما إلى السرعة الحدّية؟", "a": "الكرة الأكبر كتلة؛ لأن مقاومة الهواء عند السرعة الحدية تساوي الوزن، ووزنها ضعف وزن الأخرى."}, {"t": "book", "tag": "التفكير الناقد", "page": 133, "no": 26, "write": 1, "q": "(الشكل: 3 نيوتن إلى أعلى، 3 نيوتن إلى أسفل، 5 نيوتن إلى اليسار، 2 نيوتن إلى اليمين) هل القوى المؤثرة في الصندوق متزنة؟ وضّح ذلك.", "a": "غير متزنة؛ القوتان الرأسيتان متزنتان، أما الأفقيتان فمحصلتهما 5 − 2 = 3 نيوتن نحو اليسار، فيتسارع الصندوق نحو اليسار."}]}, {"short": "الرياضيات", "icon": "🧮", "title": "تطبيق الرياضيات", "page": 133, "time": "8 دقائق", "blocks": [{"t": "calc", "tag": "السؤال 29", "q": "التسارع: إذا أثّرت قوة محصلة مقدارها 8 نيوتن في جسم كتلته 2 كجم فاحسب تسارعه.", "a": 4, "unit": "م/ث²", "steps": "ت = ق ÷ ك = 8 ÷ 2 = 4 م/ث².", "hint": "اقرأ المعطيات واستخدم العلاقة المناسبة."}, {"t": "calc", "tag": "السؤال 30", "q": "القوة: إذا دفعت الجدار بقوة تساوي 5 نيوتن فما مقدار القوة التي يؤثر بها الحائط في يديك؟", "a": 5, "unit": "نيوتن", "steps": "وفق القانون الثالث لنيوتن: 5 نيوتن في الاتجاه المعاكس.", "hint": "اقرأ المعطيات واستخدم العلاقة المناسبة."}, {"t": "calc", "tag": "السؤال 31", "q": "القوة المحصلة: إذا تحرك جسم كتلته 4.0 كجم بتسارع مقداره 2 م/ث² فاحسب القوة المحصلة المؤثرة فيه.", "a": 8, "unit": "نيوتن", "steps": "ق = ك × ت = 4.0 × 2 = 8 نيوتن.", "hint": "اقرأ المعطيات واستخدم العلاقة المناسبة."}, {"t": "calc", "tag": "السؤال 32", "q": "الاحتكاك: إذا دُفع كتاب كتلته 2 كجم على سطح طاولة بقوة 4 نيوتن فاحسب قوة الاحتكاك المؤثرة فيه إذا كان تسارعه 1.5 م/ث².", "a": 1, "unit": "نيوتن", "steps": "القوة المحصلة = 2 × 1.5 = 3 نيوتن؛ الاحتكاك = 4 − 3 = 1 نيوتن.", "hint": "اقرأ المعطيات واستخدم العلاقة المناسبة."}]}, {"short": "تقويم الأداء", "icon": "🎤", "title": "أنشطة تقويم الأداء", "page": 133, "time": "نشاط منزلي", "blocks": [{"t": "book", "tag": "تقويم الأداء", "page": 133, "no": 27, "q": "عرض شفهيًّا: ابحث حول أحد قوانين نيوتن في الحركة، وحضّر عرضًا شفهيًّا، وقدّم أمثلة على القانون، وقد تحتاج إلى استخدام وسائل بصرية.", "a": "نشاط مفتوح: مثل حزام الأمان (الأول)، وعربة التسوق (الثاني)، وإطلاق الصاروخ (الثالث)."}, {"t": "book", "tag": "تقويم الأداء", "page": 133, "no": 28, "q": "الكتابة بلغة علمية: صمّم تجربة حول قوانين نيوتن في الحركة، ووثّق تصميمك بالعناوين: اسم التجربة؛ أسماء شركائك؛ الفرضيات؛ المواد والأدوات؛ إجراءات التجربة؛ البيانات؛ النتائج؛ الاستنتاج.", "a": "نشاط مفتوح يُقيّم بسلّم التقدير."}]}, {"short": "الاستقصاء", "icon": "🔬", "title": "استقصاء من واقع الحياة: نمذجة الحركة في بُعدين", "page": 128, "time": "حصة عملية", "blocks": [{"t": "text", "h": "سؤال من واقع الحياة", "lead": "كيف يمكنك جمع القوى لكي تتحرك في مسار مستقيم أو في مسار قطري، أو حول الزوايا؟ ضع كرة الجولف فوق المزلاج (الطبق البلاستيكي)، ثم كوّن مسارًا على الأرض بالشريط اللاصق، وصمّم خطة لنقل الكرة عبر هذا المسار دون أن تسقط.", "list": ["الأهداف: تحرّك المزلاج على الأرض باستخدام قوتين. تقيس السرعة التي يتحرك بها المزلاج. تحدّد سهولة التغيّر في الاتجاه.", "المواد: شريط لاصق، ساعة إيقاف أو تطبيق في الجوال، شريط متري، ميزانان نابضيان بتدريج نيوتن، طبق بلاستيكي، كرة جولف أو كرة تنس طاولة.", "السلامة: ارتدِ النظارات الواقية، وانتبه للمسار حتى لا تتعثر."]}, {"t": "book", "tag": "تكوين فرضية", "page": 128, "write": 1, "q": "كيف يمكنك جمع القوى لكي تتحرك في مسار مستقيم، أو في مسار قطري، أو حول الزوايا؟", "a": "مثال: إذا سُحب المزلاج بالميزان الأمامي وحده فسيتحرك في خط مستقيم، وإذا سُحب بالميزانين معًا بقوتين متعامدتين فسيتحرك قطريًّا في اتجاه محصلتهما."}, {"t": "book", "tag": "تحليل البيانات", "page": 129, "no": 1, "write": 1, "q": "كيف كان الفرق بين مساري الحركة؟ وكيف أثّر ذلك في قوتي السحب؟", "a": "في المسار المستقيم يكفي سحب الميزان الأمامي، وعند الانعطاف أو المسار القطري يلزم سحب الميزانين معًا بقوى مختلفة."}, {"t": "book", "tag": "تحليل البيانات", "page": 129, "no": 2, "write": 1, "q": "كيف فصلت بين المتغيرات في التجربة؟ وكيف تحكّمت فيها؟", "a": "غيّرنا قوة واحدة في كل مرة وأبقينا المسار والمزلاج والكرة كما هي، وقِسنا الزمن والمسافة لحساب السرعة."}, {"t": "book", "tag": "تحليل البيانات", "page": 129, "no": 3, "write": 1, "q": "هل كانت فرضياتك مدعومة بالبيانات؟ وضّح ذلك.", "a": "نعم؛ تحرّك المزلاج في اتجاه محصلة القوتين: مستقيمًا بقوة واحدة وقطريًّا بقوتين متعامدتين."}, {"t": "book", "tag": "الاستنتاج والتطبيق", "page": 129, "no": 1, "write": 1, "q": "ماذا حدث عندما جُمعت قوتان متعامدتان؟", "a": "تحرّك المزلاج في اتجاه قطري بينهما، وهو اتجاه القوة المحصلة."}, {"t": "book", "tag": "الاستنتاج والتطبيق", "page": 129, "no": 2, "write": 1, "q": "لو قمت بسحب المزلاج في الاتجاهات الأربعة، هل يتحرك المزلاج على سطح الأرض؟ ضع فرضية جديدة لتفسير إجابتك.", "a": "إذا كانت القوى الأربع متساوية فمحصلتها صفر فلا يتحرك (قوى متزنة)، وإذا لم تكن متساوية يتحرك في اتجاه المحصلة إذا تغلبت على الاحتكاك السكوني."}]}, {"short": "اختبار مقنن", "icon": "📝", "title": "اختبار مقنن — الوحدة 5 (الفصلان 9 و10)", "page": 134, "time": "20 دقيقة", "blocks": [{"t": "mcq", "tag": "السؤال 1", "q": "ما الكمية التي تساوي حاصل قسمة المسافة المقطوعة على الزمن المستغرق؟", "o": ["تسارع", "سرعة متجهة", "سرعة", "قصور ذاتي"], "a": 2, "why": "السرعة = المسافة ÷ الزمن.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 2", "q": "ينتشر الصوت بسرعة 330 م/ث. ما الزمن اللازم لسماع صوت رعد قطع مسافة 1485 م؟", "o": ["45 ثانية", "4.5 ثانية", "4900 ثانية", "0.22 ثانية"], "a": 1, "why": "ز = 1485 ÷ 330 = 4.5 ث.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 3", "q": "(كرة تتدحرج على مسطرة من 0 إلى 3 م خلال 4 ثوانٍ) في أي الفترات الزمنية كانت السرعة المتوسطة للكرة أكبر؟", "o": ["بين صفر و1 ثانية", "بين 1 و2 ثانية", "بين 2 و3 ثانية", "بين 3 و4 ثانية"], "a": 0, "why": "قطعت أكبر مسافة في الثانية الأولى.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 4", "q": "ما السرعة المتوسطة للكرة؟", "o": ["0.75 م/ث", "1 م/ث", "10 م/ث", "1.3 م/ث"], "a": 0, "why": "3 م ÷ 4 ث = 0.75 م/ث.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 5", "q": "أي مما يأتي يحدث عندما يتسارع جسم؟", "o": ["تتزايد سرعته", "تتناقص سرعته", "يتغير اتجاه حركته", "جميع ما سبق"], "a": 3, "why": "أي تغيّر في السرعة المتجهة تسارع.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 6", "q": "(منحنى السرعة–الزمن: من 0 إلى 10 م/ث خلال 2 ث، ثم ثابت حتى 4 ث، ثم يتناقص إلى 4 م/ث عند 6 ث) ما التسارع من 0 إلى 2 ثانية؟", "o": ["10 م/ث²", "5 م/ث²", "0 م/ث²", "−5 م/ث²"], "a": 1, "why": "(10 − 0) ÷ 2 = 5 م/ث².", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 7", "q": "في أي الفترات الزمنية كانت سرعة الجسم منتظمة؟", "o": ["بين 1 و2 ثانية", "بين 2 و4 ثوانٍ", "بين 4 و5 ثوانٍ", "بين 5 و6 ثوانٍ"], "a": 1, "why": "الخط أفقي.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 8", "q": "ما التسارع في الفترة من 4 إلى 6 ثوانٍ؟", "o": ["10 م/ث²", "4 م/ث²", "6 م/ث²", "−3 م/ث²"], "a": 3, "why": "(4 − 10) ÷ 2 = −3 م/ث².", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 9", "q": "سقطت تمرة عن نخلة بتسارع 9.8 م/ث² فلامست الأرض بعد 1.5 ثانية. ما سرعتها عند ملامسة الأرض تقريبًا؟", "o": ["9.8 م/ث", "20 م/ث", "14.7 م/ث", "30 م/ث"], "a": 2, "why": "9.8 × 1.5 = 14.7 م/ث.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 10", "q": "أي الأوصاف الآتية لقوة الجاذبية غير صحيح؟", "o": ["تعتمد على كتلة كل من الجسمين", "قوة تنافر", "تعتمد على المسافة بين الجسمين", "توجد بين جميع الأجسام"], "a": 1, "why": "الجاذبية قوة تجاذب.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 11", "q": "(صندوق كتلته 2.5 كجم، 12 نيوتن نحو اليمين و1.2 نيوتن نحو اليسار) ما مقدار تسارع الصندوق؟", "o": ["27 م/ث²", "4.3 م/ث²", "4.8 م/ث²", "0.48 م/ث²"], "a": 1, "why": "(12 − 1.2) ÷ 2.5 = 4.32 م/ث².", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 12", "q": "(كوب 380 جم، كتاب 1100 جم، علبة 240 جم، مسطرة 25 جم، دباسة 620 جم) أي الأجسام له تسارع 0.89 م/ث² إذا دُفع بقوة 0.55 نيوتن؟", "o": ["الكتاب", "العلبة", "المسطرة", "المكبس (الدباسة)"], "a": 3, "why": "ك = 0.55 ÷ 0.89 ≈ 0.62 كجم = 620 جم.", "hint": "اقرأ السؤال جيدًا."}, {"t": "mcq", "tag": "السؤال 13", "q": "أي الأجسام السابقة له أكبر تسارع إذا دُفع بقوة 8.2 نيوتن؟", "o": ["العلبة", "المكبس", "المسطرة", "الكتاب"], "a": 2, "why": "أقل كتلة ⇐ أكبر تسارع.", "hint": "اقرأ السؤال جيدًا."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 14, "write": 1, "q": "ما سرعة حصان سباق يقطع مسافة 1500 متر خلال 125 ثانية؟", "a": "ع = 1500 ÷ 125 = 12 م/ث."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 15, "write": 1, "q": "تحركت سيارة مدة 5.5 ساعة بسرعة متوسطة 75 كم/س. ما المسافة التي قطعتها؟", "a": "ف = 75 × 5.5 = 412.5 كم."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 16, "write": 1, "q": "تحركت رزان 2 كم شمالًا، ثم 2 كم شرقًا، ثم 2 كم جنوبًا، ثم 2 كم غربًا. ما المسافة الكلية؟ وما إزاحتها؟", "a": "المسافة 8 كم، والإزاحة صفر لأنها عادت إلى نقطة البداية."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 17, "write": 1, "q": "هل يعتمد التسارع على سرعة الجسم؟ فسّر إجابتك.", "a": "لا؛ يعتمد التسارع على القوة المحصلة وكتلة الجسم فقط (ت = ق ÷ ك)."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 18, "write": 1, "q": "(صورة متعاقبة لكرة مقذوفة إلى أعلى ثم تهبط) صِف حركة الكرة من حيث سرعتها، وسرعتها المتجهة، وتسارعها.", "a": "تتناقص سرعتها في أثناء الصعود حتى تصبح أقل ما يمكن في أعلى المسار، ثم تتزايد في أثناء الهبوط؛ ويتغير اتجاه سرعتها المتجهة باستمرار؛ وتسارعها ثابت نحو الأسفل بسبب الجاذبية."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 19, "write": 1, "q": "في أي جزء من حركتها كان تسارعها موجبًا؟ وفي أي جزء كان سالبًا؟ فسّر.", "a": "سالب في أثناء الصعود لأن سرعتها تتناقص، وموجب في أثناء الهبوط لأن سرعتها تتزايد."}, {"t": "book", "tag": "أسئلة الإجابات القصيرة والمفتوحة", "page": 135, "no": 20, "write": 1, "q": "عندما يدور رواد الفضاء حول الأرض فإنهم يسبحون داخل السفينة بسبب انعدام الوزن. وضّح هذا التأثير.", "a": "السفينة والرواد في حالة سقوط حر حول الأرض بالتسارع نفسه، فلا تؤثر الأرضية فيهم بقوة إلى أعلى، فيبدون بلا وزن مع أن الجاذبية تؤثر فيهم."}]}, {"short": "التحدي الشامل", "icon": "🏆", "title": "التحدي الشامل: سباق العلماء وبطاقات أونو", "page": 133, "time": "10 دقائق", "blocks": [{"t": "challenge", "tag": "سباق العلماء", "sec": 30, "qs": [{"q": "القوة هي:", "o": ["كمية المادة في الجسم", "دفع أو سحب", "المسافة ÷ الزمن", "مقاومة الهواء فقط"], "c": 1}, {"q": "ينص القانون الأول لنيوتن على أن الجسم:", "o": ["يتوقف دائمًا بعد فترة", "يبقى على حالته من سكون أو حركة ما لم تؤثر عليه قوة خارجية", "يتسارع بقوة ثابتة", "يتحرك في دائرة"], "c": 1}, {"q": "الاحتكاك بين مكابح الدراجة وعجلتها:", "o": ["سكوني", "انزلاقي", "تدحرجي", "جاذبية"], "c": 1}, {"q": "1 نيوتن يساوي:", "o": ["1 كجم.م/ث", "1 كجم.م/ث²", "1 م/ث²", "1 كجم/م"], "c": 1}, {"q": "القوة المركزية في الحركة الدائرية تتجه:", "o": ["نحو مركز المسار", "بعيدًا عن المركز", "في اتجاه الحركة", "إلى أعلى دائمًا"], "c": 0}, {"q": "تدفع الرافعة السيارة إلى أعلى (الشكل 12). قوة رد الفعل:", "o": ["وزن السيارة", "دفع السيارة للرافعة إلى أسفل", "احتكاك الأرض", "مقاومة الهواء"], "c": 1}, {"q": "دفع الطفل حائط المسبح برجليه (الشكل 14) فاندفع إلى الأمام لأن:", "o": ["الماء دفعه", "الحائط دفعه بقوة رد فعل", "وزنه قلّ", "الجاذبية انعدمت"], "c": 1}, {"q": "عندما تمشي إلى الأمام فإنك تدفع الأرض:", "o": ["إلى الأمام", "إلى الخلف فتدفعك إلى الأمام", "إلى أعلى", "لا تدفعها"], "c": 1}]}, {"t": "uno", "tag": "بطاقات أونو: الجولة الحاسمة", "cards": [{"k": "r", "p": 1, "q": "ما المقصود بـ«القوة»؟", "a": "مؤثر دفع أو سحب يعمل على تغيير حركة الأجسام."}, {"k": "b", "p": 2, "q": "ما المقصود بـ«القوة المحصلة»؟", "a": "مجموع القوى المؤثرة في جسم ما، وهي التي تحدد كيف تتغير حركته."}, {"k": "y", "p": 3, "q": "ما المقصود بـ«القوى المتزنة»؟", "a": "قوى يلغي بعضها أثر بعض فلا تُحدث تغييرًا في السرعة المتجهة، وتكون محصلتها صفرًا."}, {"k": "r", "p": 4, "q": "ما المقصود بـ«القوى غير المتزنة»؟", "a": "قوى محصلتها لا تساوي صفرًا، فتتغير السرعة المتجهة للجسم."}, {"k": "x", "p": 1, "q": "ما المقصود بـ«القانون الأول لنيوتن في الحركة»؟", "a": "يبقى الجسم على حالته من سكون أو حركة ما لم تؤثر عليه قوة خارجية."}]}, {"t": "achieve", "msg": "مبارك! أتممت الفصل العاشر: القوة وقوانين نيوتن. الفصل القادم: الكهرباء ⚡"}]}]};</script><script>window.SIMS={};</script><script src="../assets/f5c030333886f55a.js"></script><script src="../pen.js" defer></script></body></html>
