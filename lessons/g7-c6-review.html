/b>", "o": ["الغلاف الصخري", "الغلاف اللدن", "اللب الداخلي", "الستار (الوشاح)"], "k": 0}, {"s": "تثبيت المفاهيم", "q": "أي القوى تسبب تقارب الصفائح؟", "a": "<b>ب. الضغط</b>", "o": ["الشد", "الضغط", "القص", "التوازن"], "k": 1}, {"s": "تثبيت المفاهيم", "q": "أي القوى تسبب تباعد الصفائح؟", "a": "<b>أ. الشد</b>", "o": ["الشد", "الضغط", "القص", "التوازن"], "k": 0}, {"s": "تثبيت المفاهيم", "q": "أي نوع من حركة الصفائح الأرضية تحدث عند الحدود التحويلية؟", "a": "<b>د. انزلاق الصفائح بعضها بجانب بعض</b>", "o": ["تقارب الصفائح", "تباعد الصفائح", "غوص الصفائح", "انزلاق الصفائح بعضها بجانب بعض"], "k": 3}, {"s": "تثبيت المفاهيم", "q": "أي عوامل التعرية التالية يكوّن وديانًا على شكل حرف U؟", "a": "<b>ج. الجليد</b>", "o": ["الرياح", "المياه", "الجليد", "الجاذبية"], "k": 2}, {"s": "تثبيت المفاهيم", "q": "أي الأماكن التالية تكون فيها التجوية الكيميائية أكثر نشاطًا؟", "a": "<b>د. المناطق الاستوائية</b>", "o": ["الصحارى", "الجبال", "المناطق القطبية", "المناطق الاستوائية"], "k": 3}, {"s": "تثبيت المفاهيم", "q": "عندما يتحد ثاني أكسيد الكربون مع الماء يتكوّن:", "a": "<b>ب. حمض الكربونيك</b>", "o": ["كربونات الكالسيوم", "حمض الكربونيك", "حمض التنيك", "حمض الهيدروكلوريك"], "k": 1}, {"s": "تثبيت المفاهيم", "q": "أي عوامل التعرية التالية يكوّن الكثبان الرملية؟", "a": "<b>أ. الرياح</b>", "o": ["الرياح", "المياه", "الجاذبية", "الجليد"], "k": 0}, {"s": "تثبيت المفاهيم", "q": "<b style=\"color:var(--c)\">وضّح</b>: كيف تحدد ما إذا كان الجبل ما زال في طور التشكل؟", "a": "الجبل الذي ما زال في طور التشكل يكون <b>مرتفعًا ذا قمم حادة وعرة</b>؛ لأن التجوية والتعرية لم تؤثرا فيه مدة طويلة، أما الجبل القديم فيكون منخفضًا وقممه مستديرة متآكلة."}, {"s": "تثبيت المفاهيم", "q": "<b style=\"color:var(--c)\">استنتج</b>: كيف تتباطأ الأمواج الزلزالية عند دخولها الغلاف اللدن، وعلامَ يدل هذا حول طبيعة هذا الغلاف؟", "a": "تنتقل الموجات أبطأ في المواد الأقل صلابة؛ فتباطؤها يدل على أن <b>الغلاف اللدن مادة لدنة شبه منصهرة</b> قابلة للتشكل والحركة، تتحرك فوقها صفائح الغلاف الصخري."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">توقّع</b>: ماذا يحدث لارتفاع جزيرة جرينلاند عندما تنصهر طبقة الجليد؟", "a": "<b>ترتفع الجزيرة تدريجيًّا</b>؛ لأن وزن الجليد يقل فترتفع القشرة الأرضية حتى تتوازن من جديد (التوازن)، كما ارتفعت القطعة الخشبية في مختبر التوازن."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">صف</b>: إذا أردت أن تعرف أن جبلًا تشكّل بفعل قوى الضغط فعمَّ تبحث؟", "a": "أبحث عن <b>طبقات صخرية مطوية منحنية (طيات)</b>، وعن وقوع الجبل عند حدود صفائح متقاربة، مثل جبال زاجروس."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">قارن</b>: بين الجبال البركانية والجبال المطوية، ارسم مخططًا لكل نوع من الجبال، وحدّد الأجزاء على الرسم.", "a": "<b>البركانية:</b> تتكوّن من تراكم طبقات اللابة والرماد البركاني حول الفتحة، وقد تتكوّن في قاع المحيط. أجزاء المخطط: الفوهة، والأنبوب، وحجرة الصهارة، وطبقات اللابة والرماد.<br><b>المطوية:</b> تتكوّن بقوى الضغط عند تقارب الصفائح فتنثني طبقات الصخور. أجزاء المخطط: الطبقات الصخرية المطوية، والطيات، واتجاه قوى الضغط.<br><b>وجه الاختلاف:</b> الأولى ببناء مواد جديدة من باطن الأرض، والثانية بثني صخور موجودة. <i>(الرسم يرسمه الطالب.)</i>"}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">السبب والنتيجة</b>: اشرح كيف تعمل مياه الأنهار على تكوين الوديان، وكيف تشكّل الجليديات وديانًا على شكل حرف U.", "a": "<b>النهر:</b> يحتّ الماء الجاري بسرعة قاع مجراه بما يحمله من رسوبيات فيعمّقه، فيتكوّن وادٍ ضيق عميق على شكل حرف V.<br><b>الجليديات:</b> تنزلق ببطء وتحمل صخورًا تكشط قاع الوادي وجوانبه معًا، فتوسّعه ويصبح على شكل حرف U."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">كوّن</b>: فرضية حول كيفية عمل المياه العميقة والجليديات الضخمة على تعرية الصخور.", "a": "<i>نموذج فرضية:</i> كلما زاد عمق الماء أو حجم الجليدية زادت قدرتهما على تعرية الصخور؛ لأن الوزن وكمية الرسوبيات والصخور المحمولة التي تحتّ القاع تزداد."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">صنّف</b>: كلًّا من الكثبان الرملية والدلتا والرواسب الجليدية وفق العوامل التي ترسبها.", "a": "الكثبان الرملية ← <b>الرياح</b>.<br>الدلتا ← <b>الماء الجاري (الأنهار)</b>.<br>الرواسب الجليدية ← <b>الجليديات</b>."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">خريطة المفاهيم</b>: ارسم خريطة مفاهيم تبين فيها الأنواع المختلفة من حركات الكتل الأرضية.", "a": "<b>حركة الكتل الأرضية (بفعل الجاذبية)</b> ← الزحف (بطيء جدًّا) • السقوط • الانزلاق الصخري (سريع) • التدفق الطيني (ماء ورسوبيات يتحرك كالعجين)."}, {"s": "التفكير الناقد", "q": "<b style=\"color:var(--c)\">ملصقات</b>: استخدم صورًا من مجلات قديمة لعمل ملصق يوضح الأنواع المختلفة من التجوية والتعرية، واعرض ملصقك على الصف.", "a": "نشاط للطالب. يُقسم الملصق إلى: <b>التجوية الميكانيكية</b> (الجليد، الجذور)، و<b>التجوية الكيميائية</b> (الأحماض، الأكسجين)، و<b>عوامل التعرية</b> (الجاذبية، الجليديات، الرياح، الماء)، مع صورة لكل نوع."}, {"s": "أنشطة تقويم الأداء", "q": "<b style=\"color:var(--c)\">عمل نموذج</b>: استخدم البوليستيرين وألواح الورق المقوى والطين لعمل نموذج لإحدى الجليديات، موضحًا فيه جداول ماء تخرج من الجليديات، وحدّد المناطق التي تحدث فيها التعرية والترسيب.", "a": "نشاط للطالب. يوضح النموذج: الجليدية تنحدر في وادٍ على شكل حرف U <b>(تعرية)</b>، وعند مقدمتها حيث ينصهر الجليد تخرج جداول الماء وتتجمع <b>الرواسب الجليدية (ترسيب)</b>."}, {"s": "تطبيق الرياضيات", "q": "<b style=\"color:var(--c)\">تسلّق الجبال</b>: يقوم متسلقو جبل إفرست بالتسلق حتى مخيم القاعدة الذي يقع على ارتفاع ٥٤٠٠ م، فإذا كانت قمة الجبل على ارتفاع ٨٨٥٠ م فما نسبة ارتفاع المخيم بالنسبة لارتفاع القمة؟", "a": "النسبة = ٥٤٠٠ ÷ ٨٨٥٠ × ١٠٠ ≈ <b>٦١٪</b>."}];

  var d=D[cur],sh=all||shown[cur];seen[cur]=1;card.className='card'+(sh?' shown':'');
  var h='<span class="sec">'+d.s+'</span><p class="q"><span class="n">'+ar(cur+1)+'</span>'+d.q+'</p>';
  if(d.img)h+='<div class="fig"><img loading="lazy" decoding="async" src="'+Q15+'" alt="رسم نواتي ذرتي كربون"></div>';
  if(d.o)h+='<div class="ops">'+d.o.map(function(o,i){return '<div class="op'+(i===d.k?' ok':'')+'"><b>'+'أبجد'[i]+'</b><span>'+o+'</span></div>'}).join('')+'</div>';
  h+='<div class="ans">'+d.a+'</div>';card.innerHTML=h;rv.style.visibility='visible';rv.textContent=sh?'🙈 إخفاء الحل':'💡 إظهار الحل';rv.className='rv'+(sh?' hide':'');
  document.getElementById('pg').textContent='السؤال '+ar(cur+1)+' من '+ar(D.length);mark();fit()}
function fit(){var q=card.querySelector('.q');if(!q)return;card.style.fontSize='';var s=1;card.querySelectorAll('.q,.op,.ans').forEach(function(e){e.style.fontSize=''});
  for(var i=0;i<8&&card.scrollHeight>card.clientHeight+2;i++){s*=.92;card.querySelectorAll('.q,.op,.ans').forEach(function(e){e.style.fontSize='';var f=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(f*s)+'px'})}}
function mark(){dots.querySelectorAll('i').forEach(function(e,i){e.className=i===cur?'on':seen[i]?'seen':''})}
function go(i){cur=Math.max(-1,Math.min(D.length-1,i));render()}
function toggle(){if(cur<0){go(0);return}shown[cur]=!(all||shown[cur]);if(all&&!shown[cur])all=false;render()}
document.getElementById('nx').onclick=function(){go(cur+1)};document.getElementById('pv').onclick=function(){go(cur-1)};rv.onclick=toggle;
dots.onclick=function(e){var i=e.target.dataset.i;if(i!=null)go(+i)};
document.getElementById('all').onclick=function(){all=!all;shown={};this.textContent=all?'إخفاء كل الحلول':'إظهار كل الحلول';render()};
document.getElementById('fs').onclick=function(){var d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);else d.exitFullscreen()};
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='PageDown'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='PageUp'){go(cur-1);e.preventDefault()}else if(e.key===' '||e.key==='Enter'){toggle();e.preventDefault()}});
addEventListener('resize',fit);
go(-1);
</script><script src="../pen.js" defer></script></body></html>
