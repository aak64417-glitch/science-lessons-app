:root{--c:#5b3fd6;--c2:#ede9fe;--ok:#047857;--okb:#d1fae5;--ink:#111827;--mut:#4b5563;--bg:#f7f6fb}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,sans-serif;font-weight:700;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 22px;background:var(--c);color:#fff;flex:none}
header h1{margin:0;font-size:clamp(18px,2vw,28px);font-weight:700;flex:1}
header .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 16px;font-size:clamp(15px,1.5vw,22px)}
header button{font:inherit;font-size:clamp(14px,1.3vw,19px);border:0;border-radius:12px;padding:7px 14px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
main{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:1.4vh 3vw}
.card{width:100%;max-width:1500px;height:100%;background:#fff;border-radius:26px;box-shadow:0 10px 40px rgba(30,20,80,.12);padding:2.6vh 3.2vw;display:flex;flex-direction:column;overflow:hidden;border-top:10px solid var(--c)}
.sec{display:inline-block;align-self:flex-start;background:var(--c2);color:var(--c);border-radius:999px;padding:4px 20px;font-size:clamp(16px,1.7vw,26px);margin-bottom:1.4vh}
.q{font-size:clamp(24px,3vw,46px);line-height:1.6;margin:0 0 1.6vh}
.q .n{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;background:var(--c);color:#fff;font-size:.8em;margin-left:.4em;vertical-align:.1em}
.q .blank{display:inline-block;min-width:5em;border-bottom:4px dashed #9ca3af;text-align:center;color:transparent;transition:.3s}
.shown .q .blank{color:var(--ok);border-bottom-color:var(--ok)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.6vw;margin-top:.6vh}
.op{font-size:clamp(20px,2.4vw,38px);border:3px solid #e5e7eb;border-radius:18px;padding:1.1vh 1.2vw;display:flex;gap:.6em;align-items:center;line-height:1.45;transition:.3s}
.op b{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:#f3f4f6;font-size:.85em}
.shown .op.ok{border-color:var(--ok);background:var(--okb);color:#064e3b}.shown .op.ok b{background:var(--ok);color:#fff}
.shown .op:not(.ok){display:none}.shown .ops{grid-template-columns:1fr}
.ans{margin-top:auto;border-radius:20px;background:var(--okb);border-right:10px solid var(--ok);padding:1.6vh 1.6vw;font-size:clamp(21px,2.5vw,40px);line-height:1.6;color:#064e3b;display:none}
.ans:before{content:"✔ الحل";display:block;font-size:.62em;color:var(--ok);margin-bottom:.2em}
.shown .ans{display:block;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.ans table{border-collapse:collapse;margin-top:.4em;font-size:.82em}.ans td,.ans th{border:2px solid #6ee7b7;padding:.15em .7em;text-align:center}.ans th{background:#a7f3d0}
.fig{display:flex;justify-content:center;margin:.6vh 0}.fig img{height:clamp(110px,22vh,230px);border-radius:12px}
footer{flex:none;display:flex;align-items:center;gap:10px;padding:10px 22px 14px;justify-content:center}
footer button{font:inherit;font-weight:700;font-size:clamp(17px,1.8vw,26px);border:0;border-radius:16px;padding:10px 26px;cursor:pointer;background:#fff;color:var(--c);box-shadow:0 3px 12px rgba(30,20,80,.12)}
footer .rv{background:var(--ok);color:#fff;min-width:220px}footer .rv.hide{background:#6b7280}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:52vw}
.dots i{font-style:normal;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;color:#374151;font-size:clamp(12px,1.05vw,16px);cursor:pointer}
.dots i.on{background:var(--c);color:#fff}.dots i.seen{background:#c4b5fd;color:#2e1065}
.cover{justify-content:center;align-items:center;text-align:center;gap:2vh}
.cover h2{font-size:clamp(34px,5vw,78px);margin:0;color:var(--c);line-height:1.3}
.cover p{font-size:clamp(20px,2.4vw,36px);margin:0;color:var(--mut)}
.cover .chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.cover .chips span{background:var(--c2);color:var(--c);border-radius:999px;padding:6px 20px;font-size:clamp(16px,1.7vw,26px)}
</style></head><body>

<main><div class="card" id="card"></div></main>
<footer><button id="pv">→ السابق</button><button class="rv" id="rv">💡 إظهار الحل</button><button id="nx">التالي ←</button><div class="dots" id="dots"></div></footer>

{s:'تثبيت المفاهيم',q:'يعد محلول السكر والماء:',o:['عنصرًا','مخلوطًا غير متجانس','مركبًا','مخلوطًا متجانسًا'],k:3,a:'<b>د. مخلوطًا متجانسًا</b> (محلول): يذوب السكر في الماء ويتوزع بانتظام فلا نميّز مكوناته.'},
{s:'تثبيت المفاهيم',q:'تحتوي ذرة على ١٢ بروتونًا و١٢ نيوترونًا، وتحتوي ذرة أخرى على ١٢ بروتونًا و١٦ نيوترونًا. ما هاتان الذرتان؟',o:['ذرتا كروم','عنصران مختلفان','نظيران للعنصر نفسه','مشحونتان شحنة سالبة'],k:2,a:'<b>ج. نظيران للعنصر نفسه</b>: العدد نفسه من البروتونات (١٢، أي المغنيسيوم) مع اختلاف عدد النيوترونات.'},
{s:'تثبيت المفاهيم',q:'إذا تماثلت العناصر المكونة لمركبين فلا بد أن:',o:['المركبين متماثلان','خصائص المركبين الفيزيائية والكيميائية متماثلة','الصيغ الكيميائية للمركبين متماثلة','الرموز الكيميائية في صيغ المركبين متماثلة، لكن الأرقام قد تختلف'],k:3,a:'<b>د.</b> مثل الماء H<sub>2</sub>O وفوق أكسيد الهيدروجين H<sub>2</sub>O<sub>2</sub>: الرموز نفسها (H و O) لكن الأرقام مختلفة، فهما مركبان مختلفان.'},
{s:'تثبيت المفاهيم',q:'تتكوّن الذرة من:',o:['إلكترونات وبروتونات','نيوترونات وبروتونات','إلكترونات وبروتونات ونيوترونات','عناصر وبروتونات وإلكترونات'],k:2,a:'<b>ج. إلكترونات وبروتونات ونيوترونات</b>'},
{s:'تثبيت المفاهيم',q:'الجسيمات ذات الشحنة السالبة في الذرة هي:',o:['البروتونات','الإلكترونات','النيوترونات','النواة'],k:1,a:'<b>ب. الإلكترونات</b>'},
{s:'تثبيت المفاهيم',q:'أين تتواجد الإلكترونات في الذرة؟',o:['في النواة مع البروتونات','مرافقة للنيوترونات','حول النواة على شكل سحابة إلكترونية','في الجدول الدوري للعناصر'],k:2,a:'<b>ج. حول النواة على شكل سحابة إلكترونية</b>'},
{s:'تثبيت المفاهيم',q:'أي المواد التالية خليط غير متجانس؟',o:['الهواء','السَّلَطة','عصير التفاح','سبيكة الذهب'],k:1,a:'<b>ب. السَّلَطة</b>: يمكن تمييز مكوناتها بالعين. أما الهواء وعصير التفاح والسبيكة فمخاليط متجانسة.'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">صف</b>: استخدم الجدول الدوري لإيجاد العدد الذري لكل من الكربون والصوديوم والنيكل.',a:'<table><tr><th>العنصر</th><th>الرمز</th><th>العدد الذري</th></tr><tr><td>الكربون</td><td>C</td><td>٦</td></tr><tr><td>الصوديوم</td><td>Na</td><td>١١</td></tr><tr><td>النيكل</td><td>Ni</td><td>٢٨</td></tr></table>'},
{s:'التفكير الناقد',q:'ما العنصر الذي يحتوي على ٧ بروتونات؟',a:'<b>النيتروجين (N)</b>، لأن عدده الذري ٧.'},
{s:'التفكير الناقد',q:'الرسمان التاليان لذرتي كربون. هل هما نظيران أم لا؟ فسر إجابتك.',img:1,a:'<b>نعم، هما نظيران</b>: في كل نواة ٦ بروتونات (فكلتاهما كربون)، لكن عدد النيوترونات مختلف: ٦ في الأولى و٧ في الثانية (كربون-١٢ وكربون-١٣).'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">فسر</b>: كيف يمكن أن يكون (كوبالت-٦٠) و(كوبالت-٥٩) العنصر نفسه، مع أن لكل منهما عددًا كتليًّا مختلفًا؟',a:'لأن لكليهما <b>العدد نفسه من البروتونات (٢٧)</b>، فهما العنصر نفسه، لكن عدد النيوترونات مختلف: كوبالت-٥٩ فيه <b>٣٢</b> نيوترونًا، وكوبالت-٦٠ فيه <b>٣٣</b>؛ فهما <b>نظيران</b>.'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">اشرح</b>: كيف يمكن حساب الكتلة الذرية للعنصر؟',a:'الكتلة الذرية هي <b>متوسط كتل نظائر العنصر</b> مع مراعاة <b>نسبة وجود كل نظير</b> في الطبيعة: نضرب كتلة كل نظير في نسبة وجوده، ثم نجمع النواتج.'},
{s:'أنشطة تقويم الأداء',q:'<b style="color:var(--c)">اعمل بحثًا</b>: تخيل نفسك صحفيًّا في العام ١٨٩٦م، وقد سمعت عن اكتشاف الإلكترون. اعمل بحثًا، واكتب مقالة تتكلم فيها عن اكتشاف الإلكترون، والعالِم الذي اكتشفه.',a:'إجابة مفتوحة. عناصر المقالة: العالِم <b>طومسون</b> اكتشف الإلكترون باستخدام <b>أنبوب أشعة المهبط</b>؛ إذ انحرفت الأشعة نحو اللوح الموجب، فاستنتج أنها <b>جسيمات سالبة الشحنة</b> موجودة في جميع الذرات.'},
{s:'تطبيق الرياضيات',q:'<b style="color:var(--c)">الكتلة الذرية</b>: عنصر الكريبتون له ستة نظائر طبيعية، أعدادها الكتلية: ٧٨، ٨٠، ٨٢، ٨٣، ٨٤ و٨٦. اعمل جدولًا يبين عدد البروتونات والإلكترونات والنيوترونات في كل من تلك النظائر.',a:'العدد الذري للكريبتون <b>٣٦</b>، فالبروتونات = الإلكترونات = ٣٦، والنيوترونات = العدد الكتلي − ٣٦.<table><tr><th>العدد الكتلي</th><th>٧٨</th><th>٨٠</th><th>٨٢</th><th>٨٣</th><th>٨٤</th><th>٨٦</th></tr><tr><td>البروتونات</td><td>٣٦</td><td>٣٦</td><td>٣٦</td><td>٣٦</td><td>٣٦</td><td>٣٦</td></tr><tr><td>الإلكترونات</td><td>٣٦</td><td>٣٦</td><td>٣٦</td><td>٣٦</td><td>٣٦</td><td>٣٦</td></tr><tr><td>النيوترونات</td><td>٤٢</td><td>٤٤</td><td>٤٦</td><td>٤٧</td><td>٤٨</td><td>٥٠</td></tr></table>'},
{s:'تطبيق الرياضيات',q:'<b style="color:var(--c)">نسبة الذرات</b>: ما نسبة الهيدروجين إلى الأكسجين في كل من حمض الكبريتيك (H<sub>2</sub>SO<sub>4</sub>) وفوق أكسيد الهيدروجين (H<sub>2</sub>O<sub>2</sub>)؟',a:'حمض الكبريتيك H<sub>2</sub>SO<sub>4</sub>: ذرتا هيدروجين إلى ٤ ذرات أكسجين = <b>٢ : ٤ = ١ : ٢</b><br>فوق أكسيد الهيدروجين H<sub>2</sub>O<sub>2</sub>: ذرتا هيدروجين إلى ذرتي أكسجين = <b>٢ : ٢ = ١ : ١</b>'}
];
var AR='٠١٢٣٤٥٦٧٨٩';function ar(n){return String(n).replace(/\d/g,function(d){return AR[d]})}
var cur=-1,shown={},all=false,seen={};
var card=document.getElementById('card'),rv=document.getElementById('rv'),dots=document.getElementById('dots');
dots.innerHTML=D.map(function(_,i){return '<i data-i="'+i+'">'+ar(i+1)+'</i>'}).join('');
function render(){if(cur<0){card.className='card cover';card.innerHTML='<h2>حل أسئلة مراجعة الفصل الرابع</h2><p>الذرات والعناصر والجدول الدوري · علوم الصف الأول المتوسط</p><div class="chips"><span>استخدام المفردات ١–٥</span><span>تثبيت المفاهيم ٦–١٢</span><span>التفكير الناقد ١٣–١٧</span><span>تقويم الأداء ١٨</span><span>تطبيق الرياضيات ١٩–٢٠</span></div><p style="font-size:clamp(16px,1.6vw,24px)">المسافة أو Enter: إظهار الحل · الأسهم: التنقل</p>';rv.style.visibility='hidden';document.getElementById('pg').textContent='الغلاف';mark();return}
  var d=D[cur],sh=all||shown[cur];seen[cur]=1;card.className='card'+(sh?' shown':'');
  var h='<span class="sec">'+d.s+'</span><p class="q"><span class="n">'+ar(cur+1)+'</span>'+d.q+'</p>';
  if(d.img)h+='<div class="fig"><img src="'+Q15+'" alt="رسم نواتي ذرتي كربون"></div>';
  if(d.o)h+='<div class="ops">'+d.o.map(function(o,i){return '<div class="op'+(i===d.k?' ok':'')+'"><b>'+'أبجد'[i]+'</b><span>'+o+'</span></div>'}).join('')+'</div>';
  h+='<div class="ans">'+d.a+'</div>';card.innerHTML=h;rv.style.visibility='visible';rv.textContent=sh?'🙈 إخفاء الحل':'💡 إظهار الحل';rv.className='rv'+(sh?' hide':'');
  document.getElementById('pg').textContent='السؤال '+ar(cur+1)+' من '+ar(D.length);mark();fit()}
function fit(){var q=card.querySelector('.q');if(!q)return;card.style.fontSize='';var s=1;card.querySelectorAll('.q,.op,.ans').forEach(function(e){e.style.fontSize=''});
  for(var i=0;i<8&&card.scrollHeight>card.clientHeight+2;i++){s*=.92;card.querySelectorAll('.q,.op,.ans').forEach(function(e){e.style.fontSize='';var f=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(f*s)+'px'})}}
function mark(){dots.querySelectorAll('i').forEach(function(e,i){e.className=i===cur?'on':seen[i]?'seen':''})}
function go(i){cur=Math.max(-1,Math.min(D.length-1,i));render()}
function toggle(){if(cur<0){go(0);return}shown[cur]=!(all||shown[cur]);if(all&&!shown[cur])all=false;render()}
document.getElementById('nx').onclick=function(){go(cur+1)};document.getElementById('pv').onclick=function(){go(cur-1)};rv.onclick=toggle;
dots.onclick=function(e){var i=e.target.dataset.i;if(i!=null)go(+i)};
document.getElementById('all').onclick=function(){all=!all;shown={};this.textContent=all?'إخفاء كل الحلول':'إظهار كل الحلول';render()};
document.getElementById('fs').onclick=function(){var d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);else d.exitFullscreen()};
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='PageDown'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='PageUp'){go(cur-1);e.preventDefault()}else if(e.key===' '||e.key==='Enter'){toggle();e.preventDefault()}});
addEventListener('resize',fit);
go(-1);
</script><script src="../pen.js" defer></script></body></html>
