<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><script src="../tools/gradeview.js"></script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حل أسئلة مراجعة الفصل الخامس</title>
<style>
@font-face{font-family:"Cairo";font-weight:600;font-display:swap;src:url(../assets/025baf0d675e2423.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}@font-face{font-family:"Cairo";font-weight:600;font-display:swap;src:url(../assets/f659c03eabef9939.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:"Cairo";font-weight:700;font-display:swap;src:url(../assets/2d843a01ca09a451.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}@font-face{font-family:"Cairo";font-weight:700;font-display:swap;src:url(../assets/c93f95f05c222111.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--c:#b4530a;--c2:#ffedd5;--ok:#047857;--okb:#d1fae5;--ink:#111827;--mut:#4b5563;--bg:#f7f6fb}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,sans-serif;font-weight:700;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 22px;background:var(--c);color:#fff;flex:none}
header h1{margin:0;font-size:clamp(18px,2vw,28px);font-weight:700;flex:1}
header .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 16px;font-size:clamp(15px,1.5vw,22px)}
header button{font:inherit;font-size:clamp(14px,1.3vw,19px);border:0;border-radius:12px;padding:7px 14px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
main{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:1.4vh 3vw}
.card{width:100%;max-width:1500px;height:100%;background:#fff;border-radius:26px;box-shadow:0 10px 40px rgba(30,20,80,.12);padding:2.6vh 3.2vw;display:flex;flex-direction:column;overflow:hidden;border-top:10px solid var(--c)}
.sec{display:inline-block;align-self:flex-start;background:var(--c2);color:var(--c);border-radius:999px;padding:4px 20px;font-size:clamp(16px,1.7vw,26px);margin-bottom:1.4vh}
.q{font-size:clamp(24px,3vw,46px);line-height:1.6;margin:0 0 1.6vh}
.q .n{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;background:var(--c);color:#fff;font-size:.8em;margin-left:.4em;vertical-align:.1em}
.q .blank{display:inline-block;min-width:5em;border-bottom:4px dashed #9ca3af;text-align:center;color:transparent;transition:.3s}
.shown .q .blank{color:var(--ok);border-bottom-color:var(--ok)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.6vw;margin-top:.6vh}
.op{font-size:clamp(20px,2.4vw,38px);border:3px solid #e5e7eb;border-radius:18px;padding:1.1vh 1.2vw;display:flex;gap:.6em;align-items:center;line-height:1.45;transition:.3s}
.op b{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:#f3f4f6;font-size:.85em}
.shown .op.ok{border-color:var(--ok);background:var(--okb);color:#064e3b}.shown .op.ok b{background:var(--ok);color:#fff}
.shown .op:not(.ok){display:none}.shown .ops{grid-template-columns:1fr}
.ans{margin-top:auto;border-radius:20px;background:var(--okb);border-right:10px solid var(--ok);padding:1.6vh 1.6vw;font-size:clamp(21px,2.5vw,40px);line-height:1.6;color:#064e3b;display:none}
.ans:before{content:"✔ الحل";display:block;font-size:.62em;color:var(--ok);margin-bottom:.2em}
.shown .ans{display:block;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.ans table{border-collapse:collapse;margin-top:.4em;font-size:.82em}.ans td,.ans th{border:2px solid #6ee7b7;padding:.15em .7em;text-align:center}.ans th{background:#a7f3d0}
.fig{display:flex;justify-content:center;margin:.6vh 0}.fig img{height:clamp(110px,22vh,230px);border-radius:12px}
footer{flex:none;display:flex;align-items:center;gap:10px;padding:10px 22px 14px;justify-content:center}
footer button{font:inherit;font-weight:700;font-size:clamp(17px,1.8vw,26px);border:0;border-radius:16px;padding:10px 26px;cursor:pointer;background:#fff;color:var(--c);box-shadow:0 3px 12px rgba(30,20,80,.12)}
footer .rv{background:var(--ok);color:#fff;min-width:220px}footer .rv.hide{background:#6b7280}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:52vw}
.dots i{font-style:normal;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;color:#374151;font-size:clamp(12px,1.05vw,16px);cursor:pointer}
.dots i.on{background:var(--c);color:#fff}.dots i.seen{background:#c4b5fd;color:#2e1065}
.cover{justify-content:center;align-items:center;text-align:center;gap:2vh}
.cover h2{font-size:clamp(34px,5vw,78px);margin:0;color:var(--c);line-height:1.3}
.cover p{font-size:clamp(20px,2.4vw,36px);margin:0;color:var(--mut)}
.cover .chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.cover .chips span{background:var(--c2);color:var(--c);border-radius:999px;padding:6px 20px;font-size:clamp(16px,1.7vw,26px)}
</style></head><body>
<div id="app">
<header><h1>حل أسئلة مراجعة الفصل الخامس: الصخور والمعادن</h1><span class="pill" id="pg"></span><button id="all">إظهار كل الحلول</button><button id="fs">⛶ ملء الشاشة</button></header>
<main><div class="card" id="card"></div></main>
<footer><button id="pv">→ السابق</button><button class="rv" id="rv">💡 إظهار الحل</button><button id="nx">التالي ←</button><div class="dots" id="dots"></div></footer>
</div>
<script>
var Q15='';
var D=[
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر – معدن</b>',a:'<b>المعدن</b> مادة صلبة غير عضوية توجد في الطبيعة، ذراتها مرتبة بانتظام ولها تركيب كيميائي محدد. <b>الصخر</b> مادة صلبة تتكوّن من معدن واحد أو أكثر.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">بلورة – حجر كريم</b>',a:'<b>البلورة</b> مادة صلبة ذراتها مرتبة بشكل منتظم ومتكرر. <b>الحجر الكريم</b> معدن نادر قابل للقص والصقل يُستخدم في صناعة الحلي.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">انفصام – مكسر</b>',a:'<b>الانفصام</b> تكسّر المعدن إلى قطع ذات سطوح ناعمة منتظمة عاكسة للضوء. <b>المكسر</b> تكسّره إلى قطع ذات سطوح خشنة.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">قساوة – مخدش</b>',a:'<b>القساوة</b> مقاومة المعدن للخدش. <b>المخدش</b> لون مسحوق المعدن الناتج عن حكّه بلوح الخدش.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر – دورة الصخر</b>',a:'<b>الصخر</b> مادة صلبة تتكوّن من معدن أو أكثر. <b>دورة الصخر</b> نموذج يبيّن كيف تتحوّل الصخور من نوع إلى آخر عبر الزمن.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر سطحي – صخر جوفي</b>',a:'<b>السطحي</b> يتكوّن من تبرّد اللابة <b>بسرعة على سطح الأرض</b> فبلوراته صغيرة. <b>الجوفي</b> يتكوّن من تبرّد الصهارة <b>ببطء داخل الأرض</b> فبلوراته كبيرة.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر ناري – صخر متحوّل</b>',a:'<b>الناري</b> يتكوّن من تبرّد الصهارة أو اللابة وتصلّبها. <b>المتحوّل</b> يتكوّن من تغيّر صخور موجودة بفعل الحرارة الشديدة والضغط المرتفع.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر متورّق – صخر غير متورّق</b>',a:'<b>المتورّق</b> تترتب حبيباته المعدنية في طبقات أو أشرطة متوازية. <b>غير المتورّق</b> لا تترتب حبيباته في طبقات، مثل الرخام.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر – خام</b>',a:'<b>الصخر</b> مادة صلبة تتكوّن من معدن أو أكثر. <b>الخام</b> معدن يحوي ما يكفي من مادة مفيدة يمكن استخراجها وبيعها وتحقيق أرباح منها.'},
{s:'استخدام المفردات',q:'وضّح الفرق بين: <b style="color:var(--c)">صخر متحوّل – صخر رسوبي</b>',a:'<b>الرسوبي</b> يتكوّن من تراكم الرسوبيات وتماسكها، أو بالتبخّر، أو من بقايا المخلوقات الحية. <b>المتحوّل</b> يتكوّن من تغيّر صخر موجود بالحرارة والضغط.'},
{s:'تثبيت المفاهيم',q:'تتكوّن الصخور المتحوّلة نتيجة لـ:',o:['ترسب طبقات من الرسوبيات','تصلّب اللابة في ماء البحار','تفتت الصخور على سطح الأرض','الحرارة الشديدة والضغط المرتفع'],k:3,a:'<b>د. الحرارة الشديدة والضغط المرتفع</b>'},
{s:'تثبيت المفاهيم',q:'أيّ العبارات التالية ينطبق على المادة التي تُعدّ معدنًا؟',o:['تكون عضوية','تكون زجاجية','تكون حجرًا كريمًا','توجد في الطبيعة'],k:3,a:'<b>د. توجد في الطبيعة</b>'},
{s:'تثبيت المفاهيم',q:'ما نوع الصخور التي تنتج عن انفجار البراكين؟',o:['فتاتية','عضوية','ورقية','سطحية'],k:3,a:'<b>د. سطحية</b>: صخور نارية تتكوّن من تبرّد اللابة على سطح الأرض.'},
{s:'تثبيت المفاهيم',q:'أيّ العبارات التالية ينطبق على تشكّل الصخور الفتاتية؟',o:['تتكوّن من حبيبات صخور موجودة أصلًا','تتكوّن من اللابة','تتكوّن بوساطة التبخّر','تتكوّن من بقايا النباتات'],k:0,a:'<b>أ. تتكوّن من حبيبات صخور موجودة أصلًا</b>'},
{s:'تثبيت المفاهيم',q:'مِمّ تتكوّن الصخور عادة؟',o:['قطع صغيرة','معادن','وقود أحفوري','تورّق'],k:1,a:'<b>ب. معادن</b>'},
{s:'تثبيت المفاهيم',q:'يمكن تصنيف الصخور الرسوبية إلى:',o:['متورّقة أو غير متورّقة','أحجار كريمة أو خامات','سطحية أو جوفية','فتاتية، أو كيميائية، أو عضوية'],k:3,a:'<b>د. فتاتية، أو كيميائية، أو عضوية</b>'},
{s:'تثبيت المفاهيم',q:'توصف المعادن جميعها بأنها:',o:['مواد غير عضوية صلبة','لها درجة قساوة ٤ أو أكثر','ذات لمعان زجاجي','تخدش قطعة نقدية معدنية'],k:0,a:'<b>أ. مواد غير عضوية صلبة</b>'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">صنّف</b>: هل بلّورة السكر معدن؟ وضّح ذلك.',a:'<b>لا</b>؛ لأن السكر <b>مادة عضوية</b> تُستخرج من النبات (قصب السكر والشمندر)، والمعدن مادة غير عضوية، رغم أن للسكر شكلًا بلوريًا.'},
{s:'التفكير الناقد',q:'ما الأسباب التي تدعونا إلى الاعتقاد أن المعادن في القطب الجنوبي ليست من الخامات؟',a:'لأن استخراجها <b>صعب ومكلف جدًّا</b> بسبب البرد القارس والجليد السميك وبعد المكان، فلا يمكن بيعها بربح؛ والخام يجب أن <b>يحقق ربحًا</b> عند استخراجه.'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">توقّع</b>: هل يمكنك أن تجد عظمة ديناصور في صخر متحوّل؟ وضّح ذلك.',a:'<b>لا يُتوقّع ذلك</b>؛ لأن الحرارة الشديدة والضغط المرتفع اللذين يكوّنان الصخر المتحوّل يغيّران الأحافير أو يدمّرانها. الأحافير توجد عادة في <b>الصخور الرسوبية</b>.'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">فسّر</b> كيف يمكن لمعدن الكوارتز أن يوجد في صخر رسوبي وصخر ناري.',a:'يتبلور الكوارتز من الصهارة فيوجد في <b>الصخور النارية</b> كالجرانيت. وعند تجوية هذه الصخور تنتقل حبيبات الكوارتز وتترسّب ثم تتماسك فتكوّن <b>صخورًا رسوبية</b> مثل الحجر الرملي.'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">صنّف</b>: إذا أعطاك معلمك معدنين شفافين: الكوارتز والكالسيت، فما الفحص السريع الذي تجريه لتعرّف كل منهما؟',a:'<b>اختبار القساوة</b>: الكوارتز (٧) يخدش الزجاج، والكالسيت (٣) لا يخدشه. أو نضع عليهما <b>حمض الهيدروكلوريك المخفّف</b>: الكالسيت يفور، والكوارتز لا يتفاعل.'},
{s:'التفكير الناقد',q:'<b style="color:var(--c)">خريطة المفاهيم</b>: أكمل الخريطة لتبيّن خواص المعادن: المعادن ← تشمل الخواص التي تحددها…',a:'<b>الشكل البلوري</b> · <b>الانفصام والمكسر</b> · <b>اللون</b> · <b>المخدش</b> · <b>اللمعان (البريق)</b> · <b>القساوة</b>'},
{s:'أنشطة تقويم الأداء',q:'<b style="color:var(--c)">اختبار فرضية</b>: لديك صحن زجاجي، ومسمار، وقطعة نقدية نحاسية، ومغناطيس. كيف تستخدمها لمعرفة قساوة معدن الماجنتيت وبعض خصائصه المميزة؟ استعن بمقياس موهس.',a:'نحاول خدش الماجنتيت بـ<b>القطعة النقدية (٣)</b> ثم بـ<b>المسمار (٤٫٥)</b>، ثم نحاول أن نخدش به <b>الصحن الزجاجي (٥٫٥)</b>؛ فنحدد قساوته بين قساوات هذه المواد على مقياس موهس. ونقرّب <b>المغناطيس</b>: ينجذب الماجنتيت إليه، وهي خاصية مميزة له.'},
{s:'أنشطة تقويم الأداء',q:'<b style="color:var(--c)">عمل نموذج</b>: حدّد المواد والعمليات التي تحتاج إليها لعمل نموذج يمثّل دورة الصخر. صف الجوانب التي كان فيها النموذج دقيقًا أو غير دقيق.',a:'إجابة مفتوحة. مثال: <b>أقلام الشمع الملوّنة</b>: نبريها فتاتًا (تجوية وتعرية)، ونضغط الفتات (صخر رسوبي)، ونسخّن الفتات ونضغطه (صخر متحوّل)، ونصهرها ثم نبرّدها (صخر ناري). <b>غير الدقيق</b>: الزمن والحرارة والضغط في الطبيعة أكبر بكثير.'},
{s:'تطبيق الرياضيات',q:'<b style="color:var(--c)">حجم الحبيبات</b>: تحتوي عينة من الحجر الطيني على حبيبات يتراوح حجمها بين ٠٫٠٣١ مم – ٠٫٠٠٨ مم. حوّل هذا الحجم من وحدة المليمتر إلى وحدة الميكرومتر.',a:'١ مم = <b>١٠٠٠ ميكرومتر</b><br>٠٫٠٣١ مم × ١٠٠٠ = <b>٣١ ميكرومترًا</b><br>٠٫٠٠٨ مم × ١٠٠٠ = <b>٨ ميكرومترات</b><br>أي يتراوح حجمها بين <b>٣١ و٨ ميكرومترات</b>.'}
];
var AR='٠١٢٣٤٥٦٧٨٩';function ar(n){return String(n).replace(/\d/g,function(d){return AR[d]})}
var cur=-1,shown={},all=false,seen={};
var card=document.getElementById('card'),rv=document.getElementById('rv'),dots=document.getElementById('dots');
dots.innerHTML=D.map(function(_,i){return '<i data-i="'+i+'">'+ar(i+1)+'</i>'}).join('');
function render(){if(cur<0){card.className='card cover';card.innerHTML='<h2>حل أسئلة مراجعة الفصل الخامس</h2><p>الصخور والمعادن · علوم الصف الأول المتوسط</p><div class="chips"><span>استخدام المفردات ١–١٠</span><span>تثبيت المفاهيم ١١–١٧</span><span>التفكير الناقد ١٨–٢٣</span><span>تقويم الأداء ٢٤–٢٥</span><span>تطبيق الرياضيات ٢٦</span></div><p style="font-size:clamp(16px,1.6vw,24px)">المسافة أو Enter: إظهار الحل · الأسهم: التنقل</p>';rv.style.visibility='hidden';document.getElementById('pg').textContent='الغلاف';mark();return}
  var d=D[cur],sh=all||shown[cur];seen[cur]=1;card.className='card'+(sh?' shown':'');
  var h='<span class="sec">'+d.s+'</span><p class="q"><span class="n">'+ar(cur+1)+'</span>'+d.q+'</p>';
  if(d.img)h+='<div class="fig"><img loading="lazy" decoding="async" src="'+Q15+'" alt="رسم نواتي ذرتي كربون"></div>';
  if(d.o)h+='<div class="ops">'+d.o.map(function(o,i){return '<div class="op'+(i===d.k?' ok':'')+'"><b>'+'أبجد'[i]+'</b><span>'+o+'</span></div>'}).join('')+'</div>';
  h+='<div class="ans">'+d.a+'</div>';card.innerHTML=h;rv.style.visibility='visible';rv.textContent=sh?'🙈 إخفاء الحل':'💡 إظهار الحل';rv.className='rv'+(sh?' hide':'');
  document.getElementById('pg').textContent='السؤال '+ar(cur+1)+' من '+ar(D.length);mark();fit()}
function fit(){var q=card.querySelector('.q');if(!q)return;card.style.fontSize='';var s=1;card.querySelectorAll('.q,.op,.ans').forEach(function(e){e.style.fontSize=''});
  for(var i=0;i<8&&card.scrollHeight>card.clientHeight+2;i++){s*=.92;card.querySelectorAll('.q,.op,.ans').forEach(function(e){e.style.fontSize='';var f=parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(f*s)+'px'})}}
function mark(){dots.querySelectorAll('i').forEach(function(e,i){e.className=i===cur?'on':seen[i]?'seen':''})}
function go(i){cur=Math.max(-1,Math.min(D.length-1,i));render()}
function toggle(){if(cur<0){go(0);return}shown[cur]=!(all||shown[cur]);if(all&&!shown[cur])all=false;render()}
document.getElementById('nx').onclick=function(){go(cur+1)};document.getElementById('pv').onclick=function(){go(cur-1)};rv.onclick=toggle;
dots.onclick=function(e){var i=e.target.dataset.i;if(i!=null)go(+i)};
document.getElementById('all').onclick=function(){all=!all;shown={};this.textContent=all?'إخفاء كل الحلول':'إظهار كل الحلول';render()};
document.getElementById('fs').onclick=function(){var d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||function(){}).call(d.documentElement);else d.exitFullscreen()};
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='PageDown'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowRight'||e.key==='PageUp'){go(cur-1);e.preventDefault()}else if(e.key===' '||e.key==='Enter'){toggle();e.preventDefault()}});
addEventListener('resize',fit);
go(-1);
