/* رحلة إلى عالم الذرات والعناصر — هوية المختبر المستقبلي */
:root{
  --bg0:#050b1f;--bg1:#0a1634;--bg2:#101f47;--panel:rgba(16,31,71,.72);--panel2:rgba(22,42,92,.62);
  --line:rgba(120,190,255,.22);--line2:rgba(120,190,255,.45);
  --cy:#38d6ff;--cy2:#7fe6ff;--vi:#8b6cff;--vi2:#b8a6ff;--au:#f5c451;--au2:#ffe29a;
  --ink:#eaf3ff;--ink2:#a9bddf;--ok:#3ee08f;--no:#ff6b81;
  --p:#ff5d6c;--n:#b9c4d6;--e:#38d6ff;
  --disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02060f;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-family:var(--disp)}
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0b1a3d,#02060f 70%)}
#stage{width:1600px;height:900px;position:relative;overflow:hidden;overflow:clip;transform-origin:center center;flex:0 0 auto;
  background:radial-gradient(1200px 700px at 75% 20%,rgba(139,108,255,.20),transparent 60%),radial-gradient(900px 600px at 10% 90%,rgba(56,214,255,.14),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg0));
  box-shadow:0 0 0 1px rgba(120,190,255,.08),0 40px 120px rgba(0,0,0,.6)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(120,190,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,190,255,.07) 1px,transparent 1px);background-size:40px 40px;
  mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 80%)}
/* الشريط العلوي */
#top{position:absolute;top:0;inset-inline:0;height:70px;display:flex;align-items:center;gap:18px;padding:0 26px;z-index:20;background:linear-gradient(rgba(5,11,31,.9),rgba(5,11,31,0))}
#top .brand{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:700;font-size:20px;white-space:nowrap}
#top .brand i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cy),var(--vi));font-style:normal;font-size:20px;box-shadow:0 0 18px rgba(56,214,255,.5)}
#top .brand small{display:block;font-size:13px;font-weight:500;color:var(--ink2)}
#prog{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
#prog button{flex:1;height:30px;border:0;background:none;padding:0;position:relative;min-width:0}
#prog button::before{content:"";position:absolute;inset:13px 0;border-radius:99px;background:rgba(120,190,255,.18);transition:background .4s}
#prog button.done::before{background:linear-gradient(90deg,var(--cy),var(--vi))}
#prog button.cur::before{background:var(--au);box-shadow:0 0 12px var(--au)}
#prog button span{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#prog button:hover span,#prog button.cur span{opacity:1}
#prog button:not(.cur) span{opacity:0}
#prog button:hover span{opacity:1}
#scorechip{display:flex;gap:6px}
#scorechip b{min-width:52px;text-align:center;border-radius:12px;padding:4px 8px;font-family:var(--disp);font-size:18px;background:rgba(255,255,255,.06);border-bottom:3px solid var(--tc)}
/* الشريط السفلي */
#ctl{position:absolute;bottom:0;inset-inline:0;height:78px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:20;background:linear-gradient(rgba(5,11,31,0),rgba(5,11,31,.92) 45%)}
.cb{height:52px;min-width:52px;padding:0 18px;border-radius:16px;border:1px solid var(--line2);background:rgba(16,31,71,.75);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;backdrop-filter:blur(6px);transition:transform .15s,background .2s}
.cb:active{transform:scale(.96)}
.cb:hover{background:rgba(30,58,130,.85)}
.cb.gold{background:linear-gradient(135deg,var(--au),#e6a52c);color:#1b1300;border-color:transparent;font-weight:700}
.cb.cy{background:linear-gradient(135deg,var(--cy),#1aa6d6);color:#03203a;border-color:transparent;font-weight:700}
.cb[aria-pressed=true]{background:var(--vi);border-color:var(--vi2)}
.cb:disabled{opacity:.35}
.sep{width:1px;height:34px;background:var(--line)}
#timer{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:16px;padding:0 6px 0 14px;height:52px;background:rgba(16,31,71,.75)}
#timer b{font-size:24px;min-width:66px;text-align:center}
#timer.run b{color:var(--au)}
#timer.low b{color:var(--no);animation:blink 1s infinite}
#timer button{height:40px;min-width:40px;border-radius:12px;border:0;background:rgba(255,255,255,.08)}
@keyframes blink{50%{opacity:.4}}
/* الشاشات */
#screens{position:absolute;inset:0}
.scr{position:absolute;inset:70px 0 78px;padding:16px 56px 10px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1);transform:translateX(-60px) scale(.98)}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.scr.out{opacity:0;transform:translateX(60px) scale(.98)}
.scr.full{inset:0;padding:0}
.eyebrow{font-family:var(--disp);font-weight:600;color:var(--cy);font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:3px;border-radius:3px;background:var(--cy);box-shadow:0 0 10px var(--cy)}
h1.t{font-family:var(--disp);font-weight:700;font-size:52px;line-height:1.15;margin:4px 0 6px;background:linear-gradient(90deg,#fff,var(--cy2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1.t.xl{font-size:76px}
.lead{font-size:23px;color:var(--ink2);margin:0 0 12px;line-height:1.6;max-width:1150px}
.row{display:flex;gap:22px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:16px}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:20px 24px;backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.card h3{margin:0 0 8px;font-family:var(--disp);font-size:24px;color:var(--au2)}
.card p{margin:0 0 8px;font-size:20px;line-height:1.7}
.big{font-size:22px;line-height:1.75}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 14px;font-size:15px;font-weight:600;background:rgba(56,214,255,.12);color:var(--cy2);border:1px solid rgba(56,214,255,.3)}
.tag.gold{background:rgba(245,196,81,.12);color:var(--au2);border-color:rgba(245,196,81,.35)}
.tag.vi{background:rgba(139,108,255,.14);color:var(--vi2);border-color:rgba(139,108,255,.4)}
.gl{color:var(--au)}.cyt{color:var(--cy)}.vit{color:var(--vi2)}
.pos{color:var(--p);font-weight:700}.neu{color:var(--n);font-weight:700}.neg{color:var(--e);font-weight:700}
.btn{border:0;border-radius:16px;padding:12px 22px;font-size:19px;font-weight:700;background:linear-gradient(135deg,var(--cy),#1aa6d6);color:#03203a;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(56,214,255,.25)}
.btn.gold{background:linear-gradient(135deg,var(--au),#e6a52c);color:#1b1300;box-shadow:0 8px 20px rgba(245,196,81,.25)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.vi{background:linear-gradient(135deg,var(--vi),#6a4be0);color:#fff}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:99px;padding:8px 16px;font-size:17px;font-weight:600}
.chip[aria-pressed=true]{background:var(--cy);color:#03203a;border-color:var(--cy)}
canvas.sim{display:block;width:100%;border-radius:22px;background:#030a1c;border:1px solid var(--line)}
.three{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#102657,#040b1f)}
.three canvas{display:block;width:100%!important;height:100%!important}
.three .lbls{position:absolute;inset:0;pointer-events:none}
.three .lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(5,11,31,.8);border:1px solid var(--line2);border-radius:10px;padding:3px 10px;font-size:15px;font-weight:600;white-space:nowrap}
.hint{font-size:16px;color:var(--ink2)}
/* الكشف */
.reveal{display:none}
.reveal.shown{display:block;animation:rin .6s}
@keyframes rin{from{opacity:0;transform:translateY(14px)}}
.explain{border-inline-start:5px solid var(--au);background:linear-gradient(90deg,rgba(245,196,81,.12),rgba(245,196,81,.03));border-radius:18px;padding:14px 18px;font-size:20px;line-height:1.75}
.explain b{color:var(--au2)}
/* المقدمة السينمائية */
.cine{position:absolute;inset:0}
.cine canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.cine .cap{position:absolute;inset:auto 0 140px;text-align:center;font-family:var(--disp);font-weight:700;font-size:58px;text-shadow:0 6px 30px rgba(0,0,0,.6);opacity:0;transition:opacity 1.2s,transform 1.2s;transform:translateY(20px)}
.cine .cap.on{opacity:1;transform:none}
.cine .sub{position:absolute;top:110px;inset-inline:0;text-align:center;font-family:var(--disp);font-size:24px;color:var(--cy2);opacity:0;transition:opacity 1s}
.cine .sub.on{opacity:1}
.cine .skip{position:absolute;left:30px;bottom:96px;z-index:3}
.cine .tbar{position:absolute;bottom:84px;inset-inline:220px;height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.cine .tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi))}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(2,6,15,.75))}
/* ماذا ستتعلم / الأهداف */
.wonder{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:18px}
.wq{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px 18px;min-height:330px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;opacity:0;transform:translateY(40px) scale(.95);transition:all .8s cubic-bezier(.2,.9,.2,1.2)}
.wq.in{opacity:1;transform:none}
.wq .ic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(56,214,255,.08));border:1px solid var(--line2)}
.wq .ic svg{width:78px;height:78px}
.wq b{font-family:var(--disp);font-size:24px;line-height:1.45}
.wq .n{font-family:var(--disp);color:var(--au);font-size:18px}
.goals{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:16px;max-width:1250px}
.goal{display:flex;align-items:center;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px 22px;font-size:27px;font-weight:600;opacity:0;transform:translateX(-50px);transition:all .7s cubic-bezier(.2,.9,.2,1)}
.goal.in{opacity:1;transform:none}
.goal .gi{width:64px;height:64px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(56,214,255,.25),rgba(139,108,255,.25));border:1px solid var(--line2)}
.goal .gi svg{width:40px;height:40px}
.goal .gn{font-family:var(--disp);color:var(--au);font-size:22px;min-width:30px}
.goals.six .goal{font-size:23px;padding:11px 20px}
.goals.six .goal .gi{width:52px;height:52px}
/* الأسئلة */
.q{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:18px 22px}
.q .qh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.q .qt{font-family:var(--disp);font-size:26px;font-weight:600;line-height:1.5;margin:4px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;border:1.5px solid var(--line2);background:rgba(255,255,255,.04);border-radius:18px;padding:13px 16px;font-size:21px;font-weight:600;transition:all .2s;min-height:64px}
.opt i{font-style:normal;width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;background:rgba(56,214,255,.15);color:var(--cy2);font-family:var(--disp)}
.opt:hover:not(:disabled){border-color:var(--cy);background:rgba(56,214,255,.08)}
.opt.sel{border-color:var(--au);background:rgba(245,196,81,.12)}
.opt.ok{border-color:var(--ok);background:rgba(62,224,143,.16)}
.opt.ok i{background:var(--ok);color:#022}
.opt.no{border-color:var(--no);background:rgba(255,107,129,.14)}
.opt.no i{background:var(--no);color:#200}
.qf{margin-top:12px;display:none}
.qf.on{display:block;animation:rin .5s}
.fbx{border-radius:18px;padding:12px 16px;font-size:20px;line-height:1.7}
.fbx.ok{background:rgba(62,224,143,.12);border:1px solid rgba(62,224,143,.4)}
.fbx.no{background:rgba(255,107,129,.1);border:1px solid rgba(255,107,129,.4)}
.fbx b{font-family:var(--disp)}
.qa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.award{display:flex;gap:6px;align-items:center;font-size:16px;color:var(--ink2)}
.award button{border:0;border-radius:12px;padding:7px 12px;font-weight:700;background:var(--tc);color:#fff;font-size:15px}
.award button.given{outline:3px solid #fff;opacity:.6}
.lvl{font-family:var(--disp);font-size:14px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.08)}
.lvl.l1{color:var(--ok)}.lvl.l2{color:var(--au)}.lvl.l3{color:var(--no)}
/* سحب وإفلات */
.dd{display:flex;flex-direction:column;gap:14px}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:10px;border-radius:20px;border:1.5px dashed var(--line2)}
.tok{touch-action:none;user-select:none;-webkit-user-select:none;border-radius:16px;padding:10px 16px;font-size:19px;font-weight:600;background:linear-gradient(135deg,rgba(56,214,255,.22),rgba(139,108,255,.22));border:1px solid var(--line2);cursor:grab;display:inline-flex;align-items:center;gap:8px}
.tok img{width:46px;height:46px;object-fit:cover;border-radius:10px}
.tok.drag{position:fixed;z-index:999;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.5);transform:scale(1.06)}
.tok.ok{background:rgba(62,224,143,.22);border-color:var(--ok)}
.tok.no{background:rgba(255,107,129,.2);border-color:var(--no)}
.tok.ghost{opacity:.25}
.bins{display:grid;gap:14px}
.bin{border-radius:22px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);padding:10px 12px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.bin h4{margin:0;font-family:var(--disp);font-size:21px;color:var(--au2);display:flex;justify-content:space-between}
.bin .slot{display:flex;flex-wrap:wrap;gap:8px;flex:1;align-content:flex-start}
.bin.over{border-color:var(--au);background:rgba(245,196,81,.08)}
/* ترتيب */
.ord{display:flex;gap:12px;flex-wrap:wrap}
.ord .tok{flex-direction:column;min-width:150px;justify-content:center;text-align:center}
.ord .slotn{font-family:var(--disp);color:var(--au)}
/* جداول */
table.tb{border-collapse:separate;border-spacing:0;width:100%;font-size:20px;overflow:hidden;border-radius:18px;border:1px solid var(--line2)}
table.tb th{background:rgba(56,214,255,.14);font-family:var(--disp);padding:10px;font-weight:600}
table.tb td{padding:8px 10px;border-top:1px solid var(--line);text-align:center}
table.tb input,table.tb select{width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--line2);border-radius:12px;color:var(--ink);font:inherit;font-size:19px;padding:7px 8px;text-align:center}
table.tb .ok{border-color:var(--ok)!important;background:rgba(62,224,143,.14)!important}
table.tb .no{border-color:var(--no)!important;background:rgba(255,107,129,.12)!important}
select option{background:#0a1634;color:#fff}
input.ans{background:rgba(255,255,255,.06);border:1.5px solid var(--line2);border-radius:12px;color:var(--ink);font:inherit;font-size:22px;padding:8px 10px;text-align:center;width:120px}
/* القائمة ولوحة المعلم */
#drawer{position:absolute;top:0;bottom:0;right:0;width:520px;z-index:60;background:rgba(6,13,34,.97);border-inline-start:1px solid var(--line2);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
#drawer.on{transform:none}
#drawer header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
#drawer header b{flex:1;font-family:var(--disp);font-size:24px}
#drawer .body{flex:1;overflow:auto;padding:14px 18px}
#drawer h4{margin:16px 0 8px;font-family:var(--disp);color:var(--cy);font-size:18px}
.stlist{display:grid;gap:6px}
.stlist button{display:flex;align-items:center;gap:10px;text-align:start;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:9px 12px;font-size:17px}
.stlist button.cur{border-color:var(--au);background:rgba(245,196,81,.12)}
.stlist button i{font-style:normal;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:rgba(56,214,255,.14);flex:0 0 auto}
.stlist button.done i{background:var(--ok);color:#022}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tedit{display:flex;align-items:center;gap:6px;border-radius:14px;padding:6px 8px;background:rgba(255,255,255,.04);border-inline-start:5px solid var(--tc)}
.tedit input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;font-weight:600}
.tedit b{font-family:var(--disp);font-size:20px;min-width:40px;text-align:center}
