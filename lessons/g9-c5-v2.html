  C('<ol style="font-size:18px"><li>نستقبل الأشعة الناتجة عن تحلل الكربون-١٤ بنسب معروفة من الكائنات الحية.</li><li>عندما تموت الكائنات الحية تقل الأشعة التي نستقبلها بمقدار النصف بعد ٥٧٣٠ عامًا من موتها، وتستمر عملية النقصان إلى النصف كل ٥٧٣٠ عامًا.</li><li>من خلال مقارنة كمية الإشعاع الناتج قبل موت الكائن الحي مع كمية الإشعاع بعد موته يمكن معرفة العصر الذي كان يعيش فيه.</li></ol>','r')+'</div><div class="col"><div class="cd dark" style="font-size:19px">🔎 <b>مهمة المحقق:</b> لكل أحفورة نسبة الكربون-١٤ المتبقية فيها. احسبوا عمرها!</div><div data-f class="col"></div>'+C('<h3>🌿 الربط مع علم البيئة: تحوّل الطاقة</h3><p style="font-size:17.5px">تقوم مفاعلات الطاقة النووية بتحويل الطاقة النووية إلى طاقة كهربائية وطاقة حرارية من نظير اليورانيوم-٢٣٥ المشع. ابحث عن كيفية تخلص المفاعلات من الطاقة الحرارية، واستنتج الاحتياطات اللازم اتخاذها للحيلولة دون تلوث المياه في المنطقة.</p>','r')+'</div></div>';
  [['🦴 عظمة حيوان','٥٠٪',1],['🌳 قطعة خشب','٢٥٪',2],['🐚 صدفة','١٢٫٥٪',3]].forEach(function(x,i){OX.mcq($('[data-f]',b),{q:x[0]+': تبقّى فيها '+x[1]+' من الكربون-١٤. كم عمرها تقريبًا؟',o:['٥٧٣٠ سنة','١١٤٦٠ سنة','١٧١٩٠ سنة'],a:x[2]-1,ex:'كل فترة عمر نصف = ٥٧٣٠ سنة؛ عدد الفترات = '+n(x[2])+'.'},'l12-fos'+i)})}},

 build:function(b){b.innerHTML='<div class="row"><div class="col" style="flex:1.1">'+C('<p>درسنا في الصف الأول المتوسط الجدول الدوري، وعرفنا أن هناك مجموعة من العناصر <b>المصنّعة</b>، وهي عناصر لا توجد في الطبيعة، ولكن يتم تصنيعها في المختبرات من عناصر أخرى. وقد تمكّن العلماء حديثًا من تصنيع بعض العناصر الجديدة.</p>','r')+C('<div class="def"><b>مسرّع الجسيمات:</b> مسرّع ضخم للجسيمات يعمل على تسريع الجسيمات حتى تتحرك بسرعة كبيرة جدًّا وبشكل كافٍ لحدوث التحول الذري.</div>','r')+'<div class="cd qa r"><p class="q" style="margin:0">ما سبب تسمية العناصر المصنّعة بهذا الاسم؟</p><div class="ans">لأنها نتجت من صُنع الإنسان. مثال: عنصر <b>أينشتاينيوم</b> ينتج بقذف البلوتونيوم بالنيوترونات، وقد سُمّي على اسم ألبرت أينشتاين.</div></div></div><div class="col"><div data-o></div><div class="cd r" style="display:flex;gap:10px;justify-content:center;font-size:30px">'+[[237,93,'Np'],[244,94,'Pu'],[243,95,'Am'],[251,98,'Cf']].map(function(x){return '<span style="background:#efe9ff;border-radius:12px;padding:4px 10px">'+sym(x[0],x[1],x[2],'#3a2b8f')+'</span>'}).join('')+'</div></div></div>';
  OX.order($('[data-o]',b),['عنصر طبيعي','يوضع في مسرّع الجسيمات','يُقذف العنصر بجسيمات (مثل ألفا أو بيتا) بواسطة مسرّع الجسيمات','تتحد الجسيمات مع نواة العنصر لينتج عنصر جديد'],{q:'🌀 ملخّص الفكرة: رتّبوا خطوات تصنيع عنصر جديد:'},'l12-syn')}},

 build:function(b){b.innerHTML='<div class="g2">'+C('<h3>🏥 استعمالات طبية</h3><p style="font-size:18px"><b>العناصر المتتبّعة</b> تُستخدم لتتبع وتشخيص بعض الأمراض، مثل: تشخيص أمراض الغدة الدرقية، وتشخيص مشاكل الهضم والدورة الدموية، والكشف عن الكسور والتمزقات. ويُستعمل <b>اليود-١٣١</b> لتشخيص المشاكل المتعلقة بالغدة الدرقية.</p><div class="qa" style="background:#fff3c4;border-radius:12px;padding:6px 12px"><b>فسّر:</b> للنظائر المستخدمة في الاستعمالات الطبية عمر نصف قصير؟<div class="ans">حتى تكون آمنة، ولا تتعرض المخلوقات الحية للإشعاعات لوقت طويل.</div></div>','r')+
  C('<h3>🌱 استعمالات بيئية</h3><p style="font-size:18px">النباتات تمتص العناصر اللازمة لنموها، ومنها <b>الفوسفور</b>؛ فيُستخدم الفوسفور-٣٢ المشع لتتبع مدى استفادة النباتات من الأسمدة. وتُستخدم العناصر المشعة في إنتاج المبيدات الحشرية لتتبع أثر هذه المبيدات على البيئة.</p><div class="qa" style="background:#eafbf1;border-radius:12px;padding:6px 12px"><b>من خلال قراءتك:</b> اشرح كيف يمكن الاستفادة من العناصر المشعة في متابعة نمو النباتات؟<div class="ans">يُضاف الفوسفور المشع إلى السماد، فيمتصه النبات، ويُتتبّع الإشعاع لمعرفة مسار الفوسفور في الجذور والأجزاء التي يحتاجه فيها النبات للنمو والتكاثر.</div></div>','r')+'</div>'+
  C('<h3>🦋 الربط مع علم الأحياء: انقسام الخلايا في الأورام</h3><p style="font-size:18px">عندما تُصاب الخلايا بالسرطان فإنها تبدأ في الانقسام بسرعة مسببة ورمًا. وعندما يوجّه الإشعاع مباشرة إلى الورم يعمل على إبطاء انقسام الخلايا أو إيقافه، مبتعدًا عن الخلايا السليمة المحيطة. (ابحث بشكل مفصل عن العلاج بالإشعاع، واكتب ملخصًا لبحثك في دفتر العلوم.)</p>','r')+'<div data-s class="r"></div>';
  OX.sort($('[data-s]',b),{bins:['استعمالات طبية','استعمالات بيئية','الطاقة والسلامة والصناعة'],items:[['اليود-١٣١ وتشخيص الغدة الدرقية',0],['الكشف عن الكسور والتمزقات',0],['علاج الأورام بالإشعاع',0],['تتبع الفوسفور في النبات',1],['تتبع أثر المبيدات الحشرية',1],['اليورانيوم-٢٣٥ في المفاعلات',2],['الأميريسيوم-٢٤١ في كاشف الدخان',2],['فحص أنابيب النفط بالإشعاع',2]],ex:'العناصر المشعة مفيدة في مجالات كثيرة.'},'l12-uses')}},

{id:'sum',name:'الخلاصة',short:'الخلاصة',ic:'📌',eb:'الخلاصة',title:'الخلاصة',pg:167,strat:['cmap','tl'],
 build:function(b){b.innerHTML='<div class="g2">'+C('<h3>العدد الذري</h3><ul><li>العدد الذري هو عدد البروتونات في نواة الذرة.</li><li>العدد الكتلي هو مجموع أعداد البروتونات والنيوترونات في نواة الذرة.</li><li>نظائر العنصر الواحد تختلف في عدد النيوترونات.</li></ul>','r')+C('<h3>النشاط الإشعاعي</h3><ul style="font-size:19px"><li>التحلّل الإشعاعي هو تحرير للجسيمات النووية والطاقة.</li><li>التحوّل تغيّر عنصر إلى عنصر آخر خلال عملية التحلّل الإشعاعي، ومن طرائق التحوّل انطلاق جسيمات ألفا وطاقة من النواة، وكذلك انطلاق جسيمات بيتا من النواة.</li><li>فترة عمر النصف لنظير مشع هي الزمن اللازم لتحوّل نصف كمية العنصر المشع إلى عنصر آخر.</li></ul>','r')+'</div><div class="g3 r">'+[['تحلل ألفا','−٢ بروتون، −٢ نيوترون','#ff5a5f'],['تحلل بيتا','+١ بروتون، −١ نيوترون، −١ إلكترون','#3d8bff'],['تحلل جاما','−١ فوتون (لا يتغير العنصر)','#ffb000']].map(function(x){return '<div class="cd" style="border-top:8px solid '+x[2]+';text-align:center"><b style="font:800 24px var(--disp)">'+x[0]+'</b><p style="margin:4px 0 0;font-size:18px;direction:rtl">'+x[1]+'</p></div>'}).join('')+'</div>'}},

{id:'hw',name:'الواجب: اختبر نفسك',short:'الواجب',ic:'📝',eb:'الواجب · اختبر نفسك (التسليم يوم الخميس)',title:'اختبر نفسك',pg:167,strat:['tps','sticks'],
 build:function(b){var g=h('<div class="g2"></div>');b.appendChild(g);[['١. عرّف','ما المقصود بالنظائر؟ وكيف يمكن حساب عدد النيوترونات في نظير العنصر؟','النظائر: ذرات العنصر الواحد التي لها نفس عدد البروتونات وتختلف في عدد النيوترونات. عدد النيوترونات = العدد الكتلي − العدد الذري (n = A − Z).'],['٢. قارن','بين نوعين من التحلل الإشعاعي.','تحلل ألفا: ينطلق جسيم ألفا (بروتونان ونيوترونان)، فيقل العدد الذري ٢ والعدد الكتلي ٤. تحلل بيتا: ينطلق إلكترون من النواة (نيوترون يتحول إلى بروتون)، فيزداد العدد الذري ١ ولا يتغير العدد الكتلي.'],['٣. استنتج','هل جميع العناصر لها عمر نصف؟ ولماذا؟','لا؛ عمر النصف للنظائر المشعة غير المستقرة فقط التي تتحلل إشعاعيًّا، أما النظائر المستقرة فلا تتحلل.'],['٤. وضّح','ما أهمية النظائر المشعة في الكشف عن المشكلات الصحية؟','تُستخدم عناصر متتبّعة (مثل اليود-١٣١) لتشخيص أمراض الغدة الدرقية، ومشاكل الهضم والدورة الدموية، والكشف عن الكسور والتمزقات؛ ولها عمر نصف قصير حتى تكون آمنة.'],['٥. التفكير الناقد','افترض أن لديك عينتين من نظير مشع، كتلة الأولى ٢٥ جم وكتلة الثانية ٥٠ جم. فهل تفقد العينتان خلال الساعة الأولى عددًا متساويًا من الجسيمات؟ وضّح ذلك.','لا؛ العينة الثانية (٥٠ جم) تفقد ضعف عدد الجسيمات تقريبًا لأنها تحتوي على ضعف عدد الأنوية، مع أن عمر النصف لهما واحد (كل منهما تفقد نصف كميتها في الزمن نفسه).']].forEach(function(x){OX.open(g,{no:x[0],q:x[1],a:'<b>إجابة مقترحة:</b> '+x[2]})})}},
