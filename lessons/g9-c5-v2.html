:root{--bg:#070b1f;--bg2:#0d1433;--card:#fffdf7;--ink:#14213d;--ink2:#4a5675;--line:#e3e6ef;--gold:#ffc83d;--pink:#ff4f8b;--cyan:#3fd4ff;--lime:#7ee36b;--violet:#8b6cff;--red:#ff5a5f;--blue:#3d8bff;--green:#1fbf75;--yellow:#ffc21a;--disp:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic',Tahoma,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);color:#fff}
button{font-family:inherit;cursor:pointer}
#fit{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 70% 10%,#1b2a6b 0,#0a0f2c 45%,#050818 100%)}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;direction:rtl}
#stars{position:absolute;inset:0;pointer-events:none;opacity:.55}
/* الشريط العلوي */
.top{position:absolute;top:0;left:0;right:0;height:78px;display:flex;align-items:center;gap:16px;padding:0 26px;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand .lg{width:52px;height:52px}.brand b{font:700 24px var(--disp);display:block;line-height:1.1}.brand small{font-size:15px;color:#a9b6e6}
.teams{display:flex;gap:8px;margin-inline-start:auto}
.tm{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:2px solid var(--tc);border-radius:16px;padding:4px 6px 4px 12px;min-width:150px}
.tm i{width:30px;height:30px;border-radius:50%;background:var(--tc);display:grid;place-items:center;font-style:normal;font-weight:800;color:#0b1030;font-size:15px}
.tm span{font-size:15px;color:#dfe6ff;flex:1}.tm b{font:800 24px var(--disp);color:#fff;min-width:38px;text-align:center}
.tm button{border:0;background:var(--tc);color:#0b1030;border-radius:10px;width:30px;height:30px;font-weight:900;font-size:18px}
.tm.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.12)}}
/* مسار المحطات */
.path{position:absolute;top:80px;left:26px;right:26px;height:40px;display:flex;align-items:center;gap:6px;z-index:15;overflow-x:auto;scrollbar-width:none}
.path::-webkit-scrollbar{display:none}
.pd{flex:0 0 auto;height:30px;min-width:30px;border-radius:999px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#b8c3ef;font-size:13px;font-weight:700;padding:0 10px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pd.on{background:var(--gold);color:#1a1300;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,61,.25)}
.pd.done{border-color:var(--lime);color:#d8ffd0}.pd.done::before{content:'✓';color:var(--lime)}
.pd.x{border-style:dashed}
/* منطقة المحطة */
#view{position:absolute;top:128px;left:26px;right:26px;bottom:86px;z-index:10}
.st{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;animation:stIn .5s both}
@keyframes stIn{from{opacity:0;transform:translateY(18px) scale(.985)}}
.sh{display:flex;align-items:flex-end;gap:16px}
.sh .eb{font:700 16px var(--disp);color:var(--gold);letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh h1{margin:2px 0 0;font:800 38px/1.2 var(--disp);color:#fff}
.sh .pg{margin-inline-start:auto;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 14px;font-size:15px;color:#dfe6ff;white-space:nowrap}
.bd{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;padding:4px 2px 6px;scrollbar-width:thin}
.row{display:flex;gap:14px;align-items:stretch}.row>*{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cd{background:var(--card);color:var(--ink);border-radius:22px;padding:16px 22px;box-shadow:0 14px 34px rgba(0,0,0,.35);position:relative;font-size:21px;line-height:1.7}

.tag{display:inline-block;border-radius:999px;padding:2px 12px;font:700 15px var(--disp);color:#fff;background:var(--violet)}

.hl{background:linear-gradient(transparent 55%,#ffe27a 55%);font-weight:700}
.num{font:800 1.05em var(--disp);color:#c2185b}

.r{transition:opacity .35s,transform .35s}.r.hid{opacity:0;transform:translateY(10px);pointer-events:none}
.r.hid.ph{opacity:.12;pointer-events:auto;cursor:pointer;filter:blur(3px)}
.ans{display:none}.open>.ans,.ans.on{display:block;animation:stIn .4s both}
.qa{cursor:pointer}.qa .ans{margin-top:6px;background:#e8fbef;border-inline-start:6px solid var(--green);border-radius:12px;padding:6px 12px;color:#0f5132}

/* الشريط السفلي */
.bot{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;align-items:center;gap:10px;padding:0 26px;z-index:20}
.nb{border:0;border-radius:16px;padding:12px 22px;font:800 20px var(--disp);background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2)}
.nb.go{background:var(--gold);color:#1a1300;border:0;box-shadow:0 5px 0 #b98a0f;padding:12px 30px}

.sbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-inline-start:auto;margin-inline-end:auto}

.stgs{display:inline-flex;gap:6px;flex-wrap:wrap}

.bt{border:0;border-radius:14px;padding:9px 20px;font:700 19px var(--disp);background:var(--violet);color:#fff;box-shadow:0 4px 0 #4c35b0}
.bt.y{background:var(--gold);color:#1a1300;box-shadow:0 4px 0 #b98a0f}.bt.g{background:var(--green);box-shadow:0 4px 0 #0f7a48}.bt.w{background:#fff;color:var(--ink);box-shadow:0 4px 0 #c9cfe0}.bt.r{background:var(--red);box-shadow:0 4px 0 #a8262b}
.bt.sm{padding:5px 14px;font-size:16px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.q{font:700 23px/1.55 var(--disp);color:var(--ink);margin:0 0 10px}
.qno{display:inline-flex;align-items:center;gap:6px;background:#14213d;color:#fff;border-radius:999px;padding:2px 14px;font-size:15px;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{display:flex;align-items:center;gap:12px;border:3px solid var(--oc);background:#fff;border-radius:16px;padding:9px 14px;font:600 20px var(--body);color:var(--ink);text-align:right;transition:transform .15s}
.op:hover{transform:translateY(-2px)}
.op .k{flex:0 0 40px;height:40px;border-radius:12px;background:var(--oc);color:#fff;display:grid;place-items:center;font:800 20px var(--disp)}
.op.ok{background:#dcfbe8;border-color:var(--green)}.op.ok .k{background:var(--green)}.op.no{background:#ffe3e3;opacity:.85}.op.dim{opacity:.4}
.fb{margin-top:10px;border-radius:14px;padding:8px 14px;font-size:19px;font-weight:600}.fb.ok{background:#dcfbe8;color:#0f5132}.fb.no{background:#ffe3e3;color:#7a1d1d}
.awd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:16px;color:var(--ink2)}
.awd button{border:2px solid var(--tc);background:#fff;color:#14213d;border-radius:999px;padding:2px 12px;font:700 15px var(--disp)}.awd button.given{background:var(--tc);color:#0b1030}

.spot{display:flex;flex-wrap:wrap;gap:6px;font:600 23px/1.6 var(--disp);color:var(--ink)}

.spot span:hover{background:#fff2b8;border-color:#e0b100}.spot span.bad{background:#ffd5d5;border-color:var(--red);text-decoration:line-through}.spot span.fix{background:#d4f7e2;border-color:var(--green)}.spot span.miss{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* الصندوق الغامض */
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mbox{position:relative;height:150px;border:0;background:none;perspective:600px}
.mbox .bx{position:absolute;inset:0;border-radius:20px;background:linear-gradient(145deg,#8b6cff,#4f2fc9);box-shadow:0 10px 0 #2e1a85,0 18px 30px rgba(0,0,0,.4);display:grid;place-items:center;font:900 64px var(--disp);color:#ffe27a;transition:transform .4s}
.mbox .bx::before{content:'';position:absolute;left:0;right:0;top:46%;height:16px;background:#ffc83d}
.mbox .bx::after{content:'';position:absolute;top:0;bottom:0;left:46%;width:16px;background:#ffc83d}
.mbox span{position:relative;z-index:2;width:84px;height:84px;border-radius:50%;background:#2e1a85;display:grid;place-items:center;box-shadow:0 0 0 5px #ffc83d}
.mbox.shake .bx{animation:boxShake .7s}@keyframes boxShake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.mbox.used .bx{background:linear-gradient(145deg,#2a3358,#1a2142);box-shadow:0 6px 0 #0e1330;color:#7381b6}.mbox.used .bx::before,.mbox.used .bx::after{background:#3c4675}

.champ{border-radius:22px;padding:14px;text-align:center;border:3px solid var(--tc);background:rgba(255,255,255,.06)}

.timer{font:900 42px var(--disp);color:var(--gold);text-align:center}
.timer.low{color:var(--red);animation:bump .5s infinite}
/* بطاقات ملوّنة قلابة */
.flips{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fl{height:150px;perspective:900px;border:0;background:none;padding:0}

.fl .fb2{background:#fff;color:var(--ink);transform:rotateY(180deg);font-size:17px;line-height:1.5;border:4px solid var(--fc)}
/* المطابقة والترتيب والتصنيف */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px}
.mi{border:2.5px solid #d5dbec;background:#fff;color:var(--ink);border-radius:14px;padding:9px 14px;font:600 19px var(--body);text-align:right}
.mi.sel{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,108,255,.25)}.mi.ok{background:#dcfbe8;border-color:var(--green);pointer-events:none}.mi.no{animation:shake .4s;border-color:var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px}
.chip{background:#fff;color:var(--ink);border:0;border-radius:14px;padding:9px 16px;font:700 19px var(--disp);box-shadow:0 5px 0 #b9c1dc}
.chip.sel{outline:4px solid var(--gold)}.chip.ok{background:#dcfbe8;box-shadow:0 5px 0 #8bd3a8;pointer-events:none}
.bins{display:grid;gap:14px}.bin{border:3px dashed rgba(255,255,255,.35);border-radius:20px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.bin h4{margin:0;text-align:center;font:800 22px var(--disp);color:var(--bc,#fff)}.bin .chip{box-shadow:none}
.bin.hot{background:rgba(255,255,255,.08)}
.slots{display:flex;flex-direction:column;gap:8px}.slot{display:flex;align-items:center;gap:10px;border:2.5px dashed rgba(255,255,255,.35);border-radius:14px;padding:6px 10px;min-height:52px}.slot i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1300;display:grid;place-items:center;font-weight:800}.slot .chip{box-shadow:none}
/* أكمل الفراغ */
.blank{display:inline-block;min-width:150px;border-bottom:3px dashed #8b95b8;text-align:center;color:#8b95b8;cursor:pointer;padding:0 8px;font-weight:700}.blank.f{color:var(--ink);border-bottom-style:solid}.blank.ok{color:#0f7a48;border-color:var(--green)}.blank.no{color:#b4231f;border-color:var(--red)}
.inp{width:110px;font:800 24px var(--disp);text-align:center;border:3px solid #d5dbec;border-radius:12px;padding:4px;color:var(--ink);background:#fff}.inp.ok{border-color:var(--green);background:#dcfbe8}.inp.no{border-color:var(--red);background:#ffe3e3}
/* المحاكيات */
.sim{background:#050a1f;border:2px solid rgba(255,255,255,.15);border-radius:22px;position:relative;overflow:hidden}
.sim canvas,.sim svg{display:block;width:100%;height:100%}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:14px;padding:4px;gap:4px}.seg button{border:0;background:none;color:#cbd5ff;border-radius:10px;padding:7px 14px;font:700 17px var(--disp)}.seg button.on{background:var(--gold);color:#1a1300}
.meter{display:flex;gap:10px}.meter div{flex:1;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 10px;text-align:center}.meter small{display:block;color:#a9b6e6;font-size:14px}.meter b{font:800 26px var(--disp)}
/* الطبقات العائمة */
.ov{position:absolute;inset:0;z-index:60;background:rgba(3,6,20,.78);display:grid;place-items:center;animation:stIn .3s both}
.ovb{width:1180px;max-height:800px;overflow:auto;background:var(--card);color:var(--ink);border-radius:28px;padding:22px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}

#fx{position:absolute;inset:0;pointer-events:none;z-index:80}

.hub{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:30}
.hub h1{margin:0;font:900 76px var(--disp);background:linear-gradient(90deg,#ffe27a,#ff8fc0,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hub p{margin:0;font-size:24px;color:#c9d3ff}
.lcards{display:flex;gap:28px}
.lc{width:520px;border:0;border-radius:30px;padding:24px 28px;text-align:right;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .25s}

.lc small{font:700 17px var(--disp);opacity:.85}.lc b{display:block;font:900 44px var(--disp);margin:4px 0}.lc span{font-size:18px;line-height:1.6;opacity:.95}
.lc .prog{margin-top:12px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}.lc .prog i{display:block;height:100%;background:#fff}
