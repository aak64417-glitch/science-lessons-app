/* التخطيط: مكتب محقق بلون الحبر الليلي، وعليه أوراق الملف بشريط لاصق؛ مسرح ثابت 1280×720 يتكبّر ليملأ الشاشة */
:root{
  --desk:#14223C; --desk2:#1C2F52; --line:rgba(255,255,255,.06);
  --paper:#FFFFFF; --paper2:#F3F6FB; --ink:#14213D; --ink2:#55627A; --rule:#DCE3EE;
  --tape:#FFC53D; --coral:#F2545B; --aqua:#16B5A6; --violet:#7B6CF6; --sky:#3D8BFD; --lime:#7BC74D;
  --good:#18A058; --bad:#E5484D;
  --f-disp:"Lalezar","Readex Pro",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);overflow:hidden;direction:rtl}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:3px}
#fit{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,var(--desk2),var(--desk) 70%)}
#stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;font-size:22px;line-height:1.6;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:0}

/* شريط المهام */
.hud{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:center;gap:14px;padding:0 26px;z-index:40}
.hud .ttl{font-family:var(--f-disp);color:#fff;font-size:24px;white-space:nowrap}
.hud .ttl small{font-family:var(--f-body);font-size:13px;color:#9FB0CC;display:block;line-height:1.1;margin-top:-4px}
.stamps{display:flex;gap:6px;margin-inline-start:auto;direction:rtl}
.stamp{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(255,255,255,.28);display:grid;place-items:center;color:#9FB0CC;font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;background:none;padding:0}
.stamp.done{border-style:solid;border-color:var(--tape);background:var(--tape);color:var(--desk)}
.stamp.cur{border-style:solid;border-color:#fff;color:#fff;transform:scale(1.15)}
.ctl{position:absolute;bottom:14px;left:20px;display:flex;gap:8px;z-index:40}
.ctl button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;transition:background .2s}
.ctl button:hover{background:rgba(255,255,255,.2)}
.ctl button.on{background:var(--tape);color:var(--desk)}
.ctl svg{width:22px;height:22px}
.nextbig{position:absolute;bottom:14px;right:24px;z-index:40;border:0;border-radius:14px;padding:10px 22px 10px 18px;background:var(--tape);color:var(--desk);font-family:var(--f-disp);font-size:22px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 0 #C8901A;transition:transform .15s}
.nextbig:active{transform:translateY(3px);box-shadow:0 3px 0 #C8901A}
.nextbig svg{width:22px;height:22px}

/* المشاهد */
.scr{position:absolute;inset:62px 26px 72px;display:flex;flex-direction:column;gap:16px}
.scr.enter{animation:enter .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(-60px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative;padding:22px 28px}
.tape{position:absolute;top:-14px;width:120px;height:28px;background:rgba(255,197,61,.85);transform:rotate(-3deg);right:40px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tape.l{right:auto;left:50px;transform:rotate(4deg)}
.kicker{display:inline-flex;gap:8px;align-items:center;font-size:15px;font-weight:600;color:var(--tape);letter-spacing:.02em}
.kicker b{background:var(--tape);color:var(--desk);border-radius:6px;padding:0 8px}
.h1{font-family:var(--f-disp);color:#fff;font-size:46px;line-height:1.2;margin:0}
.h2{font-family:var(--f-disp);font-size:34px;line-height:1.25;margin:0;color:var(--ink)}
.lead{color:#C9D4E6;font-size:22px;max-width:46ch}
.btn{border:0;border-radius:14px;padding:10px 24px;font-family:var(--f-disp);font-size:24px;background:var(--tape);color:var(--desk);box-shadow:0 5px 0 #C8901A;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C8901A}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #B9C4D6}
.btn.aqua{background:var(--aqua);color:#fff;box-shadow:0 5px 0 #0E8277}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 #B93940}
.btn.sm{font-size:18px;padding:6px 16px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-height:0}
.muted{color:var(--ink2)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fb{border-radius:12px;padding:8px 16px;font-size:19px;font-weight:600}
.fb.ok{background:#E3F6EB;color:#0E7A40}.fb.no{background:#FDE7E8;color:#B4282E}

/* المقدمة */
.intro{display:grid;grid-template-columns:1fr 520px;gap:30px;align-items:center;height:100%}
.case{font-family:var(--f-disp);font-size:20px;color:var(--coral);border:3px solid var(--coral);display:inline-block;padding:0 14px;border-radius:8px;transform:rotate(-4deg);margin-bottom:10px}
.intro .h1{font-size:64px}
.type{color:#E6EDF8;font-size:25px;min-height:5.2em;max-width:30ch}
.type .cur{display:inline-block;width:3px;height:1em;background:var(--tape);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tank{position:relative;width:520px;height:440px}
.tank svg{width:100%;height:100%;overflow:visible}

/* بطاقات الظواهر */
.phen{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
.ph{border:0;padding:0;border-radius:16px;overflow:hidden;background:#fff;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.3);transition:transform .25s}
.ph:hover{transform:translateY(-4px) rotate(-.6deg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;bottom:10px;right:10px;background:rgba(20,34,60,.85);color:#fff;border-radius:10px;padding:2px 12px;font-family:var(--f-disp);font-size:22px}
.zoom{position:absolute;inset:0;z-index:50;background:rgba(10,18,34,.82);display:grid;place-items:center}
.zoom .card{width:860px;display:grid;grid-template-columns:380px 1fr;gap:26px;align-items:center}
.zoom img{width:100%;border-radius:12px}
.qwords{display:flex;gap:12px}
.qwords button{border:0;border-radius:16px;padding:8px 22px;font-family:var(--f-disp);font-size:34px;color:#fff;transition:transform .2s}
.qwords button:nth-child(1){background:var(--coral)}.qwords button:nth-child(2){background:var(--sky)}.qwords button:nth-child(3){background:var(--violet)}
.qwords button.on{transform:scale(1.12) rotate(-3deg)}

/* المهام */
.missions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mi{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:14px;padding:12px 18px;font-size:22px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.mi .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-size:24px;background:var(--paper2);flex:none}
.mi.done .n{background:var(--good);color:#fff}

/* بطاقات المفاهيم */
.def{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.def .card{padding:20px 22px}
.def .card b.t{font-family:var(--f-disp);font-size:30px;display:block;margin-bottom:4px}
.def .card:nth-child(1) b.t{color:var(--sky)}.def .card:nth-child(2) b.t{color:var(--coral)}.def .card:nth-child(3) b.t{color:var(--violet)}
.reveal{cursor:pointer}
.reveal .ans{display:none}
.reveal.open .ans{display:block;animation:pop .4s both}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:right;border:2.5px solid var(--rule);background:#fff;border-radius:14px;padding:10px 16px;font-size:21px;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--sky)}
.opt .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.opt.ok{border-color:var(--good);background:#E3F6EB}.opt.no{border-color:var(--bad);background:#FDE7E8}.opt.dim{opacity:.45}
.opt.sel{border-color:var(--sky);background:#E8F1FF}

/* النظرية والقانون */
.vs{display:grid;grid-template-columns:1fr 150px 1fr;gap:0;align-items:stretch;flex:1;min-height:0}
.vs .card{display:flex;flex-direction:column;gap:10px}
.vs .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;font-size:18px}
.vs .mid .ring{width:120px;height:120px;border-radius:50%;border:3px dashed var(--tape);display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;line-height:1.2;color:var(--tape);padding:10px}
.badge{display:inline-block;font-family:var(--f-disp);font-size:24px;color:#fff;border-radius:10px;padding:0 14px}
.ex{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.ex div{background:var(--paper2);border-radius:10px;padding:6px 14px;font-size:20px}

/* السحب والإفلات */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;min-height:120px}
.chip{background:#fff;border-radius:14px;padding:10px 18px;font-size:20px;font-weight:600;box-shadow:0 6px 0 #B9C4D6;cursor:grab;user-select:none;touch-action:none;border:2px solid transparent;transition:transform .15s,box-shadow .15s}
.chip.sel{border-color:var(--tape);transform:translateY(-4px)}
.chip.drag{position:fixed;z-index:999;pointer-events:none;transform:rotate(-3deg) scale(1.05);box-shadow:0 18px 30px rgba(0,0,0,.35)}
.chip.ghost{opacity:.25}
.bins{display:grid;gap:16px;flex:1;min-height:0}
.bin{border-radius:20px;border:3px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;gap:8px;padding:12px;transition:background .2s,border-color .2s;min-height:0;overflow:hidden}
.bin h3{margin:0;font-family:var(--f-disp);font-size:30px;color:#fff;text-align:center}
.bin h3 small{display:block;font-family:var(--f-body);font-size:15px;color:#C9D4E6;line-height:1.3}
.bin.hot{background:rgba(255,255,255,.1);border-style:solid}
.bin .got{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.bin .got .chip{font-size:16px;padding:5px 10px;cursor:default;box-shadow:none}
.bin.violet{border-color:var(--violet)}.bin.aqua{border-color:var(--aqua)}.bin.yel{border-color:var(--tape)}.bin.coral{border-color:var(--coral)}.bin.sky{border-color:var(--sky)}
.bin.violet .got .chip{background:#ECE9FE}.bin.aqua .got .chip{background:#DDF6F3}.bin.yel .got .chip{background:#FFF1CC}.bin.coral .got .chip{background:#FDE3E4}.bin.sky .got .chip{background:#E2EEFF}
.score{display:flex;gap:10px;align-items:center;color:#fff;font-size:20px}
.score b{font-family:var(--f-disp);font-size:30px;color:var(--tape)}
.toastx{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:60;border-radius:14px;padding:8px 22px;font-size:21px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.3);max-width:900px;text-align:center}

/* الفروع */
.br{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;min-height:0}
.portal{border:0;border-radius:22px;color:#fff;text-align:right;padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.portal .ic{font-family:var(--f-disp);font-size:70px;line-height:1;opacity:.95}
.portal b{font-family:var(--f-disp);font-size:36px}
.portal p{margin:0;font-size:20px;opacity:0;transform:translateY(10px);transition:all .4s}
.portal.open p{opacity:1;transform:none}
.portal .subs{display:flex;gap:8px;opacity:0;transition:opacity .4s .2s}
.portal.open .subs{opacity:1}
.portal .subs span{background:rgba(255,255,255,.22);border-radius:10px;padding:2px 12px;font-size:18px}

/* الطريقة العلمية */
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:stretch}
.slot{min-height:92px;border:3px dashed rgba(255,255,255,.35);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;padding:6px;font-size:19px;font-weight:600;position:relative}
.slot .num{font-family:var(--f-disp);font-size:26px;color:var(--tape);line-height:1}
.slot.ok{border-style:solid;border-color:var(--good);background:rgba(24,160,88,.18)}
.slot.hot{background:rgba(255,255,255,.1)}
.apply{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.apply div{background:#fff;border-radius:14px;padding:10px 12px;font-size:17px;line-height:1.5;opacity:0;transform:translateY(16px);transition:all .45s}
.apply div.on{opacity:1;transform:none}
.apply div b{display:block;color:var(--coral);font-family:var(--f-disp);font-size:19px}

/* المحاكاة */
.lab{display:grid;grid-template-columns:1fr 420px;gap:20px;flex:1;min-height:0}
.lab .tankw{position:relative;border-radius:22px;background:linear-gradient(#0F1C34,#13284A);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.lab svg{position:absolute;inset:0;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.side .card{padding:16px 18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:2.5px solid var(--rule);background:#fff;border-radius:12px;padding:6px 10px;font-size:18px;font-weight:600}
.seg button.on{border-color:var(--sky);background:#E8F1FF;color:#1650A8}
.seg button.okb{border-color:var(--good);background:#E3F6EB}
.seg button.nob{border-color:var(--bad);background:#FDE7E8}
table.res{width:100%;border-collapse:collapse;font-size:18px}
table.res th,table.res td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:right}
table.res th{color:var(--ink2);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:0 12px;font-size:16px;font-weight:600}
.pill.f{background:#DDF3FF;color:#0F6AA8}.pill.s{background:#FDE3E4;color:#B4282E}.pill.q{background:var(--paper2);color:var(--ink2)}

/* البطاقة العملية */
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;flex:1;min-height:0}
.sheet .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-weight:600;font-size:18px;color:var(--ink2)}
.fld textarea,.fld input{font:inherit;font-size:21px;border:2px solid var(--rule);border-radius:12px;padding:8px 12px;resize:none;background:#FBFCFE;color:var(--ink);width:100%}
.fld textarea:focus,.fld input:focus{border-color:var(--sky);outline:none;background:#fff}
.gtabs{display:flex;gap:8px}
.gtabs button{border:0;border-radius:12px 12px 0 0;padding:6px 18px;font-family:var(--f-disp);font-size:20px;background:rgba(255,255,255,.12);color:#fff}
.gtabs button.on{background:#fff;color:var(--ink)}

/* السباق */
.track{background:#0F1C34;border-radius:18px;padding:12px 16px;display:grid;gap:10px}
.lane{position:relative;height:56px;border-radius:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 40px,transparent 40px 80px)}
.lane .flag{position:absolute;left:6px;top:8px;font-size:30px}
.lane .runner{position:absolute;top:4px;right:0;height:48px;display:flex;align-items:center;gap:8px;transition:right .8s cubic-bezier(.3,1.4,.5,1);white-space:nowrap}
.lane .runner i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#fff;font-family:var(--f-disp);font-size:24px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.lane .runner span{color:#fff;font-weight:600;font-size:18px}
.lane .pts{position:absolute;left:52px;top:12px;color:#fff;font-family:var(--f-disp);font-size:24px}
.racewrap{display:grid;grid-template-columns:330px 1fr;gap:18px;flex:1;min-height:0}
.factor{font-family:var(--f-disp);font-size:36px;text-align:center;color:var(--ink);line-height:1.3}
.lanes3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lanes3 button{border:0;border-radius:16px;padding:14px 8px;color:#fff;font-family:var(--f-disp);font-size:28px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.teamsel{display:flex;gap:10px}
.teamsel button{flex:1;border:3px solid transparent;border-radius:14px;padding:8px;font-family:var(--f-disp);font-size:24px;color:#fff;opacity:.5}
.teamsel button.on{opacity:1;border-color:#fff;transform:scale(1.03)}
.tmr{font-family:var(--f-disp);font-size:34px;color:var(--tape);font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.tmr.low{color:var(--coral);animation:blink .6s steps(1) infinite}

/* المسابقة */
.quiz{display:grid;grid-template-columns:1fr 280px;gap:18px;flex:1;min-height:0}
.qcard{display:flex;flex-direction:column;gap:14px}
.qtext{font-family:var(--f-disp);font-size:34px;line-height:1.35;color:var(--ink)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qopts .opt{font-size:22px;padding:12px 16px}
.board{display:flex;flex-direction:column;gap:12px}
.tm{border-radius:18px;padding:12px 16px;color:#fff;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.3)}
.tm b{font-family:var(--f-disp);font-size:52px;line-height:1}
.tm span[contenteditable]{font-weight:600;font-size:20px;outline:none}
.tm.lead::after{content:"المتصدر";position:absolute;top:10px;left:-30px;background:var(--tape);color:var(--desk);font-size:13px;font-weight:700;padding:2px 34px;transform:rotate(-35deg)}
.expl{background:#FFF7E0;border-radius:12px;padding:10px 16px;font-size:20px;border-inline-start:6px solid var(--tape)}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.prog i{display:block;height:100%;background:var(--tape);transition:width .3s}

/* التقويم */
.mast{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:330px 1fr 70px;gap:12px;align-items:center;font-size:19px}
.mbar{height:18px;border-radius:9px;background:var(--paper2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:9px;transition:width 1s}

/* الختام */
.final{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;min-height:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:20px;padding:4px 0}
.chk i{width:26px;height:26px;border-radius:8px;background:var(--good);color:#fff;display:grid;place-items:center;font-style:normal;flex:none;margin-top:4px;font-size:16px}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:70}
.mapov{position:absolute;inset:0;z-index:80;background:rgba(10,18,34,.92);display:grid;place-items:center}
.mapov .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:1100px}
.mapov button{border:0;border-radius:16px;background:#fff;padding:14px;text-align:right;font-size:19px;display:flex;gap:12px;align-items:center}
.mapov button i{width:38px;height:38px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-size:20px;flex:none}
.mapov button.done i{background:var(--tape)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#scr{position:absolute;inset:0;overflow:hidden}
.restab{position:absolute;top:14px;left:14px;width:330px;background:rgba(255,255,255,.95);border-radius:14px;padding:6px 12px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.restab table.res{font-size:16px}
.side .card{padding:12px 16px}
.side .seg button{padding:4px 8px;font-size:17px}
.def .card{padding:16px 20px;font-size:20px;line-height:1.55}
.def .card b.t{font-size:26px}
.scr .mini .opt{padding:7px 14px;font-size:19px}
.scr .mini .opt .k{width:30px;height:30px}
.apply div{font-size:15.5px;padding:8px 10px}
.steps .slot{min-height:78px}

.sheet{gap:10px 20px}
.sheet .fld textarea,.sheet .fld input{font-size:19px;padding:6px 12px}
.sheet .fld .seg button{font-size:16px;padding:4px 8px}
.sheet .fld{gap:5px}
.toastx{top:auto;bottom:86px}

</style>
</head>

function dragkit(root,opts){ // opts: chips selector, bins selector, drop(chipEl,binEl)
  var sel=null, drag=null, ox=0, oy=0;
  function scale(){ return Number($('#stage').dataset.k)||1 }
  root.addEventListener('pointerdown',function(e){ var c=e.target.closest(opts.chip); if(!c||c.classList.contains('locked')) return;
    e.preventDefault(); var r=c.getBoundingClientRect(); drag={c:c,clone:c.cloneNode(true),x0:e.clientX,y0:e.clientY,moved:false,w:r.width,h:r.height};
    ox=e.clientX-r.left; oy=e.clientY-r.top; root.setPointerCapture&&root.setPointerCapture(e.pointerId) });
  root.addEventListener('pointermove',function(e){ if(!drag) return; if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8) return;
    if(!drag.moved){ drag.moved=true; var k=scale(); drag.clone.classList.add('drag'); drag.clone.style.width=drag.w+'px'; drag.clone.style.fontSize=(20*k)+'px'; drag.clone.style.padding=(10*k)+'px '+(18*k)+'px'; document.body.appendChild(drag.clone); drag.c.classList.add('ghost'); sfx.pop() }
    drag.clone.style.left=(e.clientX-ox)+'px'; drag.clone.style.top=(e.clientY-oy)+'px';
    var b=hit(e); $$(opts.bin,root).forEach(function(x){ x.classList.toggle('hot',x===b) }) });
  function hit(e){ var el=document.elementFromPoint(e.clientX,e.clientY); return el&&el.closest(opts.bin) }
  function end(e){ if(!drag) return; var d=drag; drag=null; $$(opts.bin,root).forEach(function(x){ x.classList.remove('hot') });
    if(d.moved){ d.clone.remove(); d.c.classList.remove('ghost'); var b=hit(e); if(b) opts.drop(d.c,b) }
    else { if(sel===d.c){ sel.classList.remove('sel'); sel=null } else { if(sel) sel.classList.remove('sel'); sel=d.c; sel.classList.add('sel'); sfx.pop() } } }
  root.addEventListener('pointerup',end); root.addEventListener('pointercancel',function(){ if(drag){ drag.clone.remove(); drag.c.classList.remove('ghost'); drag=null } });
  root.addEventListener('click',function(e){ var b=e.target.closest(opts.bin); if(b&&sel&&!e.target.closest(opts.chip)){ var c=sel; sel.classList.remove('sel'); sel=null; opts.drop(c,b) } });
}

    $('#qc',el).innerHTML='<div style="margin:auto;text-align:center;display:grid;gap:10px"><span class="kicker" style="justify-content:center">النتيجة النهائية</span><b class="disp" style="font-size:54px;color:'+(w<0?'var(--ink)':TEAMC[w])+'">'+(w<0?'تعادل!':'فاز '+esc(ST.teams[w])+'!')+'</b><span class="muted" style="font-size:24px">'+esc(ST.teams[0])+': '+n(sc[0])+' · '+esc(ST.teams[1])+': '+n(sc[1])+'</span></div>' }
  el.addEventListener('input',function(e){ var t=e.target.dataset.tn; if(t!==undefined){ ST.teams[Number(t)]=e.target.textContent.trim()||ST.teams[Number(t)]; save() } });
  el.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-start')){ i=0; ask(); return }
    if(b.dataset.t!==undefined){ team=Number(b.dataset.t); teamUI(); sfx.pop(); return }
    if(b.dataset.j!==undefined){ if(tried[team]||$('#qf .expl',el)) return; tried[team]=1; var j=Number(b.dataset.j), q=Q[i];
      if(j===q.a){ var p=10+Math.floor(left/5); sc[team]+=p; sfx.ok(); teamUI(); reveal(j,'✓ صحيح! +'+n(p)+' لـ'+esc(ST.teams[team])+'.') }
      else { b.classList.add('no','shake'); sfx.no(); var o=1-team; if(!tried[o]){ team=o; teamUI(); $('#qf',el).innerHTML='<div class="fb no pop">✗ خطأ! فرصة لـ'+esc(ST.teams[o])+'.</div>' } else reveal(j,'✗ لم يُجب أحد بشكل صحيح.') } return }
    if(b.hasAttribute('data-nx')){ if(i<Q.length-1){ i++; team=1-team; ask() } else finish() } });
  intro(); teamUI();
  return {destroy:function(){ clearInterval(iv) }, next:function(){ if(i<0){ i=0; ask(); return true } return false }};
});

/* ١٣) التقويم الختامي */
add('eval','التقويم الختامي',function(el){
  var i=0, res={}, Q=EVAL, picked=[];
  var CN={science:'العلم وطبيعته',observe:'الملاحظة والاستنتاج',hypothesis:'الفرضية',method:'الطريقة العلمية','theory-law':'النظرية والقانون',branches:'فروع العلوم',variables:'المتغيرات',skills:'المهارات العلمية'};
  function draw(){ var q=Q[i]; picked=[];
    el.innerHTML='<div class="row" style="justify-content:space-between"><div><span class="kicker">تقويم ختامي</span><h2 class="h1" style="font-size:34px">ماذا تعلّمت في هذا الملف؟</h2></div><span style="color:#fff;font-size:20px">السؤال '+n(i+1)+' من '+n(Q.length)+'</span></div><div class="prog"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+
     '<div class="card qcard grow"><span class="pill q" style="align-self:flex-start">'+esc(CN[q.c]||'')+(q.multi?' · اختر إجابتين':'')+'</span><div class="qtext pop" style="font-size:32px">'+esc(q.q)+'</div><div class="qopts">'+q.o.map(function(o,j){return '<button class="opt" data-j="'+j+'"><span class="k" style="background:'+['#F2545B','#3D8BFD','#E8A21B','#18A058'][j]+'">'+(q.tf?['✓','✗'][j]:['أ','ب','ج','د'][j])+'</span>'+esc(o)+'</button>'}).join('')+'</div>'+(q.multi?'<div><button class="btn sm" data-chk disabled>تحقّق</button></div>':'')+'<div id="qf"></div></div>' }
  function judge(ok){ var q=Q[i]; res[q.c]=res[q.c]||[0,0]; res[q.c][1]++; if(ok) res[q.c][0]++;
    $$('.opt',el).forEach(function(b){ var j=Number(b.dataset.j), right=q.multi?q.a.indexOf(j)>=0:j===q.a; b.classList.add(right?'ok':picked.indexOf(j)>=0?'no':'dim') });
    ok?sfx.ok():sfx.no(); $('#qf',el).innerHTML='<div class="expl pop"><b>'+(ok?'✓ إجابة صحيحة. ':'✗ ')+'</b>'+esc(q.ex)+'</div><div style="margin-top:10px"><button class="btn sm" data-nx>'+(i<Q.length-1?'التالي':'عرض النتيجة')+'</button></div>' }
  function report(){ var tot=0,ok=0; Object.keys(res).forEach(function(k){ tot+=res[k][1]; ok+=res[k][0] }); var pc=Math.round(ok/tot*100); done('eval'); if(pc>=70){ sfx.win(); confetti() }
    el.innerHTML='<div class="row" style="justify-content:space-between"><div><span class="kicker">نتيجة التقويم الختامي</span><h2 class="h1" style="font-size:40px">'+n(ok)+' من '+n(tot)+' · '+n(pc)+'٪</h2></div><button class="btn ghost sm" data-again>إعادة التقويم</button></div>'+
     '<div class="card grow"><b class="disp" style="font-size:24px">إتقان المفاهيم الأساسية</b><div class="mast" style="margin-top:12px">'+Object.keys(res).map(function(k){ var r=res[k], p=Math.round(r[0]/r[1]*100), c=p>=100?'var(--good)':p>=50?'var(--tape)':'var(--coral)'; return '<div class="mrow"><span>'+esc(CN[k]||k)+'</span><div class="mbar"><i style="width:0;background:'+c+'" data-w="'+p+'"></i></div><b>'+n(p)+'٪</b></div>' }).join('')+'</div></div>';
    setTimeout(function(){ $$('.mbar i',el).forEach(function(x){ x.style.width=x.dataset.w+'%' }) },60) }
  el.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-again')){ i=0; res={}; draw(); return }
    if(b.hasAttribute('data-nx')){ if(i<Q.length-1){ i++; draw() } else report(); return }
    if(b.dataset.j!==undefined&&!$('#qf .expl',el)){ var q=Q[i], j=Number(b.dataset.j);
      if(q.multi){ var k=picked.indexOf(j); if(k>=0) picked.splice(k,1); else if(picked.length<2) picked.push(j); $$('.opt',el).forEach(function(x){ x.classList.toggle('sel',picked.indexOf(Number(x.dataset.j))>=0) }); $('[data-chk]',el).disabled=picked.length!==2; sfx.pop(); return }
      picked=[j]; judge(j===q.a); return }
    if(b.hasAttribute('data-chk')){ var q2=Q[i]; judge(picked.length===2&&picked.every(function(x){return q2.a.indexOf(x)>=0})) } });
  draw(); return {};
});

/* ١٤) الختام: حُلّ اللغز */
add('end','حُلّ اللغز',function(el){
  var map={0:'science',1:'law',2:'branches',3:'method',4:'lab',5:'science'};
  el.innerHTML='<div><span class="kicker">إغلاق الملف</span><h2 class="h1" style="font-size:44px">حُلّ اللغز بالطريقة العلمية!</h2></div><div class="final">'+

   '<div class="card"><span class="tape l"></span><b class="disp" style="font-size:26px">مهام الملف</b>'+OBJ.map(function(o,i){return '<div class="chk"><i style="background:'+(ST.done[map[i]]?'var(--good)':'#C3CCDA')+'">'+(ST.done[map[i]]?'✓':'·')+'</i><span>'+esc(o)+'</span></div>'}).join('')+'<div class="row" style="margin-top:12px"><button class="btn sm ghost" data-reset>ملف جديد لحصة أخرى</button></div></div></div>';

/* ================= الحوض والمحاكاة ================= */
function canG(col,label){ return '<g><rect x="-22" y="-42" width="44" height="84" rx="8" fill="'+col+'" stroke="#0B1A30" stroke-width="2.5"/><rect x="-22" y="-42" width="44" height="12" rx="6" fill="#DCE3EE" stroke="#0B1A30" stroke-width="2.5"/><rect x="-18" y="-6" width="36" height="22" rx="4" fill="#fff" opacity=".9"/><text x="0" y="10" text-anchor="middle" font-size="13" font-weight="700" fill="#14213D" font-family="IBM Plex Sans Arabic,Tahoma">'+label+'</text><rect x="-16" y="-28" width="6" height="64" rx="3" fill="#fff" opacity=".25"/></g>' }
function tankSVG(id){ return '<svg viewBox="0 0 520 440" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="w'+id+'" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5EC3F2" stop-opacity=".75"/><stop offset="1" stop-color="#1F6FB2" stop-opacity=".9"/></linearGradient></defs>'+
  '<rect x="40" y="70" width="440" height="340" rx="14" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.55)" stroke-width="4"/>'+
  '<path class="wave" d="" fill="url(#w'+id+')"/><g class="bub"></g>'+
  '<g class="c0">'+canG('#E5484D','عادي')+'</g><g class="c1">'+canG('#C9D3DE','دايت')+'</g>'+
  '<text class="tg0" x="0" y="0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="IBM Plex Sans Arabic,Tahoma"></text><text class="tg1" x="0" y="0" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="IBM Plex Sans Arabic,Tahoma"></text>'+
  '<rect x="40" y="400" width="440" height="12" rx="6" fill="rgba(255,255,255,.25)"/></svg>' }
function tankSim(svg,o){
  var W=145, X=[180,340], H0=-60, bottom=400-42-6, D={reg:1.04,diet:0.99}, salt=false;
  var C=[{x:X[0],y:H0,vy:0,state:'idle',rot:0},{x:X[1],y:H0,vy:0,state:'idle',rot:0}], t=0, raf=0, cbs=[null,null], bubbles=[], alive=true;
  var wave=svg.querySelector('.wave'), bub=svg.querySelector('.bub'), g=[svg.querySelector('.c0'),svg.querySelector('.c1')], tg=[svg.querySelector('.tg0'),svg.querySelector('.tg1')];
  function dens(k){ return k===0?D.reg:D.diet }
  function target(k){ var fd=salt?1.2:1.0, d=dens(k); if(d>fd) return bottom; var sub=d/fd; return W-42+84*sub }
  function frame(){ if(!alive) return; raf=requestAnimationFrame(frame); t+=0.016;
    var p='M40 '+W; for(var x=40;x<=480;x+=10) p+=' L'+x+' '+(W+Math.sin(x/30+t*2)*3); p+=' L480 404 L40 404 Z'; wave.setAttribute('d',p);
    C.forEach(function(c,k){ if(c.state==='fall'||c.state==='settle'){ var tg2=target(k);
        if(c.y<W-30&&c.state==='fall'){ c.vy+=0.6 } else { if(c.state==='fall'){ c.state='settle'; c.vy*=0.35; sfx.splash(); for(var b=0;b<14;b++) bubbles.push({x:c.x+(Math.random()-0.5)*40,y:W+10+Math.random()*30,r:2+Math.random()*4,v:0.6+Math.random()}) }
          var f=(tg2-c.y)*0.012; c.vy=(c.vy+f)*0.93; if(Math.abs(c.vy)<0.02&&Math.abs(tg2-c.y)<1.5&&c.state==='settle'){ c.state='rest'; var r=tg2>=bottom-1?'s':'f'; tg[k].textContent=r==='f'?'تطفو':'تغوص'; tg[k].setAttribute('x',c.x); tg[k].setAttribute('y',r==='f'?W-58:bottom-58); if(cbs[k]){ cbs[k](r); cbs[k]=null } } }
        c.y+=c.vy; c.rot=Math.sin(t*3+k)*(c.state==='rest'&&target(k)<bottom?4:0) }
      else if(c.state==='rest'&&target(k)<bottom){ c.y=target(k)+Math.sin(t*2+k)*2; c.rot=Math.sin(t*2+k)*3 }
      g[k].setAttribute('transform','translate('+c.x+','+c.y+') rotate('+c.rot+')') });
    bub.innerHTML=bubbles.map(function(b){ b.y-=b.v; return b.y>W?'<circle cx="'+b.x+'" cy="'+b.y+'" r="'+b.r+'" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>':'' }).join(''); bubbles=bubbles.filter(function(b){return b.y>W})
  }
  function reset(){ C.forEach(function(c){ c.y=H0; c.vy=0; c.state='idle'; c.rot=0 }); tg.forEach(function(x){ x.textContent='' }) }
  function drop(k,cb){ var c=C[k]; c.y=H0; c.vy=0; c.state='fall'; cbs[k]=cb; tg[k].textContent=''; sfx.whoosh() }
  frame();
  var loopIv=null;
  if(o.loop){ var seq=function(){ reset(); setTimeout(function(){ drop(0) },500); setTimeout(function(){ drop(1) },1100) }; seq(); loopIv=setInterval(seq,6500) }
  return { drop:drop, reset:reset, setSalt:function(v){ salt=v; wave.style.filter=v?'saturate(.6) brightness(1.15)':'' }, stop:function(){ alive=false; cancelAnimationFrame(raf); clearInterval(loopIv) } };
}

/* ================= المحرك ================= */
var stage=$('#stage'), cur=-1, ctrl=null;
function fit(){ var w=innerWidth,h=innerHeight,k=Math.min(w/1280,h/720); stage.style.transform='translate('+((w-1280*k)/2)+'px,'+((h-720*k)/2)+'px) scale('+k+')'; stage.dataset.k=k }
window.addEventListener('resize',fit); fit();
var ICON={prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>',next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  full:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',snd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>'};
stage.innerHTML='<div class="hud"><div class="ttl">العلم وعملياته<small>ملف القضية رقم ١ · علوم الأول المتوسط</small></div><div class="stamps" id="stamps"></div></div><div id="scr"></div>'+
  '<div class="ctl"><button data-c="map" title="خريطة الملف">'+ICON.map+'</button><button data-c="snd" title="الصوت" class="'+(SND.on?'on':'')+'">'+ICON.snd+'</button><button data-c="full" title="ملء الشاشة">'+ICON.full+'</button><button data-c="prev" title="السابق">'+ICON.prev+'</button></div>'+
  '<button class="nextbig" data-c="next">التالي '+ICON.next+'</button><canvas id="confetti" width="1280" height="720"></canvas>';
function stamps(){ var s=$('#stamps'); if(!s) return; s.innerHTML=SCR.map(function(x,i){ return '<button class="stamp'+(ST.done[x.id]?' done':'')+(i===cur?' cur':'')+'" data-goto="'+i+'" title="'+esc(x.title)+'">'+(ST.done[x.id]?'✓':n(i+1))+'</button>' }).join('') }
function show(i,force){ if(i<0||i>=SCR.length) return; if(i===cur&&!force) return; if(ctrl&&ctrl.destroy) ctrl.destroy(); $$('.zoom,.toastx,.mapov').forEach(function(z){z.remove()});
  cur=i; var host=$('#scr'); host.innerHTML=''; var el=document.createElement('div'); el.className='scr enter'; host.appendChild(el);
  try{ ctrl=SCR[i].render(el)||{} }catch(err){ console.error(err); el.innerHTML='<div class="card">تعذّر عرض هذه الشاشة: '+esc(err.message)+'</div>'; ctrl={} }
  stamps(); $('.nextbig').style.visibility=i<SCR.length-1?'visible':'hidden'; ls('l1_cur',i); if(!force) sfx.whoosh() }
function next(){ if(ctrl&&ctrl.next&&ctrl.next()) return; show(cur+1) }
function prev(){ show(cur-1) }
document.addEventListener('click',function(e){ var b=e.target.closest('[data-c],[data-goto],[data-go]'); if(!b) return;
  if(b.dataset.go){ show(Number(b.dataset.go)); return }
  if(b.dataset.goto){ $$('.mapov').forEach(function(x){x.remove()}); show(Number(b.dataset.goto)); return }
  var c=b.dataset.c;
  if(c==='next') next(); else if(c==='prev') prev();
  else if(c==='snd'){ SND.on=!SND.on; ls('l1_snd',SND.on); b.classList.toggle('on',SND.on) }
  else if(c==='full'){ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){ toast('ملء الشاشة غير متاح هنا',false) }) }
  else if(c==='map'){ var m=document.createElement('div'); m.className='mapov'; m.innerHTML='<div class="grid">'+SCR.map(function(x,i){return '<button data-goto="'+i+'" class="'+(ST.done[x.id]?'done':'')+'"><i>'+n(i+1)+'</i>'+esc(x.title)+'</button>'}).join('')+'</div>'; stage.appendChild(m); m.addEventListener('click',function(ev){ if(ev.target===m) m.remove() }) } });
document.addEventListener('keydown',function(e){ if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.key==='Escape'){ $$('.zoom,.mapov').forEach(function(z){z.remove()}); return }
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); next() } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev() }
  else if(e.key==='f'||e.key==='F'){ $('[data-c=full]').click() } });
stamps(); show(Math.min(Number(ls('l1_cur'))||0,SCR.length-1),true);
})();
</script>
