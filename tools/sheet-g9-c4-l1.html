<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: مادة الوراثة DNA</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#6c3fd1", "color2": "#efe9ff", "lesson": {"id": "g9-c4-l1", "title": "مادة الوراثة DNA", "no": 1, "chapter": "الفصل الرابع: الوراثة", "chapterShort": "الفصل الرابع", "goals": ["تتعرف أجزاء جزيء DNA وتركيبه.", "توضح كيف يتضاعف DNA.", "تصف تركيب DNA.", "تحدد وظائف أنواع RNA المختلفة."], "grade": "علوم الثالث المتوسط"}, "sheet": {"idea": "يساعد DNA على تحديد معظم خصائص الجسم؛ فهو يحمل شفرة تصنيع البروتينات التي تحدد الصفات.", "terms": [{"t": "DNA", "d": "الحمض النووي الرايبوزي منقوص الأكسجين، يحوي معلومات خاصة بنمو المخلوقات الحية ونشاطها."}, {"t": "الجين (المورّث)", "d": "جزء من DNA مسؤول عن تصنيع بروتين ما، ويحتوي الكروموسوم الواحد على مئات الجينات."}, {"t": "RNA", "d": "الحمض النووي الرايبوزي، يُصنع داخل النواة من سلسلة واحدة، وتحل فيه القاعدة اليوراسيل محل الثايمين."}, {"t": "الطفرة", "d": "تغيّر دائم في تسلسل DNA المكوّن للكروموسوم، ينتج عنه تصنيع بروتينات غير متطابقة."}], "mcq": [{"q": "تُنقل شفرة صنع البروتين إلى الرايبوسومات بواسطة:", "o": ["DNA", "RNA الرسول", "RNA الرايبوسومي", "RNA الناقل"], "a": 1, "ex": "mRNA."}, {"q": "أي القواعد لا توجد في DNA؟", "o": ["الجوانين", "السايتوسين", "الثايمين", "اليوراسيل"], "a": 3, "ex": "U في RNA."}, {"q": "في DNA يرتبط الأدنين دائمًا مع:", "o": ["الثايمين", "الجوانين", "السايتوسين", "اليوراسيل"], "a": 0, "ex": "A مع T."}, {"q": "تغيّر دائم في تسلسل DNA:", "o": ["التهجين", "الطفرة", "الإخصاب", "التخمر"], "a": 1, "ex": "الطفرة."}], "apply": [{"type": "classify", "title": "صنّف كل خاصية: DNA أم RNA؟", "hint": "(٦ درجات)", "keys": ["DNA", "RNA"], "codes": ["D", "R"], "items": [["سلسلتان", 0], ["سلسلة واحدة", 1], ["يحتوي الثايمين T", 0], ["يحتوي اليوراسيل U", 1], ["يبقى في النواة", 0], ["ينتقل إلى الرايبوسوم", 1]]}, {"type": "calc", "title": "اكتب السلسلة المقابلة (A↔T و G↔C)", "hint": "(٤ درجات)", "items": [{"q": "سلسلة DNA ترتيب قواعدها: AGTAAC. ما ترتيب السلسلة المقابلة؟", "a": "TCATTG"}, {"q": "سلسلة DNA ترتيب قواعدها: GCTAAG. ما ترتيب السلسلة المقابلة؟", "a": "CGATTC"}]}], "tf": [["يتكوّن جانبا سلم DNA من جزيئات السكر والفوسفات.", true, "جانبا السلم: سكر خماسي منقوص الأكسجين ومجموعة فوسفات بالتعاقب، أما الدرجات فمن القواعد النيتروجينية."], ["تُصنع البروتينات داخل النواة.", false, "توجد الجينات في النواة، أما البروتينات فتُصنع في الرايبوسومات الموجودة في السيتوبلازم."], ["جميع الطفرات ضارة بالمخلوق الحي.", false, "كثير من الطفرات ضار، لكن بعضها مفيد، كما في إنتاج سلالات نباتية ذات صفات مرغوب فيها."]], "think": {"q": "كيف تستطيع أربعة أحرف فقط (A وT وC وG) أن تكتب تعليمات صفاتك كلها؟", "a": "بترتيبها المختلف على طول جزيء DNA؛ فكل جين تسلسل محدد من القواعد يحمل شفرة تصنيع بروتين معيّن، والبروتينات تحدد الصفات."}, "total": 23}};</script><script src="kit.js"></script></body></html>
