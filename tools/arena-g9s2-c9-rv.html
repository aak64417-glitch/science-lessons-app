<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مراجعة الفصل التاسع وأسئلته — الألعاب التعليمية</title><meta name="theme-color" content="#0b1220"></head><body><script>window.GAME={"lesson": {"id": "g9s2-c9-rv", "title": "مراجعة الفصل التاسع وأسئلته", "chapter": "الفصل التاسع: الحركة والزخم", "grade": "9"}, "qs": [{"q": "يكون الجسم في حالة حركة إذا:", "o": ["كانت كتلته كبيرة", "تغيّر موضعه بالنسبة إلى نقطة مرجعية", "كان ثابتًا", "كان لونه متغيرًا"], "a": 1, "ex": "الحركة تغيّر في الموضع بالنسبة إلى نقطة إسناد."}, {"q": "في سباق 100 م، ما النقطة المرجعية المناسبة؟", "o": ["خط النهاية", "خط البداية", "المدرجات", "الشمس"], "a": 1, "ex": "نقيس تغيّر الموضع بالنسبة إلى خط البداية."}, {"q": "سرت 40 م غربًا ثم 30 م شمالًا. ما المسافة؟", "o": ["50 م", "70 م", "10 م", "40 م"], "a": 1, "ex": "المسافة طول المسار = 40 + 30 = 70 م."}, {"q": "في المثال السابق، ما الإزاحة؟", "o": ["70 م", "50 م شمال غرب", "10 م", "صفر"], "a": 1, "ex": "الإزاحة البعد بين البداية والنهاية مع الاتجاه: 50 م شمال غرب (الشكل 3)."}, {"q": "درت دورة كاملة حول الحديقة (140 م) ورجعت إلى نقطة البداية. ما الإزاحة؟", "o": ["140 م", "70 م", "صفر", "280 م"], "a": 2, "ex": "نقطة النهاية هي نقطة البداية؛ فالإزاحة صفر."}, {"q": "سبّاح يقطع 100 م في 56 ث. ما سرعته؟", "o": ["0.56 م/ث", "1.8 م/ث", "5.6 م/ث", "56 م/ث"], "a": 1, "ex": "ع = 100 ÷ 56 ≈ 1.8 م/ث."}, {"q": "وحدة قياس السرعة في النظام الدولي:", "o": ["كم/س", "م/ث", "م/ث²", "كجم.م/ث"], "a": 1, "ex": "متر لكل ثانية، ويمكن قياسها بالكيلومتر لكل ساعة."}, {"q": "قافلة تقطع 1400 كم في 12 ساعة. ما متوسط سرعتها؟", "o": ["116.7 كم/س", "1412 كم/س", "16800 كم/س", "11.7 كم/س"], "a": 0, "ex": "1400 ÷ 12 ≈ 116.7 كم/س."}, {"q": "السرعة المتوسطة = ", "o": ["المسافة الكلية ÷ الزمن الكلي", "الزمن ÷ المسافة", "المسافة × الزمن", "السرعة النهائية − الابتدائية"], "a": 0, "ex": "تُحسب بقسمة المسافة الكلية على الزمن الكلي."}, {"q": "تكون السرعة المتوسطة مساوية للسرعة اللحظية عندما:", "o": ["تتزايد السرعة", "تكون السرعة ثابتة", "يتوقف الجسم ثم يتحرك", "تتناقص السرعة"], "a": 1, "ex": "إذا لم تتغير السرعة فهي في كل لحظة مساوية لمتوسطها."}, {"q": "متسلقان سرعة كل منهما 1.5 م/ث، أحدهما غربًا والآخر جنوبًا. ماذا تستنتج؟", "o": ["سرعتهما المتجهة متساوية", "مقدار سرعتيهما متساوٍ لكن سرعتيهما المتجهتين مختلفتان", "سرعتهما مختلفة", "كلاهما ساكن"], "a": 1, "ex": "السرعة المتجهة تتضمن الاتجاه (الشكل 5)."}, {"q": "سيارة تسير 40 كم/س شمالًا ثم انعطفت يسارًا بالسرعة نفسها. ماذا تغيّر؟", "o": ["مقدار السرعة", "السرعة المتجهة فقط", "لا شيء", "الكتلة"], "a": 1, "ex": "تغيّر الاتجاه فتغيّرت السرعة المتجهة رغم ثبات المقدار."}, {"q": "في منحنى المسافة–الزمن، الطالب (أ) قطع 1 م في 1 ث والطالب (ب) 0.5 م في 1 ث. أيهما أسرع؟", "o": ["ب", "أ", "متساويان", "لا يمكن التحديد"], "a": 1, "ex": "سرعة أ = 1 م/ث، وسرعة ب = 0.5 م/ث، وخط أ أشد ميلًا."}, {"q": "ماذا يعني خط أفقي في منحنى المسافة–الزمن؟", "o": ["سرعة كبيرة", "الجسم لم يغيّر موضعه وسرعته صفر", "تسارع", "سرعة ثابتة كبيرة"], "a": 1, "ex": "المسافة لا تتغير مع الزمن."}, {"q": "(نافس) عدّاء قطع 400 م في 43.9 ث، و100 م في 10.4 ث. في أي سباق كان أسرع؟", "o": ["سباق 400 م", "سباق 100 م", "متساويان", "لا يمكن الحكم"], "a": 1, "ex": "400 ÷ 43.9 ≈ 9.11 م/ث، و100 ÷ 10.4 ≈ 9.62 م/ث."}, {"q": "(نافس) طائرة تقطع 650 كم بسرعة متوسطة 300 كم/س. كم تستغرق؟", "o": ["0.46 ساعة", "2.17 ساعة", "950 ساعة", "19.5 ساعة"], "a": 1, "ex": "ز = ف ÷ ع = 650 ÷ 300 ≈ 2.17 ساعة."}, {"q": "التسارع هو:", "o": ["المسافة ÷ الزمن", "التغير في السرعة المتجهة ÷ الزمن", "الكتلة × السرعة", "الإزاحة ÷ الزمن"], "a": 1, "ex": "ت = (ع٢ − ع١) ÷ ز."}, {"q": "أي الأجسام الآتية لا يتسارع؟", "o": ["طائرة تطير بسرعة ثابتة في خط مستقيم", "دراجة تخفض سرعتها", "سيارة تنعطف", "صاروخ ينطلق"], "a": 0, "ex": "سرعتها المتجهة لا تتغير."}, {"q": "سيارة لعبة سرعتها 10 ثم 20 ثم 30 سم/ث في نهاية كل ثانية. حركتها:", "o": ["بسرعة ثابتة", "متسارعة", "متباطئة", "ساكنة"], "a": 1, "ex": "السرعة تزداد بانتظام: تسارع موجب في اتجاه الحركة."}, {"q": "عند الضغط على مكابح الدراجة يكون التسارع:", "o": ["في اتجاه الحركة", "في عكس اتجاه الحركة", "صفرًا", "نحو الأعلى دائمًا"], "a": 1, "ex": "السرعة تتناقص فالتسارع سالب."}, {"q": "حافلة تغيرت سرعتها من 6 إلى 12 م/ث خلال 3 ثوانٍ. تسارعها:", "o": ["2 م/ث²", "6 م/ث²", "18 م/ث²", "0.5 م/ث²"], "a": 0, "ex": "(12 − 6) ÷ 3 = 2 م/ث²."}, {"q": "قطار تزايدت سرعته من 7 إلى 17 م/ث خلال 120 ث. تسارعه تقريبًا:", "o": ["0.083 م/ث²", "1.2 م/ث²", "10 م/ث²", "12 م/ث²"], "a": 0, "ex": "(17 − 7) ÷ 120 = 10 ÷ 120 ≈ 0.083 م/ث²."}, {"q": "دراجة تسارعت من السكون إلى 6 م/ث خلال ثانيتين. تسارعها:", "o": ["12 م/ث²", "3 م/ث²", "4 م/ث²", "8 م/ث²"], "a": 1, "ex": "(6 − 0) ÷ 2 = 3 م/ث²."}, {"q": "نقصت سرعة دراجة من 4 إلى 2 م/ث خلال 5 ث. تسارعها:", "o": ["+0.4 م/ث²", "−0.4 م/ث²", "−2 م/ث²", "+2 م/ث²"], "a": 1, "ex": "(2 − 4) ÷ 5 = −0.4 م/ث² (تباطؤ)."}, {"q": "وحدة قياس التسارع:", "o": ["م/ث", "م/ث²", "كجم.م/ث", "م"], "a": 1, "ex": "متر لكل ثانية تربيع."}, {"q": "في منحنى السرعة–الزمن (الشكل 11) الجزء (أ): السرعة من 0 إلى 10 م/ث في 2 ث. التسارع:", "o": ["+5 م/ث²", "−5 م/ث²", "10 م/ث²", "20 م/ث²"], "a": 0, "ex": "(10 − 0) ÷ 2 = +5 م/ث²."}, {"q": "في الجزء (ج): السرعة من 10 إلى 4 م/ث بين 4 ث و6 ث. التسارع:", "o": ["+3 م/ث²", "−3 م/ث²", "−6 م/ث²", "+6 م/ث²"], "a": 1, "ex": "(4 − 10) ÷ 2 = −3 م/ث²."}, {"q": "ماذا يمثل الخط الأفقي في منحنى السرعة–الزمن؟", "o": ["تسارعًا موجبًا", "تسارعًا سالبًا", "تسارعًا مقداره صفر وسرعة ثابتة", "توقف الجسم دائمًا"], "a": 2, "ex": "لا تغير في السرعة."}, {"q": "الكرة المقذوفة إلى الأمام وإلى الأعلى: اتجاه تسارعها:", "o": ["إلى الأعلى", "إلى الأمام", "إلى الأسفل", "لا تتسارع"], "a": 2, "ex": "لذلك ينحني مسارها نحو الأسفل وتعود إلى الأرض (الشكل 9)."}, {"q": "(نافس) جسم يسقط من السكون بتسارع 9.8 م/ث². سرعته بعد 2 ث:", "o": ["4.9 م/ث", "9.8 م/ث", "19.6 م/ث", "39.2 م/ث"], "a": 2, "ex": "ع = 9.8 × 2 = 19.6 م/ث."}, {"q": "(نافس) عدّاء تتزايد سرعته من صفر إلى 3 م/ث خلال 12 ث. تسارعه:", "o": ["0.25 م/ث²", "4 م/ث²", "36 م/ث²", "9 م/ث²"], "a": 0, "ex": "3 ÷ 12 = 0.25 م/ث²."}, {"q": "كمية المادة في الجسم تُسمّى:", "o": ["الوزن", "الكتلة", "الزخم", "السرعة"], "a": 1, "ex": "الكتلة ووحدتها الكيلوجرام."}, {"q": "ميل الجسم لمقاومة أي تغيير في حالته الحركية:", "o": ["الزخم", "القصور الذاتي", "التسارع", "السرعة"], "a": 1, "ex": "ويزداد القصور الذاتي بزيادة الكتلة."}, {"q": "لماذا يكون مضرب التنس الأرضي أكبر من مضرب تنس الطاولة؟", "o": ["لأن كرة التنس الأرضي كتلتها أكبر فتحتاج قوة أكبر", "لأن كرة تنس الطاولة أسرع", "للزينة فقط", "لأن الملعب أكبر فقط"], "a": 0, "ex": "لتغيير السرعة المتجهة بالمقدار نفسه يلزم ضرب الكرة الأكبر كتلة بقوة أكبر."}, {"q": "الزخم = ", "o": ["الكتلة ÷ السرعة", "الكتلة × السرعة المتجهة", "السرعة ÷ الزمن", "المسافة × الزمن"], "a": 1, "ex": "خ = ك × ع."}, {"q": "وحدة قياس الزخم:", "o": ["م/ث", "كجم.م/ث", "م/ث²", "كجم"], "a": 1, "ex": "كيلوجرام × متر لكل ثانية."}, {"q": "دراجة كتلتها 14 كجم تتحرك 2 م/ث شمالًا. زخمها:", "o": ["7 كجم.م/ث", "28 كجم.م/ث شمالًا", "16 كجم.م/ث", "12 كجم.م/ث"], "a": 1, "ex": "14 × 2 = 28 كجم.م/ث شمالًا."}, {"q": "قطار كتلته 10000 كجم يتحرك 15 م/ث شرقًا. زخمه:", "o": ["150000 كجم.م/ث شرقًا", "10015 كجم.م/ث", "666 كجم.م/ث", "1500 كجم.م/ث"], "a": 0, "ex": "10000 × 15 = 150000 كجم.م/ث شرقًا."}, {"q": "سيارة كتلتها 900 كجم تتحرك 27 م/ث شمالًا. زخمها:", "o": ["24300 كجم.م/ث شمالًا", "927 كجم.م/ث", "33.3 كجم.م/ث", "2430 كجم.م/ث"], "a": 0, "ex": "900 × 27 = 24300 كجم.م/ث شمالًا."}, {"q": "ينص قانون حفظ الزخم على أن الزخم الكلي لمجموعة أجسام:", "o": ["يزداد دائمًا", "يبقى ثابتًا ما لم تؤثر قوة خارجية", "يتلاشى بعد التصادم", "يساوي الكتلة"], "a": 1, "ex": "التصادمات بين الأجسام لا تغيّر الزخم الكلي."}, {"q": "لماذا تتباطأ كرة البلياردو البيضاء عندما تضرب كرة أخرى؟", "o": ["لأنها اكتسبت زخمًا", "لأنها نقلت جزءًا من زخمها إلى الكرة الأخرى", "لأن كتلتها زادت", "لأن الزخم يُستحدث"], "a": 1, "ex": "الزخم الذي تخسره يساوي الزخم الذي تكسبه الكرة الأخرى."}, {"q": "القوة الخارجية التي تنقص الزخم الكلي لكرات البلياردو:", "o": ["الجاذبية بين الكرات", "الاحتكاك مع الطاولة", "المغناطيسية", "لا توجد"], "a": 1, "ex": "الاحتكاك يبطئ الكرات فيقل الزخم الكلي."}, {"q": "عندما يتصادم لاعبان ويمسك كل منهما بالآخر، فهذا تصادم:", "o": ["ترتد فيه الأجسام", "تلتحم فيه الأجسام", "لا ينتقل فيه زخم", "بلا كتلة"], "a": 1, "ex": "يلتحمان ويتحركان معًا."}, {"q": "كرة 2 كجم بسرعة 5 م/ث شرقًا التقطها متزلج ساكن كتلته 48 كجم. سرعتهما معًا:", "o": ["5 م/ث", "0.2 م/ث شرقًا", "2.5 م/ث", "10 م/ث"], "a": 1, "ex": "10 = (2 + 48) × ع ← ع = 0.2 م/ث شرقًا."}, {"q": "جسمان متماثلان بالسرعة نفسها تصادما مباشرة وارتدّا. الزخم الكلي قبل وبعد:", "o": ["يتضاعف", "صفر", "يساوي زخم أحدهما", "لا يمكن تحديده"], "a": 1, "ex": "زخمان متساويان متعاكسان مجموعهما صفر."}, {"q": "(نافس) ما زخم كتلة 0.1 كجم تتحرك 5 م/ث غربًا؟", "o": ["0.5 كجم.م/ث غربًا", "50 كجم.م/ث", "0.02 كجم.م/ث", "5.1 كجم.م/ث"], "a": 0, "ex": "0.1 × 5 = 0.5 كجم.م/ث غربًا."}, {"q": "(نافس) كرة 1 كجم بسرعة 3 م/ث اصطدمت بكرة ساكنة 2 كجم فتوقفت الأولى. سرعة الثانية:", "o": ["3 م/ث", "1.5 م/ث", "6 م/ث", "1 م/ث"], "a": 1, "ex": "1 × 3 = 2 × ع ← ع = 1.5 م/ث."}]};</script><script src="arena.js"></script></body></html>
