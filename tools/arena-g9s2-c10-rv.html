ة ثابتة (السرعة الحدّية) عندما:", "o": ["تنعدم الجاذبية", "تتساوى مقاومة الهواء مع وزنه", "تزداد كتلته", "يزداد تسارعه"], "a": 1, "ex": "تصبح القوة المحصلة صفرًا فيصبح التسارع صفرًا."}, {"q": "(نافس) احسب القوة المحصلة المؤثرة في كرة بيسبول كتلتها 0.15 كجم تتحرك بتسارع 40.0 م/ث².", "o": ["6.0 نيوتن", "266 نيوتن", "40.15 نيوتن", "0.004 نيوتن"], "a": 0, "ex": "ق = 0.15 × 40.0 = 6.0 نيوتن."}, {"q": "(نافس) سحبت صندوقًا كتلته 10 كجم بقوة محصلة 5 نيوتن. تسارعه:", "o": ["50 م/ث²", "2 م/ث²", "0.5 م/ث²", "15 م/ث²"], "a": 2, "ex": "ت = 5 ÷ 10 = 0.5 م/ث²."}, {"q": "ينص القانون الثالث لنيوتن على أن لكل قوة فعل قوة رد فعل:", "o": ["أكبر منها", "مساوية لها في المقدار ومعاكسة لها في الاتجاه", "في الاتجاه نفسه", "أصغر منها"], "a": 1, "ex": "هذا نص القانون الثالث لنيوتن في الحركة."}, {"q": "تدفع الرافعة السيارة إلى أعلى (الشكل 12). قوة رد الفعل:", "o": ["وزن السيارة", "دفع السيارة للرافعة إلى أسفل", "احتكاك الأرض", "مقاومة الهواء"], "a": 1, "ex": "السيارة تؤثر في الرافعة بالقوة نفسها في الاتجاه المعاكس."}, {"q": "لماذا لا تلغي قوة الفعل قوة رد الفعل؟", "o": ["لأنهما مختلفتان في المقدار", "لأنهما تؤثران في جسمين مختلفين", "لأن إحداهما أكبر", "لأنهما في الاتجاه نفسه"], "a": 1, "ex": "القوى تلغي بعضها فقط إذا أثرت في جسم واحد."}, {"q": "عندما تقفز إلى أعلى فإن القوة التي تمكنك من القفز هي:", "o": ["دفعك الأرض إلى أسفل", "دفع الأرض لك إلى أعلى", "وزنك", "مقاومة الهواء"], "a": 1, "ex": "تدفع الأرض إلى أسفل فتدفعك الأرض إلى أعلى بقوة مساوية."}, {"q": "في تصادم سيارتي الألعاب (الشكل 13):", "o": ["تؤثر الأسرع بقوة أكبر", "تؤثر كل منهما في الأخرى بقوتين متساويتين متعاكستين", "تؤثر الأكبر كتلة فقط", "لا تؤثر أي منهما"], "a": 1, "ex": "القانون الثالث لنيوتن."}, {"q": "دفع الطفل حائط المسبح برجليه (الشكل 14) فاندفع إلى الأمام لأن:", "o": ["الماء دفعه", "الحائط دفعه بقوة رد فعل", "وزنه قلّ", "الجاذبية انعدمت"], "a": 1, "ex": "قوة دفع الحائط للطفل قوة رد فعل."}, {"q": "يدفع الطائر الهواء بجناحيه إلى الخلف وإلى أسفل، فيدفعه الهواء:", "o": ["إلى الخلف وإلى أسفل", "إلى الأمام وإلى أعلى", "إلى أسفل
