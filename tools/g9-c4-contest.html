<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>لوحة التحدي · الفصل الرابع</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"color": "#6c3fd1", "color2": "#efe9ff", "chapter": {"id": "g9c4", "no": 4, "title": "الفصل الرابع: الوراثة", "short": "الفصل الرابع", "grade": "علوم الثالث المتوسط"}, "lessons": [{"id": "g9-c4-l1", "no": 1, "title": "مادة الوراثة DNA", "summary": "يساعد DNA على تحديد معظم خصائص الجسم؛ فهو يحمل شفرة تصنيع البروتينات التي تحدد الصفات.", "goals": ["تتعرف أجزاء جزيء DNA وتركيبه.", "توضح كيف يتضاعف DNA.", "تصف تركيب DNA.", "تحدد وظائف أنواع RNA المختلفة."], "terms": [{"t": "DNA", "d": "الحمض النووي الرايبوزي منقوص الأكسجين، يحوي معلومات خاصة بنمو المخلوقات الحية ونشاطها."}, {"t": "القواعد النيتروجينية", "d": "درجات سلم DNA: الأدنين A، والثايمين T، والسايتوسين C، والجوانين G؛ يرتبط A مع T، وG مع C."}, {"t": "البروتين (مراجعة)", "d": "مركب عضوي ضخم الحجم يتكوّن من الأحماض الأمينية."}, {"t": "الجين (المورّث)", "d": "جزء من DNA مسؤول عن تصنيع بروتين ما، ويحتوي الكروموسوم الواحد على مئات الجينات."}, {"t": "RNA", "d": "الحمض النووي الرايبوزي، يُصنع داخل النواة من سلسلة واحدة، وتحل فيه القاعدة اليوراسيل محل الثايمين."}, {"t": "mRNA الرسول", "d": "نسخة من DNA تنتقل بين النواة والرايبوسوم حاملة شفرة تصنيع البروتين."}, {"t": "tRNA الناقل", "d": "يحمل الأحماض الأمينية ويربطها حسب الشفرة التي يحملها الرسول."}, {"t": "rRNA الرايبوسومي", "d": "يوجد في الرايبوسومات، ويعمل على ربط الأحماض الأمينية في سلسلة عديد الببتيد."}, {"t": "الطفرة", "d": "تغيّر دائم في تسلسل DNA المكوّن للكروموسوم، ينتج عنه تصنيع بروتينات غير متطابقة."}], "concepts": [{"n": "DNA", "t": "سلم حلزوني: جانباه سكر وفوسفات، ودرجاته قواعد نيتروجينية؛ يرتبط A مع T، وG مع C."}, {"n": "اكتشافه", "t": "روزاليند فرانكلين (١٩٥٢م) بالأشعة السينية، ونموذج واطسون وكريك (١٩٥٣م)."}, {"n": "التضاعف", "t": "تنفصل السلسلتان وترتبط قواعد جديدة، فينتج جزيئان متطابقان، في الطور البيني قبل الانقسام."}, {"n": "الجين", "t": "جزء من DNA مسؤول عن تصنيع بروتين؛ والبروتينات تحدد الصفات وتبني الأنسجة وتعمل كإنزيمات."}, {"n": "RNA", "t": "سلسلة واحدة فيها اليوراسيل بدل الثايمين: mRNA الرسول، وtRNA الناقل، وrRNA الرايبوسومي."}, {"n": "الطفرة", "t": "تغيّر دائم في تسلسل DNA؛ من أسبابها الأشعة السينية وضوء الشمس وبعض المواد الكيميائية."}], "qs": [{"q": "تُنقل شفرة صنع البروتين إلى الرايبوسومات بواسطة:", "o": ["RNA الرسول", "RNA الناقل", "RNA الرايبوسومي", "DNA"], "a": 0, "ex": "mRNA."}, {"q": "أي القواعد لا توجد في DNA؟", "o": ["اليوراسيل", "الثايمين", "السايتوسين", "الجوانين"], "a": 0, "ex": "U في RNA."}, {"q": "في DNA يرتبط الأدنين دائمًا مع:", "o": ["الثايمين", "السايتوسين", "الجوانين", "اليوراسيل"], "a": 0, "ex": "A مع T."}, {"q": "يرتبط الجوانين في DNA مع:", "o": ["السايتوسين", "الأدنين", "الثايمين", "اليوراسيل"], "a": 0, "ex": "G مع C."}, {"q": "تتكوّن البروتينات من:", "o": ["أحماض أمينية", "أحماض دهنية", "رايبوسومات", "مريكزات"], "a": 0, "ex": "الأحماض الأمينية."}, {"q": "تغيّر دائم في تسلسل DNA:", "o": ["الطفرة", "التهجين", "الإخصاب", "التخمر"], "a": 0, "ex": "الطفرة."}, {"q": "أين تُصنع البروتينات؟", "o": ["في الرايبوسومات", "في النواة", "في الغشاء البلازمي", "في الفجوات"], "a": 0, "ex": "في الرايبوسومات الموجودة في السيتوبلازم."}, {"q": "جزء من DNA مسؤول عن تصنيع بروتين ما:", "o": ["الجين", "الرايبوسوم", "الحمض الأميني", "الكروموسوم كاملًا"], "a": 0, "ex": "الجين (المورّث)."}, {"q": "استعملت الأشعة السينية لمعرفة أن DNA سلسلتان كالسلم الحلزوني:", "o": ["روزاليند فرانكلين", "مندل", "نيوتن", "واطسون وحده"], "a": 0, "ex": "عام ١٩٥٢م."}, {"q": "بنى نموذج DNA عام ١٩٥٣م:", "o": ["واطسون وكريك", "فرانكلين ومندل", "نيوتن وكريك", "مندل وواطسون"], "a": 0, "ex": "واطسون وكريك."}, {"q": "يحمل الأحماض الأمينية ويربطها حسب شفرة الرسول:", "o": ["tRNA", "mRNA", "rRNA", "DNA"], "a": 0, "ex": "الناقل."}, {"q": "يوجد في الرايبوسومات ويربط الأحماض الأمينية في سلسلة:", "o": ["rRNA", "mRNA", "tRNA", "DNA"], "a": 0, "ex": "الرايبوسومي."}, {"q": "متى يتضاعف DNA؟", "o": ["في الطور البيني قبل الانقسام", "بعد موت الخلية", "أثناء الهضم", "في الرايبوسوم"], "a": 0, "ex": "في الطور البيني."}, {"q": "من العوامل المسببة للطفرات:", "o": ["ضوء الشمس", "الماء", "الأكسجين", "السكر"], "a": 0, "ex": "وأيضًا الأشعة السينية وبعض المواد الكيميائية."}, {"q": "إذا كانت كمية الأدنين في عينة DNA ٣٠٪ فكمية الثايمين:", "o": ["٣٠٪", "٢٠٪", "٧٠٪", "٤٠٪"], "a": 0, "ex": "كمية A تساوي كمية T."}, {"q": "السكر في DNA:", "o": ["خماسي منقوص الأكسجين", "سداسي", "الجلوكوز", "سكر القصب"], "a": 0, "ex": "ولذلك سُمّي منقوص الأكسجين."}, {"q": "السلسلة المقابلة لـ AGTAAC هي:", "o": ["TCATTG", "UCAUUG", "AGTAAC", "GACTTA"], "a": 0, "ex": "A↔T و G↔C."}, {"q": "السلسلة المقابلة لـ GCTAAG هي:", "o": ["CGATTC", "CGAUUC", "ATAGGA", "GCTAAG"], "a": 0, "ex": "لا يوجد U في DNA."}, {"q": "لماذا يتشابه DNA في خلايا الدماغ وخلايا القلب للشخص نفسه؟", "o": ["لأن خلايا الجسم كلها نتجت من انقسام خلية واحدة", "لأنهما يقومان بالوظيفة نفسها", "لأن الدماغ يرسل DNA إلى القلب", "لا يتشابهان"], "a": 0, "ex": "تحمل كل خلية نسخة مماثلة من DNA."}, {"q": "ماذا يحدث إذا لم يُنسخ DNA كما هو بالأصل؟", "o": ["تنتج طفرة تؤدي إلى تصنيع بروتين بطريقة غير سليمة", "يتوقف القلب فورًا", "يتحول DNA إلى RNA", "لا يحدث شيء أبدًا"], "a": 0, "ex": "من الخلاصة."}, {"q": "لماذا تظهر خيوط DNA عند إضافة الكحول البارد في تجربة الاستخلاص؟", "o": ["لأن DNA لا يذوب في الكحول البارد فينفصل", "لأن الكحول يصنع DNA", "لأن الكحول يذيب DNA", "لأن الكحول يلوّن الماء"], "a": 0, "ex": "ينفصل DNA فوق السائل."}, {"q": "في جزيء DNA عدد قواعد C يساوي ٤٠، فكم عدد قواعد G؟", "o": ["٤٠", "٢٠", "٨٠", "١٠"], "a": 0, "ex": "كمية C تساوي كمية G."}], "tf": [["يتكوّن جانبا سلم DNA من جزيئات السكر والفوسفات.", true, "جانبا السلم: سكر خماسي منقوص الأكسجين ومجموعة فوسفات بالتعاقب، أما الدرجات فمن القواعد النيتروجينية."], ["يرتبط الأدنين في جزيء DNA مع السايتوسين.", false, "يرتبط الأدنين مع الثايمين، ويرتبط الجوانين مع السايتوسين."], ["تُصنع البروتينات داخل النواة.", false, "توجد الجينات في النواة، أما البروتينات فتُصنع في الرايبوسومات الموجودة في السيتوبلازم."], ["تحل القاعدة النيتروجينية اليوراسيل في RNA محل الثايمين.", true, "قواعد RNA: الأدنين والجوانين والسايتوسين واليوراسيل."], ["جميع الطفرات ضارة بالمخلوق الحي.", false, "كثير من الطفرات ضار، لكن بعضها مفيد، كما في إنتاج سلالات نباتية ذات صفات مرغوب فيها."], ["يتكوّن جانبا سلم DNA من السكر والفوسفات.", true, "صحيح."], ["يتكوّن RNA من سلسلتين.", false, "من سلسلة واحدة."], ["تعمل بعض البروتينات كإنزيمات.", true, "صحيح."], ["الطفرة في الخلايا الجسمية تنتقل إلى الأبناء.", false, "لا تنتقل؛ التي تنتقل هي الطفرة في الخلايا الجنسية."], ["يحتوي الكروموسوم الواحد على مئات الجينات.", true, "صحيح."], ["بعض الطفرات تكون مفيدة لإنتاج سلالات نباتية ذات صفات مرغوب فيها.", true, "صحيح."]], "cover": "../img/cover-g9-c4-l1.webp", "file": "../lessons/g9-c4-r2.html#l1", "sheet": "sheet-g9-c4-l1.html"}, {"id": "g9-c4-l2", "no": 2, "title": "علم الوراثة", "summary": "يساعد علم الوراثة على تفسير اختلاف الصفات بين الناس، ويُستعمل مربع بانيت لتوقع صفات الأبناء.", "goals": ["تفسر كيف تورث الصفات.", "تتعرف دور العالم مندل في علم الوراثة.", "تستعمل مربع بانيت لتوقع نتائج التزاوج.", "تميز بين الطرز الجينية والطرز الشكلية."], "terms": [{"t": "الانقسام المنصف (مراجعة)", "d": "عملية حيوية ينتج عنها أربع خلايا أحادية المجموعة الكروموسومية من خلية واحدة ثنائية المجموعة الكروموسومية."}, {"t": "الوراثة", "d": "انتقال الصفات الوراثية من الآباء إلى الأبناء."}, {"t": "علم الوراثة", "d": "علم يدرس كيفية انتقال الصفات الوراثية وتفاعلها فيما بينها."}, {"t": "الجين المقابل (الأليل)", "d": "أزواج الجينات المسؤولة عن صفة محددة؛ ينتقل كل جين منهما إلى خلية جنسية منفصلة."}, {"t": "الهجين", "d": "مخلوق حي تكون فيه الجينات المتقابلة مختلفة في الصفة الوراثية."}, {"t": "الصفة النقية", "d": "الصفة التي تظهر دائمًا جيلًا بعد جيل."}, {"t": "العامل السائد", "d": "الجين الذي تظهر صفته، ويُرمز له بالحرف الكبير، مثل A."}, {"t": "العامل المتنحي", "d": "الجين الذي تختفي صفته عند التقائه بالجين السائد، ويُرمز له بالحرف الصغير، مثل a."}, {"t": "الجينات المتماثلة", "d": "جينان متقابلان متشابهان للصفة، مثل AA أو aa
