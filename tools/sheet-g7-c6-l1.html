<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: صفائح الأرض المتحركة</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#8A5A2B", "color2": "#F5ECD9", "lesson": {"id": "g7-c6-l1", "title": "صفائح الأرض المتحركة", "no": 1, "chapter": "الفصل السادس: القوى المشكلة للأرض", "chapterShort": "الفصل السادس", "goals": ["تصف أن باطن الأرض مقسّم إلى طبقات.", "تشرح كيف تتحرك الصفائح الأرضية، وتناقش لماذا تتحرك.", "تصف كيف تتكوّن الجبال وكيف تُحتّ.", "تقارن بين أنواع الجبال.", "تحدّد القوى التي تشكّل جبال الأرض."]}, "sheet": {"idea": "تتحرك صفائح الأرض بفعل القوة الداخلية فيها، وينتج عنها تكوّن أربعة أنواع من الجبال.", "terms": [{"t": "القشرة", "d": "أرق نطاقات الأرض، وتشبه قشرة ثمرة الخوخ."}, {"t": "الستار (الوشاح)", "d": "أكبر نطاقات الأرض، صلب يتحرك ببطء شديد كالمعجون."}, {"t": "اللب الخارجي", "d": "نطاق سائل يتكوّن من عناصر منصهرة."}, {"t": "اللب الداخلي", "d": "نطاق صلب في مركز الأرض، معظمه حديد، ودرجة حرارته نحو ٥٠٠٠°س."}], "mcq": [{"q": "أيّ أجزاء الأرض أكبر؟", "o": ["اللب الداخلي", "الستار", "اللب الخارجي", "القشرة"], "a": 1, "ex": "الستار أكبر النطاقات."}, {"q": "صفائح الأرض هي قطع من:", "o": ["الستار", "اللب الداخلي", "الغلاف اللدن", "الغلاف الصخري"], "a": 3, "ex": "الغلاف الصخري."}, {"q": "أيّ القوى تسبب تباعد الصفائح؟", "o": ["الشدّ", "القصّ", "الضغط", "التوازن"], "a": 0, "ex": "الشد."}, {"q": "أيّ حركة للصفائح تحدث عند الحدود التحويلية؟", "o": ["تقارب الصفائح", "انزلاق الصفائح بعضها بجانب بعض", "تباعد الصفائح", "غوص الصفائح"], "a": 1, "ex": "الصفائح المتحاذية."}], "apply": [{"type": "classify", "title": "صنّف حسب نوع حدود الصفائح", "hint": "(٦ درجات)", "keys": ["متباعدة", "متقاربة", "متحاذية"], "codes": ["ب", "ق", "ح"], "items": [["البحر الأحمر", 0], ["جبال الهملايا", 1], ["منطقة البحر الميت", 2], ["قشرة جديدة وأودية خسفية", 0], ["غوص الصفائح", 1], ["قوى قصّ وزلازل", 2]]}, {"type": "calc", "title": "احسب: المسافة = المعدل × الزمن", "hint": "(٤ درجات)", "items": [{"q": "تتحرك صفيحة بمعدل 2 سم في السنة. ما المسافة التي تقطعها في 1000 سنة؟", "a": "المسافة = 2 × 1000 = 2000 سم = 20 م"}, {"q": "تتحرك صفيحة بمعدل 5 سم في السنة. ما المسافة التي تقطعها في 200 سنة؟", "a": "المسافة = 5 × 200 = 1000 سم = 10 م"}]}], "tf": [["الطبقة الداخلية الموجودة في مركز الأرض هي لب في الحالة السائلة.", false, "اللب الداخلي صلب، ومعظمه حديد، أما اللب الخارجي فهو السائل."], ["يتجزأ الستار إلى صفائح تتحرك فوق الغلاف الصخري اللدن.", false, "الغلاف الصخري (القشرة والجزء العلوي من الستار) هو الذي يتجزأ إلى صفائح تتحرك فوق الغلاف اللدن."], ["القشرة القارية أعلى كثافة من القشرة المحيطية.", false, "القشرة المحيطية أعلى كثافة؛ ولذلك تغوص تحت القارية عند تقاربهما."]], "think": {"q": "هل هذه الجبال الوعرة المغطاة بالثلج قديمة أم حديثة؟ وماذا سيحدث لها بعد ملايين السنين؟", "a": "حديثة؛ لأنها مرتفعة وعرة القمم. ومع مئات ملايين السنين من الحتّ تقل ارتفاعًا وتصبح قممها ملساء."}, "total": 23}};</script><script src="kit.js"></script></body></html>
