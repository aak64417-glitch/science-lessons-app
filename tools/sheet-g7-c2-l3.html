<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: الشغل والآلات البسيطة</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#E2662B", "color2": "#FDEDE4", "lesson": {"id": "g7-c2-l3", "title": "الشغل والآلات البسيطة", "no": 3, "chapter": "الفصل الثاني: الحركة والقوى والآلات البسيطة", "chapterShort": "الفصل الثاني", "goals": ["تعرّف الشغل وتحدد العاملين المؤثرين فيه.", "تحسب الشغل بوحدة الجول.", "تميّز الآلات البسيطة من المركبة، وتوضح كيف تسهّل الآلات العمل.", "تحسب الفائدة الآلية للبكرات والمستوى المائل والعجلة والمحور.", "تصنّف الروافع إلى أنواعها الثلاثة."]}, "sheet": {"idea": "الآلات لا تقلل الشغل، لكنها تسهّله بتغيير مقدار القوة أو اتجاهها؛ والشغل = القوة × المسافة.", "terms": [{"t": "الشغل", "d": "يُبذل الشغل عندما تؤدي القوة المؤثرة في جسم إلى تحريكه في اتجاه القوة. ش = ق × ف."}, {"t": "الجول", "d": "وحدة قياس الشغل، وتساوي نيوتن × متر."}, {"t": "الآلة", "d": "أداة تسهّل العمل."}, {"t": "الآلة البسيطة", "d": "آلة تتطلب حركة واحدة فقط، مثل البكرة والرافعة."}, {"t": "الآلة المركبة", "d": "آلة تتكون من مجموعة من الآلات البسيطة، مثل الدراجة."}], "mcq": [{"q": "دفعت جدارًا ولم يتحرك. الشغل:", "o": ["كبير", "صفر", "100 جول", "يعتمد على الزمن"], "a": 1, "ex": ""}, {"q": "البكرة الواحدة تغيّر:", "o": ["مقدار القوة فقط", "الشغل", "اتجاه القوة فقط", "الكتلة"], "a": 2, "ex": ""}, {"q": "الفأس مثال على:", "o": ["الأسفين", "العجلة والمحور", "البرغي", "البكرة"], "a": 0, "ex": ""}, {"q": "الدراجة آلة:", "o": ["مركبة", "بسيطة", "رافعة فقط", "ليست آلة"], "a": 0, "ex": ""}], "apply": [{"type": "calc", "title": "احسب: المعطيات ← القانون ← الحل", "hint": "(٦ درجات)", "items": [{"q": "قوة 20 نيوتن حرّكت جسمًا 3 م في اتجاهها. ما الشغل المبذول؟", "a": "ش = ق × ف = 20 × 3 = 60 جول"}, {"q": "ما الفائدة الآلية لسطح مائل طوله 9 م وارتفاعه 3 م؟", "a": "الفائدة الآلية = الطول ÷ الارتفاع = 9 ÷ 3 = 3"}, {"q": "آلة تعطي قوة ناتجة 200 نيوتن عند بذل قوة 50 نيوتن. ما فائدتها الآلية؟", "a": "الفائدة الآلية = القوة الناتجة ÷ القوة المبذولة = 200 ÷ 50 = 4"}]}, {"type": "classify", "title": "حدّد نوع الرافعة", "hint": "(٣ درجات)", "keys": ["الأول: الارتكاز في المنتصف", "الثاني: الحِمل في المنتصف", "الثالث: الجهد في المنتصف"], "codes": ["١", "٢", "٣"], "items": [["المقص", 0], ["كسّارة البندق", 1], ["الملقط", 2]]}], "tf": [], "think": {"q": "لتحميل عربة ثقيلة إلى صندوق سيارة: هل ترفعها مباشرة أم تدفعها على سطح مائل؟ أيهما يحتاج إلى قوة أقل؟", "a": "السطح المائل يحتاج إلى قوة أقل، لكنك تدفع العربة مسافة أطول (طول السطح بدل الارتفاع). الآلات لا تقلل الشغل، لكنها تسهّله بتغيير مقدار القوة أو اتجاهها."}, "total": 20}};</script><script src="kit.js"></script></body></html>
