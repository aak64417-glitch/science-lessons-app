<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>سباق الجينات · مادة الوراثة DNA</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "game", "color": "#6c3fd1", "color2": "#efe9ff", "game": {"id": "race", "title": "سباق الجينات", "icon": "🏎", "sub": "سباق بين الفرق: كل إجابة صحيحة خطوة نحو خط النهاية."}, "lesson": {"id": "g9-c4-l1", "no": 1, "title": "مادة الوراثة DNA", "qs": [{"q": "تُنقل شفرة صنع البروتين إلى الرايبوسومات بواسطة:", "o": ["RNA الرسول", "RNA الناقل", "RNA الرايبوسومي", "DNA"], "a": 0, "ex": "mRNA."}, {"q": "أي القواعد لا توجد في DNA؟", "o": ["اليوراسيل", "الثايمين", "السايتوسين", "الجوانين"], "a": 0, "ex": "U في RNA."}, {"q": "في DNA يرتبط الأدنين دائمًا مع:", "o": ["الثايمين", "السايتوسين", "الجوانين", "اليوراسيل"], "a": 0, "ex": "A مع T."}, {"q": "يرتبط الجوانين في DNA مع:", "o": ["السايتوسين", "الأدنين", "الثايمين", "اليوراسيل"], "a": 0, "ex": "G مع C."}, {"q": "تتكوّن البروتينات من:", "o": ["أحماض أمينية", "أحماض دهنية", "رايبوسومات", "مريكزات"], "a": 0, "ex": "الأحماض الأمينية."}, {"q": "تغيّر دائم في تسلسل DNA:", "o": ["الطفرة", "التهجين", "الإخصاب", "التخمر"], "a": 0, "ex": "الطفرة."}, {"q": "أين تُصنع البروتينات؟", "o": ["في الرايبوسومات", "في النواة", "في الغشاء البلازمي", "في الفجوات"], "a": 0, "ex": "في الرايبوسومات الموجودة في السيتوبلازم."}, {"q": "جزء من DNA مسؤول عن تصنيع بروتين ما:", "o": ["الجين", "الرايبوسوم", "الحمض الأميني", "الكروموسوم كاملًا"], "a": 0, "ex": "الجين (المورّث)."}, {"q": "استعملت الأشعة السينية لمعرفة أن DNA سلسلتان كالسلم الحلزوني:", "o": ["روزاليند فرانكلين", "مندل", "نيوتن", "واطسون وحده"], "a": 0, "ex": "عام ١٩٥٢م."}, {"q": "بنى نموذج DNA عام ١٩٥٣م:", "o": ["واطسون وكريك", "فرانكلين ومندل", "نيوتن وكريك", "مندل وواطسون"], "a": 0, "ex": "واطسون وكريك."}, {"q": "يحمل الأحماض الأمينية ويربطها حسب شفرة الرسول:", "o": ["tRNA", "mRNA", "rRNA", "DNA"], "a": 0, "ex": "الناقل."}, {"q": "يوجد في الرايبوسومات ويربط الأحماض الأمينية في سلسلة:", "o": ["rRNA", "mRNA", "tRNA", "DNA"], "a": 0, "ex": "الرايبوسومي."}, {"q": "متى يتضاعف DNA؟", "o": ["في الطور البيني قبل الانقسام", "بعد موت الخلية", "أثناء الهضم", "في الرايبوسوم"], "a": 0, "ex": "في الطور البيني."}, {"q": "من العوامل المسببة للطفرات:", "o": ["ضوء الشمس", "الماء", "الأكسجين", "السكر"], "a": 0, "ex": "وأيضًا الأشعة السينية وبعض المواد الكيميائية."}, {"q": "إذا كانت كمية الأدنين في عينة DNA ٣٠٪ فكمية الثايمين:", "o": ["٣٠٪", "٢٠٪", "٧٠٪", "٤٠٪"], "a": 0, "ex": "كمية A تساوي كمية T."}, {"q": "السكر في DNA:", "o": ["خماسي منقوص الأكسجين", "سداسي", "الجلوكوز", "سكر القصب"], "a": 0, "ex": "ولذلك سُمّي منقوص الأكسجين."}, {"q": "السلسلة المقابلة لـ AGTAAC هي:", "o": ["TCATTG", "UCAUUG", "AGTAAC", "GACTTA"], "a": 0, "ex": "A↔T و G↔C."}, {"q": "السلسلة المقابلة لـ GCTAAG هي:", "o": ["CGATTC", "CGAUUC", "ATAGGA", "GCTAAG"], "a": 0, "ex": "لا يوجد U في DNA."}, {"q": "لماذا يتشابه DNA في خلايا الدماغ وخلايا القلب للشخص نفسه؟", "o": ["لأن خلايا الجسم كلها نتجت من انقسام خلية واحدة", "لأنهما يقومان بالوظيفة نفسها", "لأن الدماغ يرسل DNA إلى القلب", "لا يتشابهان"], "a": 0, "ex": "تحمل كل خلية نسخة مماثلة من DNA."}, {"q": "ماذا يحدث إذا لم يُنسخ DNA كما هو بالأصل؟", "o": ["تنتج طفرة تؤدي إلى تصنيع بروتين بطريقة غير سليمة", "يتوقف القلب فورًا", "يتحول DNA إلى RNA", "لا يحدث شيء أبدًا"], "a": 0, "ex": "من الخلاصة."}, {"q": "لماذا تظهر خيوط DNA عند إضافة الكحول البارد في تجربة الاستخلاص؟", "o": ["لأن DNA لا يذوب في الكحول البارد فينفصل", "لأن الكحول يصنع DNA", "لأن الكحول يذيب DNA", "لأن الكحول يلوّن الماء"], "a": 0, "ex": "ينفصل DNA فوق السائل."}, {"q": "في جزيء DNA عدد قواعد C يساوي ٤٠، فكم عدد قواعد G؟", "o": ["٤٠", "٢٠", "٨٠", "١٠"], "a": 0, "ex": "كمية C تساوي كمية G."}]}};</script><script src="modes.js"></script><script src="games.js"></script><script src="kit.js"></script></body></html>
