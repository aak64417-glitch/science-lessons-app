 مرجعية", "كان ثابتًا", "كان لونه متغيرًا"], "a": 1, "ex": "الحركة تغيّر في الموضع بالنسبة إلى نقطة إسناد."}, {"q": "في سباق 100 م، ما النقطة المرجعية المناسبة؟", "o": ["خط النهاية", "خط البداية", "المدرجات", "الشمس"], "a": 1, "ex": "نقيس تغيّر الموضع بالنسبة إلى خط البداية."}, {"q": "سرت 40 م غربًا ثم 30 م شمالًا. ما المسافة؟", "o": ["50 م", "70 م", "10 م", "40 م"], "a": 1, "ex": "المسافة طول المسار = 40 + 30 = 70 م."}, {"q": "في المثال السابق، ما الإزاحة؟", "o": ["70 م", "50 م شمال غرب", "10 م", "صفر"], "a": 1, "ex": "الإزاحة البعد بين البداية والنهاية مع الاتجاه: 50 م شمال غرب (الشكل 3)."}, {"q": "درت دورة كاملة حول الحديقة (140 م) ورجعت إلى نقطة البداية. ما الإزاحة؟", "o": ["140 م", "70 م", "صفر", "280 م"], "a": 2, "ex": "نقطة النهاية هي نقطة البداية؛ فالإزاحة صفر."}, {"q": "سبّاح يقطع 100 م في 56 ث. ما سرعته؟", "o": ["0.56 م/ث", "1.8 م/ث", "5.6 م/ث", "56 م/ث"], "a": 1, "ex": "ع = 100 ÷ 56 ≈ 1.8 م/ث."}, {"q": "وحدة قياس السرعة في النظام الدولي:", "o": ["كم/س", "م/ث", "م/ث²", "كجم.م/ث"], "a": 1, "ex": "متر لكل ثانية، ويمكن قياسها بالكيلومتر لكل ساعة."}, {"q": "قافلة تقطع 1400 كم في 12 ساعة. ما متوسط سرعتها؟", "o": ["116.7 كم/س", "1412 كم/س", "16800 كم/س", "11.7 كم/س"], "a": 0, "ex": "1400 ÷ 12 ≈ 116.7 كم/س."}, {"q": "السرعة المتوسطة = ", "o": ["المسافة الكلية ÷ الزمن الكلي", "الزمن ÷ المسافة", "المسافة × الزمن", "السرعة النهائية − الابتدائية"], "a": 0, "ex": "تُحسب بقسمة المسافة الكلية على الزمن الكلي."}, {"q": "تكون السرعة المتوسطة مساوية للسرعة اللحظية عندما:", "o": ["تتزايد السرعة", "تكون السرعة ثابتة", "يتوقف الجسم ثم يتحرك", "تتناقص السرعة"], "a": 1, "ex": "إذا لم تتغير السرعة فهي في كل لحظة مساوية لمتوسطها."}, {"q": "متسلقان سرعة كل منهما 1.5 م/ث، أحدهما غربًا والآخر جنوبًا. ماذا تستنتج؟", "o": ["سرعتهما المتجهة متساوية", "مقدار سرعتيهما متساوٍ لكن سرعتيهما المتجهتين مختلفتان", "سرعتهما مختلفة", "كلاهما ساكن"], "a": 1, "ex": "السرعة المتجهة تتضمن الاتجاه (الشكل 5)."}, {"q": "سيارة تسير 40 كم/س شمالًا ثم انعطفت يسارًا بالسرعة نفسها. ماذا تغيّر؟", "o": ["مقدار السرعة", "السرعة المتجهة فقط", "لا شيء", "الكتلة"], "a": 1, "ex": "تغيّر الاتجاه فتغيّرت السرعة المتجهة رغم ثبات المقدار."}, {"q": "في منحنى المسافة–الزمن، الطالب (أ) قطع 1 م في 1 ث والطالب (ب) 0.5 م في 1 ث. أيهما أسرع؟", "o": ["ب", "أ", "متساويان", "لا يمكن التحديد"], "a": 1, "ex": "سرعة أ = 1 م/ث، وسرعة ب = 0.5 م/ث، وخط أ أشد ميلًا."}, {"q": "ماذا يعني خط أفقي في منحنى المسافة–الزمن؟", "o": ["سرعة كبيرة", "الجسم لم يغيّر موضعه وسرعته صفر", "تسارع", "سرعة ثابتة كبيرة"], "a": 1, "ex": "المسافة لا تتغير مع الزمن."}, {"q": "(نافس) عدّاء قطع 400 م في 43.9 ث، و100 م في 10.4 ث. في أي سباق كان أسرع؟", "o": ["سباق 400 م", "سباق 100 م", "متساويان", "لا يمكن الحكم"], "a": 1, "ex": "400 ÷ 43.9 ≈ 9.11 م/ث، و100 ÷ 10.4 ≈ 9.62 م/ث."}, {"q": "(نافس) طائرة تقطع 650 كم بسرعة متوسطة 300 كم/س. كم تستغرق؟", "o": ["0.46 ساعة", "2.17 ساعة", "950 ساعة", "19.5 ساعة"], "a": 1, "ex": "ز = ف ÷ ع = 650 ÷ 300 ≈ 2.17 ساعة."}], "tf": [["المسافة المقطوعة والإزاحة متساويتان دائمًا.", false, "في الدورة الكاملة المسافة 140 م والإزاحة صفر."], ["لتحديد حركة جسم نحتاج إلى نقطة مرجعية.", true, "الحركة تغيّر في الموضع بالنسبة إلى نقطة إسناد."], ["السرعة تقاس دائمًا بوحدة كيلومتر لكل ساعة.", false, "وحدتها في النظام الدولي م/ث، ويمكن قياسها بـ كم/س."], ["السرعة اللحظية تساوي دائمًا السرعة المتوسطة.", false, "تتساويان فقط عندما يتحرك الجسم بسرعة ثابتة."], ["السرعة والسرعة المتجهة يعبّران عن الشيء نفسه.", false, "السرعة المتجهة تتضمن الاتجاه أيضًا."], ["الخط الأفقي في منحنى المسافة–الزمن يعني أن السرعة صفر.", true, "الجسم لم يغيّر موضعه."], ["كلما زاد ميل خط المسافة–الزمن زادت السرعة.", true, "الطالب (أ) أسرع لأن ميل خطه أكبر."], ["8 م/ث شرقًا سرعة متجهة.", true, "تتضمن المقدار والاتجاه."]], "cover": "../img/cover-g9s2-c9-l1.webp", "file": "../lessons/g9s2-c9-l1.html", "sheet": "sheet-g9s2-c9-l1.html"}, {"id": "g9s2-c9-l2", "no": 2, "title": "التسارع", "summary": "يحدث التسارع عند زيادة أو إبطاء سرعة الجسم أو تغيير اتجاهه.", "goals": ["تعرّف التسارع.", "تتوقّع تأثير التسارع في الحركة.", "تحسب تسارع الجسم."], "terms": [{"t": "التسارع", "d": "التغيّر في سرعة الجسم المتجهة مقسومًا على الزمن الذي حدث فيه هذا التغير: ت = (ع٢ − ع١) ÷ ز."}, {"t": "التسارع الموجب", "d": "تسارع في اتجاه الحركة نفسه عندما تتزايد سرعة الجسم."}, {"t": "التسارع السالب (التباطؤ)", "d": "تسارع في عكس اتجاه الحركة عندما تتناقص سرعة الجسم."}, {"t": "منحنى السرعة–الزمن", "d": "رسم بياني محوره الرأسي السرعة والأفقي الزمن، يُستخدم لإيجاد التسارع."}], "concepts": [{"n": "تعريف التسارع", "t": "التغير في السرعة المتجهة ÷ الزمن، وله مقدار واتجاه."}, {"n": "تسريع الأجسام", "t": "زيادة السرعة: السيارة اللعبة 10 ثم 20 ثم 30 سم/ث."}, {"n": "تباطؤ الأجسام", "t": "نقصان السرعة: تسارع في عكس اتجاه الحركة."}, {"n": "تغيّر الاتجاه", "t": "الحركة في مسار منحنٍ تسارع حتى لو بقي مقدار السرعة ثابتًا."}, {"n": "حساب التسارع", "t": "ت = (ع٢ − ع١) ÷ ز، ووحدته م/ث²."}, {"n": "موجب وسالب", "t": "تزايد السرعة: موجب. تناقصها: سالب (تباطؤ)."}, {"n": "منحنى السرعة–الزمن", "t": "صاعد: تسارع موجب. نازل: سالب. أفقي: تسارع صفر."}], "qs": [{"q": "التسارع هو:", "o": ["المسافة ÷ الزمن", "التغير في السرعة المتجهة ÷ الزمن", "الكتلة × السرعة", "الإزاحة ÷ الزمن"], "a": 1, "ex": "ت = (ع٢ − ع١) ÷ ز."}, {"q": "أي الأجسام الآتية لا يتسارع؟", "o": ["طائرة تطير بسرعة ثابتة في خط مستقيم", "دراجة تخفض سرعتها", "سيارة تنعطف", "صاروخ ينطلق"], "a": 0, "ex": "سرعتها المتجهة لا تتغير."}, {"q": "سيارة لعبة سرعتها 10 ثم 20 ثم 30 سم/ث في نهاية كل ثانية. حركتها:", "o": ["بسرعة ثابتة", "متسارعة", "متباطئة", "ساكنة"], "a": 1, "ex": "السرعة تزداد بانتظام: تسارع موجب في اتجاه الحركة."}, {"q": "عند الضغط على مكابح الدراجة يكون التسارع:", "o": ["في اتجاه الحركة", "في عكس اتجاه الحركة", "صفرًا", "نحو الأعلى دائمًا"], "a": 1, "ex": "السرعة تتناقص فالتسارع سالب."}, {"q": "حافلة تغيرت سرعتها من 6 إلى 12 م/ث خلال 3 ثوانٍ. تسارعها:", "o": ["2 م/ث²", "6 م/ث²", "18 م/ث²", "0.5 م/ث²"], "a": 0, "ex": "(12 − 6) ÷ 3 = 2 م/ث²."}, {"q": "قطار تزايدت سرعته من 7 إلى 17 م/ث خلال 120 ث. تسارعه تقريبًا:", "o": ["0.083 م/ث²", "1.2 م/ث²", "10 م/ث²", "12 م/ث²"], "a": 0, "ex": "(17 −
