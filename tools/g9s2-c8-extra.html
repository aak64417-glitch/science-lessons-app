 {"q": "ينص قانون حفظ الكتلة على أن:", "o": ["كتلة النواتج أكبر من كتلة المتفاعلات", "كتلة النواتج تساوي كتلة المتفاعلات", "الذرات تفنى في التفاعل", "الكتلة تتحول إلى طاقة"], "a": 1, "ex": "عدد الذرات ونوعها متساوٍ في طرفي المعادلة؛ فالكتلة محفوظة."}, {"q": "ما المعادلة الموزونة لتفاعل الميثان مع الأكسجين؟", "o": ["CH₄ + O₂ → CO₂ + H₂O", "CH₄ + 2O₂ → CO₂ + 2H₂O", "CH₄ + O₂ → CO₂ + 2H₂O", "2CH₄ + O₂ → CO₂ + H₂O"], "a": 1, "ex": "في الطرفين: ذرة C و4 ذرات H و4 ذرات O."}, {"q": "عند موازنة المعادلة Ag + H₂S → Ag₂S + H₂ نضع:", "o": ["2 أمام Ag", "2 أمام H₂S", "نغير Ag₂S إلى AgS", "2 أمام H₂"], "a": 0, "ex": "في النواتج ذرتا فضة، فنضع المعامل 2 أمام Ag."}, {"q": "لماذا لا نغيّر الأرقام السفلية عند الموازنة؟", "o": ["لأنها تغيّر نوع المركب", "لأنها صغيرة", "لأنها تغير الكتلة فقط", "لأنها تمثل الطاقة"], "a": 0, "ex": "تغيير الرقم السفلي يغيّر صيغة المادة نفسها، فنغير المعاملات فقط."}, {"q": "‪2H₂ + O₂ → 2H₂O + طاقة‬. هذا التفاعل:", "o": ["ماص للحرارة", "طارد للحرارة", "لا يتضمن طاقة", "تغير فيزيائي"], "a": 1, "ex": "كتابة الطاقة مع النواتج تعني أنها تتحرر: طارد للحرارة."}, {"q": "‪2H₂O + طاقة → 2H₂ + O₂‬ (التحليل الكهربائي للماء). هذا التفاعل:", "o": ["طارد للحرارة", "ماص للطاقة", "احتراق", "تجمد"], "a": 1, "ex": "الطاقة مع المتفاعلات تعني أنها ضرورية لحدوثه: ماص."}, {"q": "مثال على تحرير بطيء للطاقة الحرارية:", "o": ["ولاعة الفحم", "صدأ الحديد", "لهب اللحام", "الألعاب النارية"], "a": 1, "ex": "يتحد الحديد مع أكسجين الهواء ببطء لتكوين الصدأ، فتنطلق الحرارة ببطء لا نشعر بها."}, {"q": "كيف تخفّض الكمادات الباردة حرارة العضو المصاب؟", "o": ["تطلق حرارة", "يذوب فيها نترات الأمونيوم فيمتص حرارة من الجلد", "تحترق ببطء", "تتجمد"], "a": 1, "ex": "ذوبان نترات الأمونيوم في الماء عملية ماصة للحرارة."}, {"q": "(نافس) تُترك شرائح التفاح فيتحول لونها إلى البني. ما نوع هذا التغير؟", "o": ["فيزيائي لأن الشكل لم يتغير", "كيميائي لتفاعل التفاح مع الأكسجين", "فيزيائي لأن الكتلة لم تتغير", "لا يحدث أي تغير"], "a": 1, "ex": "الجدول 1: شريحة تفاح + أكسجين ← تحول للون البني؛ تغيّر اللون دليل تفا
