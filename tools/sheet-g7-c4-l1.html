<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: تركيب المادة</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#6D4BE0", "color2": "#EEE9FD", "lesson": {"id": "g7-c4-l1", "title": "تركيب المادة", "no": 1, "chapter": "الفصل الرابع: الذرات والعناصر والجدول الدوري", "chapterShort": "الفصل الرابع", "goals": ["تصف خصائص المادة.", "تتعرف مكونات المادة.", "تقارن بين النماذج الذرية المختلفة."]}, "sheet": {"idea": "تتكوّن الذرات من بروتونات ونيوترونات في نوى صغيرة، تدور حولها سحابة من الإلكترونات.", "terms": [{"t": "المادة", "d": "كل ما له كتلة ويشغل حيزًا من الفراغ."}, {"t": "الذرة", "d": "أصغر جزء من المادة، وتتكون من البروتونات والنيوترونات والإلكترونات."}, {"t": "قانون حفظ الكتلة", "d": "المادة لا تفنى ولا تُستحدث، وإنما تتحول من شكل إلى آخر."}, {"t": "الإلكترون", "d": "جسيم سالب الشحنة يوجد حول النواة."}], "mcq": [{"q": "أي مما يلي ليس مادة؟", "o": ["الهواء", "الضوء", "الخشب", "الماء"], "a": 1, "ex": "الضوء ليس له كتلة ولا يشغل حيزًا."}, {"q": "تصوّر دالتون الذرة على أنها:", "o": ["مستويات طاقة", "سحابة إلكترونية", "نواة يحيط بها فراغ", "كرة مصمتة متجانسة"], "a": 3, "ex": "نموذج دالتون."}, {"q": "ما البروتون؟", "o": ["جسيم في النواة شحنته موجبة", "جسيم يدور حول النواة شحنته موجبة", "جسيم في النواة شحنته سالبة", "جسيم في النواة متعادل الشحنة"], "a": 0, "ex": "البروتون موجب الشحنة داخل النواة."}, {"q": "استنتج رذرفورد من تجربة صفيحة الذهب أن:", "o": ["الذرة كرة مصمتة", "معظم حجم الذرة فراغ، وفي مركزها نواة صغيرة موجبة", "الإلكترونات داخل النواة", "الذرة لا تحتوي على شحنات"], "a": 1, "ex": "نفاذ معظم جسيمات ألفا دلّ على أن معظم الذرة فراغ."}], "apply": [{"type": "classify", "title": "صنّف: مادة أم ليس مادة؟", "hint": "(٦ درجات)", "keys": ["مادة", "ليس مادة"], "codes": ["م", "×"], "items": [["الهواء", 0], ["الضوء", 1], ["الماء", 0], ["الحرارة", 1], ["الخشب", 0], ["النبات", 0]]}, {"type": "order", "title": "رتّب النماذج الذرية من الأقدم إلى الأحدث بكتابة الرقم (١–٥)", "hint": "(٥ درجات)", "items": ["نموذج دالتون", "نموذج طومسون", "نموذج رذرفورد", "نموذج بور", "نموذج السحابة الإلكترونية"]}], "tf": [["الهواء مادة؛ لأن له كتلة ويشغل حيزًا.", true, "صحيح."], ["النيوترون جسيم سالب الشحنة يوجد داخل النواة.", false, "النيوترون متعادل الشحنة."], ["تتغيّر النماذج العلمية عندما تظهر أدلة جديدة من التجارب.", true, "مثل الأشعة المهبطية وصفيحة الذهب."]], "think": {"q": "إذا شربت كل الماء الذي في الزجاجة، فهل تصبح فارغة تمامًا؟", "a": "لا تصبح فارغة؛ فداخلها هواء، والهواء مادة له كتلة ويشغل حيزًا من الفراغ."}, "total": 24}};</script><script src="kit.js"></script></body></html>
