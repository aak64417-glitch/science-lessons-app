, "ex": "النظرية العلمية تفسير مدعوم بالملاحظات والاستقصاءات."}, {"q": "أي مهارتين تساعدان العلماء على جمع معلومات مباشرة؟", "o": ["الملاحظة والقياس", "التخمين والتجاهل", "الحفظ والنسخ", "الرأي والتفضيل"], "a": 0, "ex": "الملاحظة والقياس من المهارات الأساسية لجمع البيانات."}, {"q": "أي فرع من العلوم يهتم بدراسة المخلوقات الحية وطرق تفاعلها مع بعضها؟", "o": ["علم الأحياء", "علم الأرض والفضاء", "علم الفيزياء", "علم الكيمياء"], "a": 0, "ex": "علم الأحياء يختص بدراسة المخلوقات الحية وتفاعلاتها."}, {"q": "أي فرع من العلوم يدرس أنظمة الأرض والفضاء؟", "o": ["علم الأرض والفضاء", "علم الأحياء", "علم الكيمياء", "علم الفيزياء"], "a": 0, "ex": "علم الأرض والفضاء يدرس أنظمة الأرض والفضاء ومكوناتها."}, {"q": "أي علم من العلوم الطبيعية يهتم بدراسة المادة وتفاعلاتها؟", "o": ["الكيمياء", "الأحياء", "علم الأرض والفضاء", "الفلك فقط"], "a": 0, "ex": "الكيمياء من العلوم الطبيعية وتهتم بدراسة المادة وتفاعلاتها."}, {"q": "أي علم من العلوم الطبيعية يهتم بالطاقة ودورها وقدرتها على إحداث تغير في المادة؟", "o": ["الفيزياء", "الأحياء", "الكيمياء فقط", "علم الأرض"], "a": 0, "ex": "الفيزياء تهتم بدراسة الطاقة ودورها وقدرتها على إحداث تغير في المادة."}, {"q": "في تجربة لاختبار أثر كمية الماء في نمو النبات، ما المتغير المستقل؟", "o": ["كمية الماء", "طول النبات", "نوع النبات إذا بقي ثابتًا", "حجم الأصيص إذا لم يتغير"], "a": 0, "ex": "المتغير المستقل هو العامل الذي يغيّره الباحث عمدًا أثناء التجربة."}, {"q": "في تجربة أثر كمية الماء في نمو النبات، ما المتغير التابع؟", "o": ["طول النبات بعد مدة محددة", "كمية الماء", "نوع النبات إذا بقي ثابتًا", "نوع التربة إذا لم يتغير"], "a": 0, "ex": "المتغير التابع هو العامل الذي يتغير بسبب تغير المتغير المستقل ويُقاس أثناء التجربة."}, {"q": "أي ممارسة علمية تعني توقع ما قد يحدث اعتمادًا على المعرفة والملاحظات؟", "o": ["التنبؤ", "الإعلان", "الحفظ", "التفضيل"], "a": 0, "ex": "التنبؤ من المهارات العلمية التي يستخدمها العلماء."}, {"q": "أي عبارة صحيحة عند مقارنة النظرية العلمية بالقانون العلمي؟", "o": ["النظرية تفسر، والقانون يصف نمطًا أو سلوكًا", "القانون يفسر دائمًا والنظرية تصف فقط", "كلاهما رأي شخصي", "لا يعتمد أي منهما على الملاحظات"], "a": 0, "ex": "النظرية العلمية تحاول تفسير سلوك أو نمط لوحظ في الطبيعة، أما القانون العلمي فيصف نمطًا أو سلوكًا يحدث فيها."}, {"q": "العبارة: «كلما ازدادت درجة الحرارة ازدادت حركة جزيئات المادة» صُنفت في تدريب الدرس على أنها:", "o": ["قانون علمي", "نظرية علمية", "فرضية", "ثابت"], "a": 0, "ex": "في تدريب الدرس وردت هذه العبارة مثالًا على القانون العلمي."}, {"q": "بعد تدوين الملاحظات ووضع التوقعات، إلى ماذا يقود التوقع في الاستقصاء؟", "o": ["وضع الفرضيات", "إلغاء السؤال", "تغيير جميع الثوابت", "الاستنتاج النهائي مباشرة"], "a": 0, "ex": "يوضح الدرس أن التوقع يقود إلى وضع الفرضيات."}]}};</script><script src="modes.js"></script><script src="games.js"></script><script src="kit.js"></script></body></html>
