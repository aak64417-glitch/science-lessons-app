تلي = عدد البروتونات + عدد النيوترونات", "hint": "(٤ درجات)", "items": [{"q": "ذرة كربون فيها 6 بروتونات و6 نيوترونات. ما عددها الكتلي؟", "a": "العدد الكتلي = 6 + 6 = 12"}, {"q": "ذرة ألمنيوم عددها الذري 13 وعددها الكتلي 27. كم نيوترونًا في نواتها؟", "a": "عدد النيوترونات = 27 − 13 = 14"}]}, {"type": "classify", "title": "صنّف: مركب أم مخلوط متجانس أم مخلوط غير متجانس؟", "hint": "(٦ درجات)", "keys": ["مركب", "مخلوط متجانس", "مخلوط غير متجانس"], "codes": ["م", "ت", "غ"], "items": [["الملح", 0], ["الهواء", 1], ["البيتزا", 2], ["الماء", 0], ["عصير الليمون", 1], ["سلطة الفواكه", 2]]}], "tf": [["أشباه الفلزات عناصر لها بعض خواص الفلزات وبعض خواص اللافلزات.", true, "صحيح."], ["يتكون معظم جسم الإنسان من الفلزات.", false, "معظم جسم الإنسان من عناصر لافلزية."], ["إذا تغيرت نسب مكونات المخلوط فإنه يبقى مخلوطًا من النوع نفسه.", true, "السلطة تبقى سلطة مهما تغيرت نسبة مكوناتها."]], "think": {"q": "الماء ومعقّم الجروح كلاهما من الهيدروجين والأكسجين، فلماذا يختلفان تمامًا؟", "a": "لأن عدد الذرات المتحدة مختلف: الماء H₂O، أما معقم الجروح (فوق أكسيد الهيدروجين) H₂O₂؛ فالصيغة الكيميائية تحدد نوع المركب."}, "total": 23}};</script><script src="kit.js"></script></body></html>
