توكندريا."}, {"q": "تسمى الصبغة النباتية الخضراء التي تمتص الطاقة الضوئية من الشمس:", "o": ["البروتينات", "الجلوكوز", "الإنزيمات", "الكلوروفيل"], "a": 3, "ex": "الكلوروفيل."}], "apply": [{"type": "classify", "title": "صنّف: نقل سلبي أم نقل نشط؟", "hint": "(٦ درجات)", "keys": ["نقل سلبي", "نقل نشط"], "codes": ["س", "ن"], "items": [["الانتشار", 0], ["الخاصية الأسموزية", 0], ["الانتشار المدعوم", 0], ["يحتاج إلى طاقة", 1], ["يستخدم البروتينات الناقلة مع الطاقة", 1], ["انتقال الأملاح إلى الشعيرات الجذرية", 1]]}, {"type": "calc", "title": "اكتب المعادلة اللفظية", "hint": "(٤ درجات)", "items": [{"q": "معادلة البناء الضوئي:", "a": "ثاني أكسيد الكربون + ماء + طاقة ضوئية ← جلوكوز + أكسجين"}, {"q": "معادلة التنفس الخلوي:", "a": "جلوكوز + أكسجين ← ثاني أكسيد الكربون + ماء + طاقة"}]}], "tf": [["الانتشار والخاصية الأسموزية والانتشار المدعوم أمثلة على النقل السلبي.", true, ""], ["يحتاج النقل السلبي إلى طاقة.", false, "النقل السلبي لا يحتاج إلى طاقة، أما النقل النشط فيحتاج إليها."], ["تحتاج عملية التخمر إلى الأكسجين.", false, "التخمر ينتج الطاقة دون استخدام الأكسجين."]], "think": {"q": "لماذا تذبل أوراق الخس إذا رُشّ عليها الملح؟", "a": "تنتقل جزيئات الماء بالخاصية الأسموزية من داخل خلايا الخس، حيث تركيز الماء أعلى، إلى الخارج حيث تركيز الماء أقل، فتفقد الخلايا ماءها وتذبل."}, "total": 23}};</script><script src="kit.js"></script></body></html>
