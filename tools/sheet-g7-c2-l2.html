<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: قوانين نيوتن للحركة</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#E2662B", "color2": "#FDEDE4", "lesson": {"id": "g7-c2-l2", "title": "قوانين نيوتن للحركة", "no": 2, "chapter": "الفصل الثاني: الحركة والقوى والآلات البسيطة", "chapterShort": "الفصل الثاني", "goals": ["تصف القوة وتمثّلها بالأسهم وتقيسها بوحدة النيوتن.", "تحسب القوة المحصلة وتميّز القوى المتزنة من غير المتزنة.", "تفسّر القانون الأول لنيوتن والقصور الذاتي والاحتكاك.", "تطبّق القانون الثاني لنيوتن لحساب التسارع والقوة.", "تفسّر قوتي الفعل ورد الفعل في القانون الثالث لنيوتن."]}, "sheet": {"idea": "لا تتغير حالة الجسم الحركية ما لم تؤثر فيه قوة محصلة، والتسارع = القوة المحصلة ÷ الكتلة.", "terms": [{"t": "القوة", "d": "دفع أو سحب. رمزها (ق) ووحدتها النيوتن، وتغيّر شكل الجسم أو حجمه أو موضعه أو اتجاه حركته."}, {"t": "القوة المحصلة", "d": "قوة تعمل عمل عدة قوى؛ هي اتحاد جميع القوى المؤثرة في الجسم."}, {"t": "القوى المتزنة", "d": "قوى تؤثر في جسم ولا تحرّكه؛ محصلتها صفر."}, {"t": "القوى غير المتزنة", "d": "قوى محصلتها لا تساوي صفرًا، فتغيّر حركة الجسم."}], "mcq": [{"q": "عندما تدفع الحائط يدفعك الحائط. هذا هو:", "o": ["القصور الذاتي", "القانون الثالث", "القانون الثاني", "القانون الأول"], "a": 1, "ex": ""}, {"q": "في الفضاء يفلت مفكّ من يد رائد الفضاء فيستمر مبتعدًا. هذا يفسّره:", "o": ["الاحتكاك", "القانون الأول", "القانون الثاني", "القانون الثالث"], "a": 1, "ex": ""}, {"q": "كلما زادت الكتلة مع ثبات القوة، فإن التسارع:", "o": ["لا يتغير", "يزداد", "يصبح سالبًا", "يقل"], "a": 3, "ex": ""}, {"q": "تتحرك كرة إلى اليمين على أرضية خشنة. في أي اتجاه تؤثر قوة الاحتكاك؟", "o": ["إلى اليسار", "إلى اليمين", "إلى أعلى فقط", "لا اتجاه لها"], "a": 0, "ex": "الاحتكاك يعارض اتجاه الحركة، لذلك يكون إلى اليسار."}], "apply": [{"type": "calc", "title": "احسب: المعطيات ← القانون ← الحل", "hint": "(٦ درجات)", "items": [{"q": "قوتان 12 نيوتن و8 نيوتن تؤثران نحو اليمين. ما القوة المحصلة؟", "a": "تُجمع القوتان: 12 + 8 = 20 نيوتن نحو اليمين"}, {"q": "قوة 50 نيوتن نحو اليسار و80 نيوتن نحو اليمين. ما القوة المحصلة؟", "a": "تُطرح القوتان: 80 − 50 = 30 نيوتن نحو اليمين"}, {"q": "جسم كتلته 4 كجم تؤثر فيه قوة محصلة 12 نيوتن. ما تسارعه؟", "a": "ت = ق ÷ ك = 12 ÷ 4 = 3 م/ث²"}]}], "tf": [], "think": {"q": "ماذا يحدث للقطعة النقدية عندما نسحب البطاقة من تحتها بسرعة؟ ولماذا؟", "a": "تسقط القطعة النقدية في الكأس؛ لأنها تقاوم التغيير في حالتها الحركية (القصور الذاتي)، فلا تتحرك مع البطاقة السريعة. هذا هو القانون الأول لنيوتن: يبقى الجسم الساكن ساكنًا ما لم تؤثر فيه قوة محصلة."}, "total": 16}};</script><script src="kit.js"></script></body></html>
