<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: الفضاء والنجوم والمجرات</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#3F3CBB", "color2": "#E6E5F8", "lesson": {"id": "g7s2-c8-l2", "title": "الفضاء والنجوم والمجرات", "no": 2, "chapter": "الفصل الثامن: استكشاف الفضاء", "chapterShort": "الفصل الثامن", "goals": ["توضح المقصود بالطيف الكهرومغناطيسي.", "تحدد الفرق بين المنظار الفلكي العاكس والمنظار الفلكي الكاسر.", "تقارن بين المنظار الفلكي البصري والمنظار الراديوي.", "تفسر لماذا تبدو لنا النجوم وكأنها تتحرك في السماء.", "تصف بعض المجموعات النجمية.", "توضح دورة حياة النجوم."]}, "sheet": {"idea": "استكشاف الفضاء يساعدنا على فهم عالمنا بشكل أفضل، كما يساعدنا فهم اتساع الكون على تقدير موقع الأرض في الفضاء.", "terms": [{"t": "الطيف الكهرومغناطيسي", "d": "ترتيب الموجات الكهرومغناطيسية بحسب أطوالها الموجية."}, {"t": "المنظار الفلكي الكاسر", "d": "منظار يقوم على انكسار الضوء بعدسات محدبة."}, {"t": "المنظار الفلكي العاكس", "d": "منظار يقوم على انعكاس الضوء بمرآة مقعرة."}, {"t": "المرصد", "d": "مبنى على شكل قبة يحتوي على مناظير فلكية."}], "mcq": [{"q": "ما التفسير العلمي؟", "o": ["نرى النجم كما كان حين انطلق ضوءه قبل سنوات طويلة", "النجوم لا تتغير أبدًا", "الضوء ينتقل فورًا دون زمن", "الفلكي يمزح فقط"], "a": 0, "ex": "ضوء النجم يحتاج زمنًا طويلًا ليقطع المسافات الهائلة؛ فنحن نرى الماضي! ربما اختفى النجم وضوءه ما زال في الطريق إلينا."}, {"q": "أي أنواع المناظير يستخدم المرايا لتجميع الضوء؟", "o": ["الراديوي", "الكهرومغناطيسي", "الكاسر", "العاكس"], "a": 3, "ex": "العاكس: مرآة مقعرة تجمع الضوء وتكوّن الصورة."}, {"q": "أي المناظير يمكن استعماله ليلًا ونهارًا وفي الظروف الجوية السيئة؟", "o": ["الراديوي", "الكهرومغناطيسي", "الكاسر", "العاكس"], "a": 0, "ex": "الراديوي: موجات الراديو تعبر الغلاف الجوي دون أن تتأثر."}, {"q": "أضئ نور الغرفة… هل ستبقى ترى مجموعتك النجمية على السقف؟", "o": ["نعم بالوضوح نفسه", "لا أو بصعوبة", "تصبح أوضح", "تتحرك على السقف"], "a": 1, "ex": "ضوء الغرفة الساطع يطغى على النقاط الخافتة، كما يجعل ضوء الشمس الغلاف الجوي ساطعًا فيحجب ضوء النجوم نهارًا رغم وجودها في السماء."}], "apply": [{"type": "classify", "title": "صنّف: منظار كاسر أم عاكس أم راديوي؟", "hint": "(٦ درجات)", "keys": ["كاسر", "عاكس", "راديوي"], "codes": ["أ", "ب", "ج"], "items": [["عدسة شيئية محدبة", 0], ["يعتمد على انكسار الضوء", 0], ["مرآة مقعرة ومرآة مستوية", 1], ["يعتمد على انعكاس الضوء", 1], ["قرص مقعر ولاقط", 2], ["يعمل ليلًا ونهارًا وفي كل الظروف", 2]]}, {"type": "calc", "title": "احسب", "hint": "(٤ درجات)", "items": [{"q": "نجم يبعد ٢ سنة ضوئية. كم تريليون كيلومتر يبعد؟", "a": "٢ × ٩٫٥ = ١٩ تريليون كم."}, {"q": "احسب زمن وصول موجة راديو إلى القمر (٣٨٠٠٠٠ كم) بسرعة ٣ × ١٠⁸ م/ث (بالثانية).", "a": "٣٨٠٠٠٠ كم = ٣٫٨ × ١٠⁸ م ← الزمن = ٣٫٨ × ١٠⁸ ÷ ٣ × ١٠⁸ ≈ ١٫٢٧ ثانية."}]}], "tf": [["النجوم الحمراء أعلى النجوم حرارة.", false, "الزرقاء أعلاها حرارة، والحمراء أقلها."], ["موجات الصوت تنتقل في الفراغ مثل موجات الراديو.", false, "الصوت ينتقل في الأوساط المادية فقط."], ["كلما زادت كتلة النجم قلّت مدة حياته.", true, "عبارة صحيحة."]], "think": {"q": "يصل ضوء أقرب نجم إلى الأرض في ٤ سنوات؛ فما الزمن الذي تستغرقه رسالة راديو منه؟ وما الزمن الذي يحتاج إليه العلماء للرد؟ ولماذا قد نرى نجومًا اختفت منذ زمن بعيد؟", "a": "٤ سنوات للوصول (موجات الراديو تسير بسرعة الضوء)، والرد يحتاج ٤ سنوات أخرى؛ أي ٨ سنوات حتى يصلهم الرد. ونرى نجومًا اختفت لأن ضوءها انطلق منها قبل سنوات طويلة وما زال يصل إلينا."}, "total": 23}};</script><script src="kit.js"></script><style id="fw600">body{font-weight:600}p,li,td,dd,label,small,input,textarea,select,.hint,.explain,.step-text{font-weight:600}</style><script src="../pen.js" defer></script></body></html>
