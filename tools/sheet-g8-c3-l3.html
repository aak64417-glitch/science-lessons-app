ها؟ (ثم: هل تطفو في الماء؟)", "a": "١٠٫٠ ÷ ٤٫٦٠ = ٢٫١٧ جم/سم³ > ١٫٠٠ ← تنغمر العينة · التحقق: ٢٫١٧ × ٤٫٦٠ ≈ ١٠٫٠ جم."}]}], "tf": [], "think": {"q": "بعد سحب الهواء من علبة معدنية فارغة وإغلاقها بإحكام لوحظ أنها تهشمت تمامًا. لماذا؟", "a": "لأن الضغط داخلها أصبح ضئيلًا جدًّا فلم يعد يعادل الضغط الجوي الخارجي الكبير الذي سحقها."}, "total": 14}};</script><script src="kit.js"></script><style id="fw600">body{font-weight:600}p,li,td,dd,label,small,input,textarea,select,.hint,.explain,.step-text{font-weight:600}</style></body></html>
