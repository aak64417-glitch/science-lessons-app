<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الزخم والتصادمات — الألعاب التعليمية</title><meta name="theme-color" content="#0b1220"></head><body><script>window.GAME={"lesson": {"id": "g9s2-c9-l3", "title": "الزخم والتصادمات", "chapter": "الفصل التاسع: الحركة والزخم", "grade": "9"}, "qs": [{"q": "كمية المادة في الجسم تُسمّى:", "o": ["الوزن", "الكتلة", "الزخم", "السرعة"], "a": 1, "ex": "الكتلة ووحدتها الكيلوجرام."}, {"q": "ميل الجسم لمقاومة أي تغيير في حالته الحركية:", "o": ["الزخم", "القصور الذاتي", "التسارع", "السرعة"], "a": 1, "ex": "ويزداد القصور الذاتي بزيادة الكتلة."}, {"q": "لماذا يكون مضرب التنس الأرضي أكبر من مضرب تنس الطاولة؟", "o": ["لأن كرة التنس الأرضي كتلتها أكبر فتحتاج قوة أكبر", "لأن كرة تنس الطاولة أسرع", "للزينة فقط", "لأن الملعب أكبر فقط"], "a": 0, "ex": "لتغيير السرعة المتجهة بالمقدار نفسه يلزم ضرب الكرة الأكبر كتلة بقوة أكبر."}, {"q": "الزخم = ", "o": ["الكتلة ÷ السرعة", "الكتلة × السرعة المتجهة", "السرعة ÷ الزمن", "المسافة × الزمن"], "a": 1, "ex": "خ = ك × ع."}, {"q": "وحدة قياس الزخم:", "o": ["م/ث", "كجم.م/ث", "م/ث²", "كجم"], "a": 1, "ex": "كيلوجرام × متر لكل ثانية."}, {"q": "دراجة كتلتها 14 كجم تتحرك 2 م/ث شمالًا. زخمها:", "o": ["7 كجم.م/ث", "28 كجم.م/ث شمالًا", "16 كجم.م/ث", "12 كجم.م/ث"], "a": 1, "ex": "14 × 2 = 28 كجم.م/ث شمالًا."}, {"q": "قطار كتلته 10000 كجم يتحرك 15 م/ث شرقًا. زخمه:", "o": ["150000 كجم.م/ث شرقًا", "10015 كجم.م/ث", "666 كجم.م/ث", "1500 كجم.م/ث"], "a": 0, "ex": "10000 × 15 = 150000 كجم.م/ث شرقًا."}, {"q": "سيارة كتلتها 900 كجم تتحرك 27 م/ث شمالًا. زخمها:", "o": ["24300 كجم.م/ث شمالًا", "927 كجم.م/ث", "33.3 كجم.م/ث", "2430 كجم.م/ث"], "a": 0, "ex": "900 × 27 = 24300 كجم.م/ث شمالًا."}, {"q": "ينص قانون حفظ الزخم على أن الزخم الكلي لمجموعة أجسام:", "o": ["يزداد دائمًا", "يبقى ثابتًا ما لم تؤثر قوة خارجية", "يتلاشى بعد التصادم", "يساوي الكتلة"], "a": 1, "ex": "التصادمات بين الأجسام لا تغيّر الزخم الكلي."}, {"q": "لماذا تتباطأ كرة البلياردو البيضاء عندما تضرب كرة أخرى؟", "o": ["لأنها اكتسبت زخمًا", "لأنها نقلت جزءًا من زخمها إلى الكرة الأخرى", "لأن كتلتها زادت", "لأن الزخم يُستحدث"], "a": 1, "ex": "الزخم الذي تخسره يساوي الزخم الذي تكسبه الكرة الأخرى."}, {"q": "القوة الخارجية التي تنقص الزخم الكلي لكرات البلياردو:", "o": ["الجاذبية بين الكرات", "الاحتكاك مع الطاولة", "المغناطيسية", "لا توجد"], "a": 1, "ex": "الاحتكاك يبطئ الكرات فيقل الزخم الكلي."}, {"q": "عندما يتصادم لاعبان ويمسك كل منهما بالآخر، فهذا تصادم:", "o": ["ترتد فيه الأجسام", "تلتحم فيه الأجسام", "لا ينتقل فيه زخم", "بلا كتلة"], "a": 1, "ex": "يلتحمان ويتحركان معًا."}, {"q": "كرة 2 كجم بسرعة 5 م/ث شرقًا التقطها متزلج ساكن كتلته 48 كجم. سرعتهما معًا:", "o": ["5 م/ث", "0.2 م/ث شرقًا", "2.5 م/ث", "10 م/ث"], "a": 1, "ex": "10 = (2 + 48) × ع ← ع = 0.2 م/ث شرقًا."}, {"q": "جسمان متماثلان بالسرعة نفسها تصادما مباشرة وارتدّا. الزخم الكلي قبل وبعد:", "o": ["يتضاعف", "صفر", "يساوي زخم أحدهما", "لا يمكن تحديده"], "a": 1, "ex": "زخمان متساويان متعاكسان مجموعهما صفر."}, {"q": "(نافس) ما زخم كتلة 0.1 كجم تتحرك 5 م/ث غربًا؟", "o": ["0.5 كجم.م/ث غربًا", "50 كجم.م/ث", "0.02 كجم.م/ث", "5.1 كجم.م/ث"], "a": 0, "ex": "0.1 × 5 = 0.5 كجم.م/ث غربًا."}, {"q": "(نافس) كرة 1 كجم بسرعة 3 م/ث اصطدمت بكرة ساكنة 2 كجم فتوقفت الأولى. سرعة الثانية:", "o": ["3 م/ث", "1.5 م/ث", "6 م/ث", "1 م/ث"], "a": 1, "ex": "1 × 3 = 2 × ع ← ع = 1.5 م/ث."}]};</script><script src="arena.js"></script></body></html>
