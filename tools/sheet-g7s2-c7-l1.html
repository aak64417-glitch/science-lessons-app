من مياه الأرض؟", "o": ["الغلاف الجوي", "الأنهار والبحيرات", "المحيطات", "المياه الجوفية"], "a": 2, "ex": "المحيطات تضم ٩٧٫٢٪ من مياه الأرض."}, {"q": "متسلق جبل في منطقة استوائية لاحظ ثلوجًا على القمة. أي تفسير هو الأصح علميًا؟", "o": ["القمة أقرب إلى الشمس فهي أبرد", "الحرارة في التروبوسفير تقل مع الارتفاع", "الثلج يأتي من الستراتوسفير", "الضغط عند القمة أعلى"], "a": 1, "ex": "تقل الحرارة في التروبوسفير نحو ٦٫٥ °س لكل كيلومتر؛ فتكون القمم العالية باردة بما يكفي لتكوّن الثلوج."}], "apply": [{"type": "classify", "title": "صنّف: غاز أم هباء جوي؟", "hint": "(٦ درجات)", "keys": ["غازات الغلاف الجوي", "الهباء الجوي"], "codes": ["أ", "ب"], "items": [["النيتروجين", 0], ["الأكسجين", 0], ["الأرجون", 0], ["ثاني أكسيد الكربون", 0], ["الغبار", 1], ["أملاح البحر", 1]]}, {"type": "calc", "title": "احسب", "hint": "(٤ درجات)", "items": [{"q": "كان ارتفاع الماء في الحوض ٤ سم في اليوم الأول، وصار ٢٫٥ سم بعد ٣ أيام. كم سنتمترًا تبخر في المتوسط كل يوم؟", "a": "المتبخر = ٤ − ٢٫٥ = ١٫٥ سم، والمتوسط = ١٫٥ ÷ ٣ = ٠٫٥ سم كل يوم."}, {"q": "يتحرك الهواء من المناطق الباردة إلى المناطق الحارة. فإذا تحركت الرياح التي تشكلت مسافة ٢٠ كم في ساعتين، فما سرعتها؟", "a": "ع = ف ÷ ز = ٢٠ ÷ ٢ = ١٠ كم/ساعة"}]}], "tf": [["النيتروجين هو الغاز الأكثر توافرًا في الغلاف الجوي للأرض.", true, "نحو ٧٨٪ من الهواء نيتروجين."], ["يوجد أغلب أوزون الغلاف الجوي في طبقة التروبوسفير.", false, "يوجد أغلب الأوزون في طبقة الستراتوسفير."], ["توفر الشمس مصدر الطاقة اللازمة لدورة الماء في الطبيعة.", true, "الشمس مصدر الطاقة الرئيس لدورة الماء."]], "think": {"q": "قد نجد جبلًا عاليًا مغطى بالثلوج في المنطقة الاستوائية. لماذا؟", "a": "لأن درجة الحرارة في التروبوسفير تقل كلما ارتفعنا (نحو ٦٫٥ °س لكل كم)، فتكون قمة الجبل العالي باردة بما يكفي لتكوّن الثلوج رغم موقعه الاستوائي."}, "total": 23}};</script><script src="kit.js"></script><style id="fw600">body{font-weight:600}p,li,td,dd,label,small,input,textarea,select,.hint,.explain,.step-text{font-weight:600}</style></body></html>
