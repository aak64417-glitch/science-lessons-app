اق جسم ليدور حول الأرض:", "o": ["8 كم/ث", "8 م/ث", "330 م/ث", "1.5 كم/س"], "a": 0, "ex": "أي نحو 29000 كم/س."}, {"q": "يسقط جسم بسرعة ثابتة (السرعة الحدّية) عندما:", "o": ["تنعدم الجاذبية", "تتساوى مقاومة الهواء مع وزنه", "تزداد كتلته", "يزداد تسارعه"], "a": 1, "ex": "تصبح القوة المحصلة صفرًا فيصبح التسارع صفرًا."}, {"q": "(نافس) احسب القوة المحصلة المؤثرة في كرة بيسبول كتلتها 0.15 كجم تتحرك بتسارع 40.0 م/ث².", "o": ["6.0 نيوتن", "266 نيوتن", "40.15 نيوتن", "0.004 نيوتن"], "a": 0, "ex": "ق = 0.15 × 40.0 = 6.0 نيوتن."}, {"q": "(نافس) سحبت صندوقًا كتلته 10 كجم بقوة محصلة 5 نيوتن. تسارعه:", "o": ["50 م/ث²", "2 م/ث²", "0.5 م/ث²", "15 م/ث²"], "a": 2, "ex": "ت = 5 ÷ 10 = 0.5 م/ث²."}], "tf": [["عندما يتحرك الجسم فهو يقع تحت تأثير قوى غير متزنة.", false, "قد يتحرك بسرعة ثابتة والقوى متزنة."], ["القوة إما سحب أو دفع.", true, "هذا تعريف القوة."], ["قد يكون الجسم الساكن واقعًا تحت تأثير قوى عديدة.", true, "تكون متزنة ومحصلتها صفر."], ["الجسم الذي يتحرك في مسار دائري بسرعة ثابتة مقدارًا لا يتسارع.", false, "يتسارع لأن اتجاه حركته يتغير باستمرار."], ["قوة الاحتكاك التدحرجي أكبر عادة من قوة الاحتكاك الانزلاقي للسطحين نفسيهما.", false, "التدحرجي أقل كثيرًا؛ لذلك يسهل تحريك صندوق على عجلات."], ["كتلة الجسم تتغير بتغير المكان أما وزنه فثابت.", false, "العكس: الكتلة ثابتة والوزن يتغير."], ["تسحب الجاذبية كافة الأجسام التي لها كتلة.", true, "توجد قوة جاذبية بين أي جسمين."], ["يعتمد تسارع الصندوق على السرعة التي يتحرك بها.", false, "يعتمد على القوة المحصلة والكتلة فقط."]], "cover": "../img/cover-g9s2-c10-l1.webp", "file": "../lessons/g9s2-c10-l1.html", "sheet": "sheet-g9s2-c10-l1.html"}, {"id": "g9s2-c10-l2", "no": 2, "title": "القانون الثالث لنيوتن", "summary": "تؤثر القوى في صورة أزواج تتساوى مقدارًا، وتتعاكس اتجاهًا.", "goals": ["تحدّد العلاقة بين القوى التي تؤثر بها بعض الأجسام في بعض."], "terms": [{"t": "القانون الثالث لنيوتن في الحركة", "d": "لكل قوة فعل قوة رد فعل مساوية لها في المقدار ومعاكسة لها في الاتجاه."}, {"t": "أزواج الفعل ورد الفعل", "d": "القوتان اللتان يؤثر بهما جسمان
