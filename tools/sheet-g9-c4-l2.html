<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل: علم الوراثة</title><link rel="stylesheet" href="kit.css"></head><body><script>window.PAGE={"mode": "sheet", "color": "#6c3fd1", "color2": "#efe9ff", "lesson": {"id": "g9-c4-l2", "title": "علم الوراثة", "no": 2, "chapter": "الفصل الرابع: الوراثة", "chapterShort": "الفصل الرابع", "goals": ["تفسر كيف تورث الصفات.", "تتعرف دور العالم مندل في علم الوراثة.", "تستعمل مربع بانيت لتوقع نتائج التزاوج.", "تميز بين الطرز الجينية والطرز الشكلية."], "grade": "علوم الثالث المتوسط"}, "sheet": {"idea": "يساعد علم الوراثة على تفسير اختلاف الصفات بين الناس، ويُستعمل مربع بانيت لتوقع صفات الأبناء.", "terms": [{"t": "الهجين", "d": "مخلوق حي تكون فيه الجينات المتقابلة مختلفة في الصفة الوراثية."}, {"t": "العامل السائد", "d": "الجين الذي تظهر صفته، ويُرمز له بالحرف الكبير، مثل A."}, {"t": "الطرز الجينية", "d": "الشفرة الوراثية التي يملكها المخلوق الحي لصفة محددة، وهي حرفان، مثل Aa وaa وTT."}, {"t": "الطرز الشكلية", "d": "الصفات المظهرية للمخلوق الحي وسلوكه الناتجة عن الطرز الجينية، مثل: طويل نقي، أسود هجين."}], "mcq": [{"q": "الفرد الذي يحمل جينين متقابلين مختلفين لصفة واحدة:", "o": ["سائد", "نقي", "متماثل الجينات", "غير متماثل الجينات"], "a": 3, "ex": "هجين."}, {"q": "مؤسس علم الوراثة:", "o": ["فرانكلين", "مندل", "نيوتن", "واطسون"], "a": 1, "ex": "مندل."}, {"q": "العلم الذي يدرس كيفية توارث الصفات:", "o": ["علم الحياة", "علم الوراثة", "علم الاجتماع", "علم البيئة"], "a": 1, "ex": "علم الوراثة."}, {"q": "تظهر الصفة المتنحية عندما يكون الطراز الجيني:", "o": ["aa", "AA", "Aa", "A فقط"], "a": 0, "ex": "متماثل متنحٍ."}], "apply": [{"type": "classify", "title": "صنّف الطرز الجينية", "hint": "(٦ درجات)", "keys": ["متماثل الجينات", "غير متماثل الجينات"], "codes": ["م", "غ"], "items": [["AA", 0], ["Aa", 1], ["aa", 0], ["Bb", 1], ["rr", 0], ["Tt", 1]]}, {"type": "calc", "title": "استعمل مربع بانيت", "hint": "(٤ درجات)", "items": [{"q": "قط أسود Bb × قطة شقراء bb (الأسود سائد). ما احتمال ولادة قط أسود؟", "a": "Bb، Bb، bb، bb ← ٢ من ٤ = ٥٠٪"}, {"q": "بازلاء Yy × Yy (الأصفر سائد). ما احتمال البذور الصفراء؟", "a": "YY، ٢ Yy، yy ← ٣ من ٤ = ٧٥٪"}]}], "tf": [["يحمل الفرد لكل صفة وراثية جينًا واحدًا فقط.", false, "يحمل زوجًا من الجينات المتقابلة (الأليلات) لكل صفة؛ واحد من كل أب."], ["لا تظهر الصفة المتنحية إلا إذا كان الجينان المتقابلان متنحيين.", true, "مثل aa؛ فإذا وُجد الجين السائد اختفت صفتها."], ["الهجين مخلوق حي جيناته المتقابلة متماثلة.", false, "الهجين جيناته المتقابلة مختلفة في الصفة، مثل Aa."]], "think": {"q": "لقّح مندل نباتًا أخضر القرون بآخر أصفر القرون، فكانت قرون الجيل الأول كلها خضراء. أين ذهب اللون الأصفر؟", "a": "لم يختفِ؛ فجين اللون الأصفر متنحٍ اختبأ في النباتات الهجينة، ويظهر في الجيل التالي عندما يجتمع جينان متنحيان."}, "total": 23}};</script><script src="kit.js"></script></body></html>
