<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1f3a">
<title>مختبر قياس السرعة المتوسطة</title><style>:root{
  --navy:#0b1f3a;--navy2:#16335e;--cyan:#0891b2;--cyanL:#ddf4fa;--orange:#ea7a0c;--orangeL:#fff1db;
  --violet:#6d28d9;--violetL:#eee8fd;--green:#15803d;--greenL:#ddf7e5;--red:#b91c1c;--redL:#fde4e4;
  --text:#0f172a;--muted:#475569;--bg:#eef3f9;--card:#ffffff;--line:#cbd5e1;--gold:#f5b700;
  --accent:var(--cyan);--accentL:var(--cyanL);
  --fs:clamp(15px,min(1.9vw,2.75vh),25px);
  --hdr:clamp(52px,7.5vh,68px);--ftr:clamp(56px,8.5vh,74px);
  --r:16px;--sh:0 4px 14px rgba(11,31,58,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Segoe UI","Geeza Pro","Noto Kufi Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;font-weight:600;
  color:var(--text);font-size:var(--fs);direction:rtl;display:grid;grid-template-rows:var(--hdr) 1fr var(--ftr);height:100dvh;
  user-select:none;-webkit-user-select:none}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;touch-action:manipulation}
input,textarea,select{font:inherit;font-weight:600}
b,strong,h1,h2,h3{font-weight:800}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
sub,sup{font-size:.68em;line-height:0}
/* ---------- header */
header.top{display:flex;align-items:center;gap:.5em;padding:0 .7em;background:var(--navy);color:#fff;position:relative;z-index:30}
header.top .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05em;font-weight:800}
header.top .ttl small{color:#9fc6ec;font-weight:700;margin-inline-start:.4em;font-size:.8em}
.hbtn{background:#21416f;color:#fff;padding:.38em .8em;font-size:.82em;white-space:nowrap}
.hbtn.on{background:var(--gold);color:var(--navy)}
.prog{position:absolute;bottom:0;right:0;left:0;height:5px;background:#21416f}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
/* ---------- footer */
footer.nav{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:0 .8em;background:#fff;border-top:1px solid var(--line);z-index:20}
footer .nbtn{background:var(--navy);color:#fff;padding:.5em 1.3em;font-size:1em;min-width:6.5em}
footer .nbtn.next{background:var(--accent)}
footer .nbtn:disabled{opacity:.35}
footer .count{color:var(--muted);font-weight:800}
footer .phase{background:var(--accentL);color:var(--accent);border-radius:99px;padding:.2em .8em;font-size:.8em;font-weight:800}
/* ---------- screens */
main{position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:clamp(8px,1.6vh,18px) clamp(10px,2vw,26px);display:none;flex-direction:column;gap:clamp(6px,1.2vh,14px);overflow:hidden}
.screen.active{display:flex;animation:fadeIn .35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen>h2{margin:0;font-size:1.45em;color:var(--navy);display:flex;align-items:center;gap:.4em;flex:none}
.screen>h2 .tag{font-size:.55em;background:var(--accent);color:#fff;border-radius:99px;padding:.15em .7em}
.body{flex:1;min-height:0;display:grid;gap:clamp(8px,1.4vh,16px)}
.cols{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2-1{grid-template-columns:1.35fr 1fr}
.cols-1-2{grid-template-columns:1fr 1.35fr}
.rows{grid-template-rows:auto 1fr}
@media (orientation:portrait){.cols,.cols-2-1,.cols-1-2{grid-template-columns:1fr;grid-template-rows:minmax(0,.85fr) minmax(0,1.15fr)}.cols-3{grid-template-columns:1fr 1fr}.lab-split{grid-template-rows:minmax(0,1fr) auto!important}.lab-split .grid{grid-auto-rows:2.6em!important}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(8px,1.5vh,18px) clamp(10px,1.4vw,20px);min-height:0;overflow:hidden;position:relative}
.card h3{margin:0 0 .3em;color:var(--accent);font-size:1.1em}
.card p{margin:.2em 0;line-height:1.55}
.tint{background:var(--accentL)}
.big{font-size:1.25em;line-height:1.5}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.muted{color:var(--muted)}
.ok{color:var(--green)}.bad{color:var(--red)}
.pill{display:inline-block;border-radius:99px;padding:.15em .8em;font-weight:800;font-size:.85em}
.btn{background:var(--accent);color:#fff;padding:.5em 1.1em}
.btn.alt{background:#e2e8f0;color:var(--navy)}
.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.navy{background:var(--navy)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.list{margin:0;padding-inline-start:1.1em;line-height:1.6}
.list li{margin:.15em 0}
img.ph{width:100%;height:100%;object-fit:cover;border-radius:var(--r);display:block;min-height:0}
.imgbox{min-height:0;overflow:hidden;border-radius:var(--r);box-shadow:var(--sh);position:relative}
.imgbox img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;bottom:0;right:0;left:0;background:rgba(11,31,58,.78);color:#fff;padding:.35em .7em;font-size:.82em}
svg text{font-family:inherit;font-weight:700}
/* hero */
.hero{position:relative;flex:1;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);min-height:0}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .over{position:absolute;right:3%;left:3%;bottom:4%;background:rgba(11,31,58,.86);color:#fff;border-radius:var(--r);padding:clamp(10px,2vh,22px) clamp(12px,2vw,28px)}
.hero .over h3{margin:0 0 .3em;color:var(--gold);font-size:1.35em}
.hero .over p{margin:.2em 0;font-size:1.1em;line-height:1.5}
/* ---------- widgets */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.2vh,12px)}
@media (orientation:portrait){.opts{grid-template-columns:1fr}}
.opt{background:#fff;border:3px solid var(--line);color:var(--text);text-align:right;padding:.55em .8em;display:flex;align-items:center;gap:.6em;font-weight:700;border-radius:14px;line-height:1.35}
.opt .lt{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.9em}
.opt.right{border-color:var(--green);background:var(--greenL)}
.opt.wrong{border-color:var(--red);background:var(--redL);animation:shake .35s}
body.teacher .opt[data-c="1"]:not(.right){outline:3px dashed var(--green);outline-offset:-7px}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{border-radius:12px;padding:.5em .8em;line-height:1.5;display:none}
.fb.show{display:block;animation:fadeIn .3s}
.fb.good{background:var(--greenL);color:#14532d;border:2px solid var(--green)}
.fb.poor{background:var(--orangeL);color:#7c2d12;border:2px solid var(--orange)}
.q{font-size:1.15em;font-weight:800;color:var(--navy);line-height:1.45}
.ans{display:none;background:var(--greenL);border:2px solid var(--green);border-radius:12px;padding:.45em .8em;line-height:1.5;margin-top:.4em}
.ans.show{display:block;animation:fadeIn .3s}
body.teacher .ans.tshow{display:block}
.revbtn{background:var(--green);color:#fff;padding:.35em .9em;font-size:.85em}
textarea.think{width:100%;border:2px solid var(--line);border-radius:12px;padding:.4em .6em;resize:none;height:2.6em;background:#f8fafc}
body.teacher textarea.think{display:none}
/* chips & drop zones */
.chip{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid var(--accent);color:var(--navy);border-radius:12px;padding:.35em .75em;margin:.2em;font-weight:800;touch-action:none;cursor:grab;line-height:1.3;text-align:center}
.chip.sel{background:var(--gold);border-color:var(--gold)}
.chip.ok{border-color:var(--green);background:var(--greenL)}
.chip.no{border-color:var(--red);background:var(--redL)}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.zone{border:3px dashed var(--line);border-radius:14px;padding:.3em;min-height:2.6em;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;transition:.2s}
.zone.hot{border-color:var(--accent);background:var(--accentL)}
.zone h4{width:100%;margin:0 0 .2em;text-align:center;color:var(--navy)}
.bank{min-height:3em;background:#f8fafc}
/* tf */
.tfrow{display:grid;grid-template-columns:1fr auto;gap:.5em;align-items:center;background:#fff;border-radius:12px;padding:.35em .6em;border:2px solid var(--line)}
.tfrow .tfb button{width:2.4em;height:2.2em;margin-inline-start:.25em;background:#e2e8f0;color:var(--navy)}
.tfrow .tfb button.pick{background:var(--navy);color:#fff}
.tfrow.right{border-color:var(--green);background:var(--greenL)}
.tfrow.wrong{border-color:var(--red);background:var(--redL)}
.tfrow .why{grid-column:1/-1;font-size:.85em;display:none}
.tfrow.done .why{display:block}
/* strip */
.strip{background:#1e1e24;border-radius:12px;padding:1.4em .6em;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.5em;position:relative}
.strip::before,.strip::after{content:"";position:absolute;right:.5em;left:.5em;height:.7em;background:repeating-linear-gradient(90deg,#f8fafc 0 .7em,transparent .7em 1.6em);border-radius:3px}
.strip::before{top:.35em}.strip::after{bottom:.35em}
.frame{background:#fff7e6;border:3px solid var(--gold);border-radius:10px;padding:.5em .4em;text-align:center;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.82em;line-height:1.35}
.frame .n{width:1.8em;height:1.8em;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.frame.seen{opacity:.55}
/* modal */
.modal{position:fixed;inset:0;background:rgba(11,31,58,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:4vmin}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:20px;max-width:900px;width:100%;padding:clamp(14px,3vh,30px);box-shadow:var(--sh);animation:fadeIn .25s}
.modal .box .q{font-size:1.5em}
/* menu drawer */
.drawer{position:fixed;top:var(--hdr);bottom:0;right:0;width:min(420px,88vw);background:#fff;z-index:50;transform:translateX(105%);transition:.3s;box-shadow:var(--sh);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer h3{margin:0;padding:.6em .9em;background:var(--accentL);color:var(--navy)}
.drawer ol{list-style:none;margin:0;padding:.3em;overflow:auto;flex:1}
.drawer li button{width:100%;text-align:right;background:none;color:var(--text);padding:.45em .7em;display:flex;gap:.5em;align-items:center;border-radius:10px}
.drawer li button:hover,.drawer li button.cur{background:var(--accentL)}
.drawer li .ph{font-size:.7em;border-radius:99px;padding:.1em .5em;color:#fff;flex:none}
.drawer li .vis{margin-inline-start:auto;color:var(--green)}
/* pen */
#penCanvas{position:fixed;inset:0;z-index:40;pointer-events:none;touch-action:none}
body.pen #penCanvas{pointer-events:auto}
#penBar{position:fixed;left:14px;top:calc(var(--hdr) + 12px);z-index:45;background:#fff;border-radius:14px;box-shadow:var(--sh);display:none;padding:.3em;gap:.3em;align-items:center;font-size:.85em}
body.pen #penBar{display:flex}
#penBar .grip{cursor:move;padding:.3em .4em;color:var(--muted);touch-action:none}
#penBar button{width:2.2em;height:2.2em;background:#e2e8f0;color:var(--navy);padding:0}
#penBar button.on{outline:3px solid var(--navy)}
#penBar .sw{border-radius:50%}
/* toast */
.toast{position:fixed;bottom:calc(var(--ftr) + 12px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.5em 1.2em;border-radius:99px;z-index:70;display:none}
.toast.show{display:block;animation:fadeIn .3s}
/* stat */
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:.4em}
.stat b{font-size:2.3em;line-height:1.1;color:var(--accent)}
.meter{height:1.1em;background:#e2e8f0;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width .25s}
input[type=range]{width:100%;accent-color:var(--accent);height:2em}
table.data{border-collapse:collapse;width:100%;font-size:.9em}
table.data th,table.data td{border:1px solid var(--line);padding:.25em .4em;text-align:center}
table.data th{background:var(--accentL);color:var(--navy)}
.lvl{border-radius:14px;padding:.5em .7em;color:#fff}
.lvl.l1{background:#0e7490}.lvl.l2{background:#7c3aed}.lvl.l3{background:#c2410c}
.kbd{display:inline-block;background:#e2e8f0;border-radius:8px;padding:0 .4em}

.tans{display:none;color:var(--green);font-size:.8em}
body.teacher .tans{display:inline}
.tonly{display:none!important}
body.teacher .tonly{display:inline-block!important}

svg{direction:ltr}
bdi.fm{direction:ltr;unicode-bidi:isolate}
.mgrid{display:grid;gap:.45em}
.mgrid.two{grid-template-columns:1fr 1fr}
.lab-split>.card{overflow:auto;scrollbar-width:thin}
.lab-split .data{font-size:.8em}.lab-split .data td,.lab-split .data th{padding:.15em .3em}
.lab-split .fb{font-size:.92em;padding:.35em .6em}
.lab-split .rv .q{font-size:.95em}
</style></head><body>
<script>/* ===== Core: navigation, modes, pen, widgets (offline, no libraries) ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function f(s) { // chemistry formula markup: H_2O -> H<sub>2</sub>O ; Na^+ -> Na<sup>+</sup>
  s = s.replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>');
  return s.replace(/(^|[^\w<\/])([0-9]*[A-Z][a-z]?(?:<su[bp]>[^<]*<\/su[bp]>|[A-Z][a-z]?|[0-9\u2080-\u2089\u00b2\u00b3\u2070-\u207b])*)(?![\w>])/g, (all, p, m) => p + (/<su|[0-9\u2080-\u2089\u00b2\u00b3\u2070-\u207b]|[A-Z].*[A-Z]/.test(m) ? '<bdi class="fm">' + m + '</bdi>' : m));
}
/* sound */
let AC = null;
function beep(ok) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime; o.type = 'sine';
    if (ok) { o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + .1); }
    else { o.frequency.setValueAtTime(260, t); o.frequency.setValueAtTime(200, t + .12); }
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .3); o.start(t); o.stop(t + .32);
  } catch (e) { }
}
function toast(msg) { let t = $('.toast'); if (!t) { t = h('<div class="toast"></div>'); document.body.appendChild(t); } t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
const PH = { 'إثارة الفضول': '#ea7a0c', 'الاستكشاف': '#0891b2', 'بناء المفهوم': '#1d4ed8', 'التطبيق': '#6d28d9', 'التقويم': '#15803d' };

/* ===== Lesson shell ===== */
const Lesson = {
  init(cfg) {
    this.cfg = cfg; this.i = 0; this.key = 'ch7_' + cfg.id;
    document.documentElement.style.setProperty('--accent', cfg.accent || '#0891b2');
    document.documentElement.style.setProperty('--accentL', cfg.accentL || '#ddf4fa');
    document.title = cfg.title;
    document.body.insertAdjacentHTML('afterbegin', `
<header class="top"><button class="hbtn" id="mBtn" aria-label="قائمة">☰ القائمة</button>
<div class="ttl">${cfg.title}<small>${cfg.sub || ''}</small></div>
${cfg.platform ? '' : '<button class="hbtn" id="penBtn">✎ القلم</button>'}<button class="hbtn" id="modeBtn"></button>
${cfg.home ? `<a class="hbtn" id="homeBtn" href="${cfg.home}" style="text-decoration:none">⌂ ${cfg.platform ? 'المنصة' : 'الفصل'}</a>` : ''}
<div class="prog"><i></i></div></header>
<main id="stage"></main>
<footer class="nav"><button class="nbtn" id="prevBtn">→ السابق</button><span class="phase" id="phase"></span><span class="count" id="count"></span><button class="nbtn next" id="nextBtn">التالي ←</button></footer>
<nav class="drawer" id="drawer"><h3>محتويات ${cfg.short || 'الدرس'}</h3><ol></ol></nav>
${cfg.platform ? '' : `<canvas id="penCanvas"></canvas>
<div id="penBar"><span class="grip">⠿</span><button data-c="#dc2626" class="sw on" style="background:#dc2626"></button><button data-c="#1d4ed8" class="sw" style="background:#1d4ed8"></button><button data-c="#16a34a" class="sw" style="background:#16a34a"></button><button data-c="#111827" class="sw" style="background:#111827"></button><button id="eraser" title="ممحاة">⌫</button><button id="clearPen" title="مسح">🗑</button><button id="closePen" title="إغلاق">✕</button></div>`}
<div class="modal" id="modal"><div class="box"></div></div>`);
    const stage = $('#stage');
    this.visited = new Set(store.get(this.key + '_v', []));
    cfg.screens.forEach((s, k) => {
      const el = h(`<section class="screen" data-i="${k}"><h2>${s.title}${s.tag ? `<span class="tag">${s.tag}</span>` : ''}</h2></section>`);
      const b = document.createElement('div'); b.className = 'body ' + (s.layout || '');
      if (s.html) b.innerHTML = s.html;
      el.appendChild(b); stage.appendChild(el); s.el = el; s.body = b;
      if (s.init) try { s.init(b, el); } catch (e) { console.error('init', k, e); }
      enhance(b);
    });
    const ol = $('#drawer ol');
    cfg.screens.forEach((s, k) => {
      const li = h(`<li><button data-k="${k}"><span class="ph" style="background:${PH[s.phase] || '#64748b'}">${s.phase || ''}</span><span>${k + 1}. ${s.title.replace(/<[^>]+>/g, '')}</span><span class="vis"></span></button></li>`);
      li.querySelector('button').onclick = () => { this.go(k); $('#drawer').classList.remove('open'); };
      ol.appendChild(li);
    });
    $('#mBtn').onclick = () => $('#drawer').classList.toggle('open');
    $('#prevBtn').onclick = () => this.go(this.i - 1);
    $('#nextBtn').onclick = () => this.go(this.i + 1);
    $('#modeBtn').onclick = () => this.setMode(!document.body.classList.contains('teacher'));
    this.setMode(store.get('ch7_teacher', true));
    document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (e.key === 'ArrowLeft') this.go(this.i + 1); if (e.key === 'ArrowRight') this.go(this.i - 1); });
    $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
    if (!cfg.platform) Pen.init();
    const hb = $('#homeBtn');
    if (hb && cfg.platform) hb.onclick = e => { try { if (window.parent && window.parent !== window) { e.preventDefault(); window.parent.postMessage({ type: 'durus-nav', to: 'list', chapter: cfg.chapterKey || '' }, '*'); } } catch (x) { } };
    const start = Math.min(store.get(this.key + '_i', 0), cfg.screens.length - 1);
    const hash = parseInt((location.hash || '').replace('#s', ''));
    this.go(isNaN(hash) ? start : hash - 1, true);
  },
  setMode(t) {
    document.body.classList.toggle('teacher', t); store.set('ch7_teacher', t);
    $('#modeBtn').textContent = t ? '👨‍🏫 وضع المعلم' : '🎓 وضع الطالب';
    $('#modeBtn').classList.toggle('on', t);
  },
  go(k, first) {
    const S = this.cfg.screens; if (k < 0 || k >= S.length) return;
    Pen.save(this.i);
    S.forEach(s => s.el.classList.remove('active'));
    this.i = k; const s = S[k]; s.el.classList.add('active');
    if (s.onShow) try { s.onShow(s.body, s.el); } catch (e) { console.error(e); }

    draw(); if (run) raf = requestAnimationFrame(loop); }
  body.querySelector('.go').onclick = () => { if (run) return; setup(); run = true; loop(); };

      init(b) { mount(b.querySelector('.tfw'), W.tf({ items: D.L.tf.slice(0, 6).map(a => ({ t: a[0], v: a[1], why: a[2] })) })); } };
  },
  lab(title, func, tag, phase) {
    return { title, tag: tag || 'مختبر افتراضي', phase: phase || 'الاستكشاف', init(b) { window[func](b); }, onShow(b) { b._onShow && b._onShow(); } };
  },
  cards(title, tag, phase, items, cols) { // items: [[head, body, color?]]
    return { title, tag, phase: phase || 'بناء المفهوم', layout: 'rows',
      html: `<div></div><div style="display:grid;grid-template-columns:repeat(${cols || 2},1fr);gap:.6em;min-height:0">${items.map(it => `<div class="card" style="border-top:6px solid ${it[2] || 'var(--accent)'};display:flex;flex-direction:column;gap:.3em;justify-content:center"><h3 style="color:${it[2] || 'var(--accent)'}">${f(it[0])}</h3><div class="big">${f(it[1])}</div></div>`).join('')}</div>` };
  },
  exit(qs) {
    return { title: 'بطاقة الخروج', tag: '3 دقائق', phase: 'التقويم', layout: 'rows',
      html: `<div class="muted">أجب في دفترك ثم تحقّق.</div><div style="display:flex;flex-direction:column;gap:.5em;overflow:auto;min-height:0">${qs.map(q => `<div class="card rv" data-think data-a="${esc(q[1])}">${f(q[0])}</div>`).join('')}</div>` };
  },
  levels(items) { // [[level, q, a]]
    const C = ['#16a34a', '#2563eb', '#7c3aed'];
    return { title: 'تحديات بثلاثة مستويات', tag: 'مراعاة الفروق', phase: 'التطبيق', layout: 'rows',
      html: `<div class="muted">اختر المستوى المناسب لك، ثم انتقل إلى الأعلى.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;min-height:0">${items.map((it, k) => `<div class="card" style="border-top:6px solid ${C[k]};display:flex;flex-direction:column;gap:.4em"><span class="pill" style="background:${C[k]};color:#fff;align-self:flex-start">${it[0]}</span><div class="rv" data-a="${esc(it[2])}">${f(it[1])}</div></div>`).join('')}</div>` };
  },
  inquiry(labFunc) {
    const Q = D.INQ, out = [];
    out.push({ title: Q.kind + ': ' + Q.title, tag: 'ص ' + Q.page, phase: 'الاستكشاف', layout: 'cols',
      html: `<div class="card" style="display:flex;flex-direction:column;gap:.4em"><h3>سؤال من واقع الحياة</h3><p>${f(Q.q)}</p><h3>الأهداف</h3><ul class="list">${Q.goals.map(g => `<li>${g}</li>`).join('')}</ul></div>
      <div class="card" style="display:flex;flex-direction:column;gap:.4em"><h3>المواد والأدوات</h3><ul class="list" style="columns:2">${Q.materials.map(m => `<li>${m}</li>`).join('')}</ul>
      <div class="pill" style="background:#fee2e2;color:#991b1b;white-space:normal">⚠ ${Q.warn}</div><div class="rv" data-think data-a="${esc(Q.hyp_a)}">تكوين فرضية: ${Q.hyp}</div></div>` });
    out.push({ title: 'تصميم الخطة وتنفيذها', tag: Q.kind, phase: 'الاستكشاف', layout: 'cols',
      html: `<div class="card"><h3>تصميم خطة</h3><ol class="list">${Q.plan.map(p => `<li>${p}</li>`).join('')}</ol></div>
      <div class="card" style="display:flex;flex-direction:column;gap:.4em"><h3>تنفيذ الخطة</h3><ol class="list"><li>تأكّد من موافقة معلمك على خطتك قبل تنفيذها.</li><li>نفّذ خطة العمل.</li><li>دوّن قياساتك مباشرة في جدول البيانات.</li><li>احسب متوسط نتائج محاولاتك.</li></ol><div class="tint card" style="box-shadow:none">🧪 جرّب الاستقصاء افتراضيًّا في الشاشة التالية.</div></div>` });
    if (labFunc) out.push(S.lab('الاستقصاء افتراضيًّا', labFunc, 'محاكاة الاستقصاء'));
    out.push({ title: 'تحليل البيانات والاستنتاج', tag: Q.kind, phase: 'التطبيق', layout: 'rows',
      html: `<div class="muted">${Q.comm}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:.5em;overflow:auto;min-height:0">${Q.analysis.concat(Q.concl).map((a, k) => `<div class="card rv" data-a="${esc(a[1])}">${k < Q.analysis.length ? 'تحليل' : 'استنتاج'} ${k < Q.analysis.length ? k + 1 : k - Q.analysis.length + 1}: ${f(a[0])}</div>`).join('')}</div>` });
    return out;
  },
  scihist(img) {
    const Q = D.SCI;
    return { title: Q.kind + ': ' + Q.title, tag: 'ص ' + Q.page, phase: 'التطبيق', layout: 'cols-2-1',
      html: `<div class="hero"><img src="${img}" alt=""><div class="over"><h3>${Q.kind}</h3><p>${Q.title}</p></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:.4em;justify-content:center"><ul class="list">${Q.points.map(p => `<li>${f(p)}</li>`).join('')}</ul><div class="tint card" style="box-shadow:none">🔎 ${Q.task}</div></div>` };
  },
  links(items) { // [[title, url, sub]]
    return { title: 'المختبرات الافتراضية والأنشطة', tag: 'روابط', phase: 'التطبيق', layout: 'rows',
      html: `<div class="muted">افتح أي مختبر في صفحة مستقلة على المنصة.</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:.6em;align-content:start">${items.map(i => `<a href="${i[1]}" target="_blank" class="card" style="text-decoration:none;color:var(--navy);display:flex;justify-content:space-between;align-items:center"><b>🧪 ${i[0]}</b><span class="pill" style="background:var(--accentL);color:var(--accent)">${i[2] || 'فتح'}</span></a>`).join('')}</div>` };
  }
};
