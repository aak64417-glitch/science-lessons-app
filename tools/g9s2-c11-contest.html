ة"], "a": 2, "ex": "البلاستيك والخشب والزجاج لا تتحرك فيها الإلكترونات بسهولة."}, {"q": "من أمثلة أشباه الموصلات:", "o": ["السليكون", "النحاس", "الخشب", "الزجاج"], "a": 0, "ex": "الجرمانيوم والسليكون من أشباه الموصلات."}, {"q": "كرتان مشحونتان بشحنتين سالبتين:", "o": ["تتجاذبان", "تتنافران", "لا تؤثر إحداهما في الأخرى", "تتعادلان"], "a": 1, "ex": "الشحنات المتشابهة تتنافر (الشكل 3)."}, {"q": "ماذا يحدث للقوة الكهربائية بين جسمين مشحونين عند زيادة المسافة بينهما؟", "o": ["تزداد", "تقل", "لا تتغير", "تنعدم فورًا"], "a": 1, "ex": "تزداد القوة كلما قلّت المسافة، وتقل بزيادتها."}, {"q": "الحيز الذي يحيط بالشحنة وتظهر فيه آثارها الكهربائية:", "o": ["المقاومة", "المجال الكهربائي", "الدائرة", "التيار"], "a": 1, "ex": "هذا تعريف المجال الكهربائي."}, {"q": "من أمثلة التفريغ الكهربائي:", "o": ["البرق", "ذوبان الملح", "تجمد الماء", "تدحرج الكرة"], "a": 0, "ex": "البرق والصاعقة أمثلة على انتقال الشحنات الفائضة."}, {"q": "يقاس التيار الكهربائي بوحدة:", "o": ["الفولت", "الأوم", "الأمبير", "الواط"], "a": 2, "ex": "الأمبير (A) وحدة قياس التيار."}, {"q": "يقاس الجهد الكهربائي بوحدة:", "o": ["الأمبير", "الفولت", "الأوم", "الكيلوواط.ساعة"], "a": 1, "ex": "الفولت (V) وحدة قياس الجهد."}, {"q": "في النموذج المائي للدائرة الكهربائية، تقابل المضخةُ:", "o": ["السلك", "المصباح", "البطارية", "المقاومة"], "a": 2, "ex": "البطارية تزيد طاقة الوضع الكهربائية للإلكترونات كما تزيد المضخة طاقة وضع الماء."}, {"q": "تتدفق الإلكترونات في الدائرة الخارجية:", "o": ["من القطب الموجب إلى السالب", "من القطب السالب إلى الموجب", "داخل المصباح فقط", "في اتجاهين معًا"], "a": 1, "ex": "الشكل 6: تخرج من القطب السالب وتعود إلى القطب الموجب."}, {"q": "مصدر الإلكترونات عند الطرف السالب في البطارية القلوية:", "o": ["ثاني أكسيد المنجنيز", "الخارصين (الزنك)", "النحاس", "الكربون"], "a": 1, "ex": "يعد الخارصين مصدرًا للإلكترونات عند الطرف السالب."}, {"q": "تقاس المقاومة الكهربائية بوحدة:", "o": ["الأوم", "الفولت", "الأمبير", "الواط"], "a": 0, "ex": "الأوم (Ω) وحدة المقاومة، تخليدًا للعالم جورج سيمون أوم."}, {"q": "أيّ الأ
