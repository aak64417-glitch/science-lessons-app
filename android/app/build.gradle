plugins { id 'com.android.application' }
android {
    namespace 'sa.ali.durus'
    compileSdk 34
    defaultConfig {
        applicationId 'sa.ali.durus'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        app {
            storeFile file('durus.keystore')
            storePassword 'durus2026'
            keyAlias 'durus'
            keyPassword 'durus2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.app } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
