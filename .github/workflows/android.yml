name: بناء تطبيق أندرويد
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk durus-al-uloom.apk
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest durus-al-uloom.apk --title "تطبيق دروس العلوم" --notes "نزّل ملف durus-al-uloom.apk وثبّته على التابلت." --latest
